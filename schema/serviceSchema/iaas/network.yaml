type: object
description: >-
  The Network for Computing IaaS. Reference MEF W132 Section 7.5 Network Building Block.
properties:
  cloudUni:
    description: >-
      The demarcation point marking the boundary between the responsibility of the Cloud
      Subscriber and the Cloud Service Provider.
    $ref: "./cloudUni.yaml"
  cloudVcEndPoint:
    description: >-
      A logical construct at a Cloud UNI, or Cloud Application Interface to which a subnet 
      of the Cloud Service Protocol Data Units (PDUs) passing over that interface is mapped.
    $ref: "./cloudVcEndPoint.yaml"
  cloudVc:
    description: >- 
      An association of two or more Cloud VC End Points.
    $ref: "./cloudVc.yaml"