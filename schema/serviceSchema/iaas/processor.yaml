type: object
description: >-
  IaaS Host Operating System. Reference MEF W132 Section 8.3 Processor Service Attributes
properties:
  manufacturerIdentifier:
    description: >-
      The Processor Manufacturer. Reference MEF W132 Section 8.3.1
      Manufacturer Identifier Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/ManufacturerIdentifier"
  modelIdentifier:
    description: >-
      Manufacturer model identifier. Reference MEF W132 Section 8.3.2
      Manufacturer Model Identifier Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/ManufacturerIdentifier"  
  packageType:
    description: >-
      The access to the processor provided. 
    type: string
    enum:
      - BINARY
      - SOURCE 
  processorType:
    description: >-
      Specifies the architecture and machine language of the processor.
      Reference MEF W132 Section 8.3.3 Processor Type Service Attribute.
    type: string
    enum:
      - X86
      - ARM
      - OTHER
      - UNSPECIFIED
  clockSpeedRange:
    description: >-
      Specifies the minimum and maximum speed of the processor. Reference MEF W132
      Section 8.3.4 Clock Speed Range Service Attribute.
    clockSpeedRange:
      $ref: "./iaasCommon.yaml#/definitions/ClockSpeedRange"
  numberOfCores:
    description: >-
      Specifies the number of cores supported by the processor. Reference MEF W132
      Section 8.3.5 Number of Cores Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/NumberOfCores"
  numberOfThreads:
    description: >-
      Specifies the number of threads that the processor supports. Reference MEF W132
      Section 8.3.6 Number of Threads Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/NumberOfThreads"
  level1CacheSize:
    description: >-
      Specifies the size of the level 1 cache that the processor supports. Reference MEF W132
      Section 8.3.7 Level 1 Cache Size Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/CacheSize"
  level2CacheSize:
    description: >-
      Specifies the size of the level 2 cache that the processor supports. Reference MEF W132
      Section 8.3.8 Level 2 Cache Size Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/CacheSize"
  instructionsPerClockCycle:
    description: >-
      Specifies the the number of machine instructions executed per clock cycle by the processor.
      Its value is an integer > 0 in thousands or Unspecified.
      Reference MEF W132 Section 8.3.9 Instructions per Clock Cycle Service Attribute.
    $ref: "./iaasCommon.yaml#/definitions/InstructionsPerClockCycle"