    EthernetPhysicalLink:
      description: Data type representing UNI Access Link Trunk List of Ethernet Physical
        Links as defined in MEF 61.1.1 Section A1-1.3.1.
      properties:
        identifier:
          $ref: '#/components/schemas/IdentifierString'
          description: |
            Identifier of the Physical LInk
        physicalLayer:
          $ref: '#/components/schemas/EthernetPhysicalLayer'
          description: |
            Enumeration representing the different Ethernet physical layers. Reference - MEF 61.1.1 Table A1-4 Ethernet PHYs for UNI Access Link Trunks.
        synchronousEthernet:
          $ref: '#/components/schemas/SynchronousEthernet'
          description: Enumeration indicating if the physical link supports Synchronous
            Ethernet.
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
          description: Enumeration representing type of connector presented to Subscriber.
        gender:
          $ref: '#/components/schemas/Gender'
          description: |
            Enumeration representing the gender of the connector presented to the Subscriber.
      type: object
    EthernetUniAccessLinkTrunk:
      description: A single point-to-point physical Ethernet channel or multiple physical
        Ethernet links combined into a Link Aggregation Group. The Ethernet frames
        associated with a given UNI Access Link can be either untagged/priority-tagged
        or VLAN tagged. Reference - MEF 61.1.1 A1-1.3 Ethernet UNI Access Link Trunk
        Service Attributes.
      properties:
        ethernetPhysicalLink:
          description: A list of the physical link types along with some additional
            capabilities
          items:
            $ref: '#/components/schemas/EthernetPhysicalLink'
          minItems: 1
          type: array
        ethernetLinkAggregation:
          $ref: '#/components/schemas/UniAccessLinkEthernetLinkAggregation'
          description: Configuration of Link Aggregation for the UNI Access Link Trunk.
        ethernetLinkOam:
          $ref: '#/components/schemas/EnabledDisabled'
          description: Indicates whether Link OAM is used on the UNI Access Link Trunk.
      type: object
    EventSubscription:
      description: |
        This resource is used to respond to notification subscriptions.
      properties:
        callback:
          description: The value provided by in `EventSubscriptionInput` during notification
            registration
          type: string
        id:
          description: An identifier of this Event Subscription assigned when a resource
            is created.
          type: string
        query:
          description: The value provided by the `EventSubscriptionInput` during notification
            registration
          type: string
      required:
      - callback
      - id
      type: object
    EventSubscriptionInput:
      description: This class is used to register for Notifications.
      properties:
        callback:
          description: "This callback value must be set to *host* property from Service\
            \ Order Notification API (serviceOrderNotification.api.yaml). This property\
            \ is appended with the base path and notification resource path specified\
            \ in that API to construct an URL to which notification is sent. E.g.\
            \ for \"callback\": \"https://client.mef.com/listenerEndpoint\", the service\
            \ order state change event notification will be sent to: `https://client.mef.com/listenerEndpoint/mefApi/legato/serviceOrderingManagement/v6/listener/serviceOrderStateChangeEvent`"
          type: string
        query:
          description: "This attribute is used to define to which type of events to\
            \ register to. Example: \"query\":\"eventType = serviceOrderStateChangeEvent\"\
            . To subscribe for more than one event type, put the values separated\
            \ by comma: `eventType=serviceOrderStateChangeEvent,serviceOrderItemStateChangeEvent`.\
            \ The possible values are enumerated by 'serviceOrderEventType' in serviceOrderNotification.api.yaml.\
            \ An empty query is treated as specifying no filters - ending in subscription\
            \ for all event types."
          type: string
      required:
      - callback
      type: object
    ExternalInterfaceType:
      description: Enumeration representing the different External Interface types.
      enum:
      - UNI
      - ENNI
      type: string
    FieldedAddressRepresentation:
      description: "A type of Address that has a discrete field and value for each\
        \ type of boundary or identifier down to the lowest level of detail. For example\
        \ \"street number\" is one field, \"street name\" is another field, etc."
      properties:
        streetNr:
          description: Number identifying a specific property on a public street.
            It may be combined with streetNrLast for ranged addresses.
          type: string
        streetNrSuffix:
          description: The first street number suffix (in a street number range) or
            the suffix for the street number if there is no range
          type: string
        streetNrLast:
          description: Last number in a range of street numbers allocated to an Address
          type: string
        streetNrLastSuffix:
          description: Last street number suffix for a ranged Address
          type: string
        streetPreDirection:
          description: The direction of the street that appears before the Street
            Name
          type: string
        streetName:
          description: Name of the street or other street type
          type: string
        streetType:
          description: "The type of street (e.g., alley, avenue, boulevard, brae,\
            \ crescent, drive, highway, lane, terrace, parade, place, tarn, way, wharf)"
          type: string
        streetPostDirection:
          description: A modifier denoting a relative direction that appears after
            the Street Name.
          type: string
        poBox:
          description: Number identifying a specific location in a post office.
          type: string
        locality:
          description: An area of defined or undefined boundaries within a local authority
            or other legislatively defined area.
          type: string
        city:
          description: City in which the Address is located.
          type: string
        postcode:
          description: A descriptor for a postal delivery area used to speed and simplify
            the delivery of mail (also known as zip code)
          type: string
        postcodeExtension:
          description: "The extension used on a postal code. Note: there are different\
            \ use codes for this attribute depending upon the country."
          type: string
        stateOrProvince:
          description: The State or Province in which the Address is located.
          type: string
        countryCode:
          description: "Country in which the Address is located, defined using two\
            \ characters as defined in ISO 3166"
          maxLength: 2
          minLength: 2
          type: string
        subUnit:
          description: The Sub Unit represented as a list. This is a list to allow
            complex sub-unit information such as SUITE 42 ROOM A
          items:
            $ref: '#/components/schemas/SubUnit'
          type: array
        buildingName:
          description: |
            The well-known name of a building that is located at this Address (e.g., where there is one Address for a campus).
          type: string
        privateStreetNumber:
          description: Street number on a private street within the Address.
          type: string
        privateStreetName:
          description: "Private streets internal to a property (e.g., a university)\
            \ may have internal names that are not recorded by the land title office."
          type: string
        language:
          description: The language in which the address is expressed. It MUST use
            the ISO 639:2023 two letter code 639:2023
          maxLength: 2
          minLength: 2
          type: string
      type: object
    FormattedAddressRepresentation:
      description: 'A freeform text representation agreed to by the BUS and SOF. '
      properties:
        formattedAddress:
          description: A formatted Address Representation that contains a non-fielded
            address.
          type: string
        language:
          description: The language in which the address is expressed. Based on ISO
            639:2023
          maxLength: 2
          minLength: 2
          type: string
      required:
      - formattedAddress
      type: object
    ForwardingInformation:
      description: "Forwarding information, consisting of either a nexthop IP address\
        \ in the Subscriber Network (if the access medium is multipoint capable, e.g.,\
        \ Ethernet), or a specific UNI Access Link (if the access medium is strictly\
        \ point-to-point, e.g., HDLC, PPP over DSL)."
      maxProperties: 1
      minProperties: 1
      properties:
        nextHopIpAddress:
          $ref: '#/components/schemas/Ipv4OrIpv6Address'
          description: Next hop IP address.
        uniAccessLink:
          $ref: '#/components/schemas/IdentifierString'
          description: UNI Access Link identifier as set by the Buyer in IpUniAccessLink.identifier
            attribute.
      type: object
    FourOctetInteger:
      description: A four-octet value range integer 0-4294967295
      format: int64
      maximum: 4294967295
      minimum: 0
      type: integer
    Gender:
      description: Enumeration representing the gender of the connector presented
        to the Subscriber.
      enum:
      - SOCKET
      - PLUG
      type: string
    GeographicAddressRef:
      allOf:
      - $ref: '#/components/schemas/PlaceRefOrQuery'
