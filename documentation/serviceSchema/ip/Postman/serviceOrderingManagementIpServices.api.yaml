      properties:
        burstBehavior:
          $ref: '#/components/schemas/BurstBehavior'
        cir:
          $ref: '#/components/schemas/InformationRate'
        flowIdentifier:
          description: Identifier for the BWP Flow within the BWP Envelope. Unique
            integer  between 1 and n where n is the number of BWP Flows in the BWP
            Envelope.  Reference MEF 61.1 Table 29 - Bandwidth Profile Parameters
            for a   Bandwidth Profile Flow.
          type: integer
        maxIr:
          $ref: '#/components/schemas/InformationRate'
        weight:
          description: 'Identifier for Weight as an integer greater than or equal
            to 0. Relative  weight for this BWP Flow compared to other BWP Flows in
