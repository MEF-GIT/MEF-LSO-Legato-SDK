openapi: 3.0.1
info:
  description: "**This file forms part of Mplify 99.1** \n \n\nSupported use cases:\n\
    - Create Service Order\n- Retrieve List of Service Orders\n- Retrieve Service\
    \ Order by Service Order Identifier\n- Register for Notifications\n\nCopyright\
    \ 2025 Mplify Alliance and its contributors.\n\nThis file includes content based\
    \ on the TM Forum Service Order API (TMF641\nv4.1.0) available at https://github.com/tmforum-apis/TMF641_ServiceOrder,\n\
    which is licensed by the TM Forum under the Apache License version 2.0. Such\n\
    content has been modified by the Mplify Alliance and its contributors.\n"
  title: Service Ordering Management
  version: 6.0.0
servers:
- url: "https://{serverBase}/mefApi/legato/serviceOrderingManagement/v6/"
  variables:
    serverBase:
      default: mplify.net
      description: The base of SOF's URL.
tags:
- description: Operations for Service Order Resource
  name: Service Order
- description: Endpoints to register and terminate an Event Listener
  name: Events subscription
paths:
  /serviceOrder:
    get:
      description: This operation retrieves list of ServiceOrder entities.
      operationId: listServiceOrder
      parameters:
      - description: State of the Service Order
        in: query
        name: state
        required: false
        schema:
          $ref: '#/components/schemas/ServiceOrderStateType'
      - description: Date when the order was created greater than
        in: query
        name: orderDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the order was created lesser than
        in: query
        name: orderDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Effective completion date greater than
        in: query
        name: completionDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Effective completion date lesser than
        in: query
        name: completionDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Expected delivery date greater than
        in: query
        name: expectedCompletionDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Expected delivery date lesser than
        in: query
        name: expectedCompletionDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the order was started for processing
        in: query
        name: startDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the order was started for processing
        in: query
        name: startDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Requested index for start of item to be provided in response
          requested by the client. Note that the index starts with "0".
        in: query
        name: offset
        required: false
        schema:
          format: int32
          type: integer
      - description: Requested number of items to be provided in response requested
          by client
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceOrder'
                type: array
          description: OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)
          headers:
            X-Pagination-Throttled:
              description: |
                Used to indicate that result page was throttled to maximum possible size  and there are additional results that can be fetched
              schema:
                type: boolean
            X-Total-Count:
              description: |
                The total number of matching items. E.g. if there are 50 matching items in total, but the request has offset=10 and limit=10, then the X-Total-Count is 50.
              schema:
                type: integer
            X-Result-Count:
              description: The number of items included in the response
              schema:
                type: integer
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: List or find ServiceOrder objects
      tags:
      - Service Order
    post:
      description: This operation creates a ServiceOrder entity.
      operationId: createServiceOrder
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ServiceOrder_Create'
        description: The ServiceOrder to be created
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
          description: Created (https://tools.ietf.org/html/rfc7231#section-6.3.2)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Creates a ServiceOrder
      tags:
      - Service Order
  /serviceOrder/{id}:
    get:
      description: This operation retrieves a ServiceOrder entity.
      operationId: retrieveServiceOrder
      parameters:
      - description: Identifier of the ServiceOrder
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
          description: OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Retrieves a ServiceOrder by ID
      tags:
      - Service Order
  /hub:
    post:
      description: "Sets the communication endpoint address the service instance must\
        \ use to deliver information about its health state, execution state, failures\
        \ and metrics."
      operationId: registerListener
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/EventSubscriptionInput'
        description: Data containing the callback endpoint to deliver the information
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Subscribed
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Register a listener
      tags:
      - Events subscription
  /hub/{id}:
    delete:
      description: "Resets the communication endpoint address the service instance\
        \ must use to deliver information about its health state, execution state,\
        \ failures and metrics."
      operationId: unregisterListener
      parameters:
      - description: The id of the registered listener
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Unregister a listener
      tags:
      - Events subscription
    get:
      description: This operation retrieves a EventSubscription entity.
      operationId: retrieveEventSubscription
      parameters:
      - description: Identifier of the EventSubscription
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Success
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Retrieves a EventSubscription by ID
      tags:
      - Events subscription
components:
  schemas:
    AccessLinkBfd:
      description: The Access Link BFD Service Attribute indicates whether Bidirectional
        Forwarding Detection (BFD) is enabled on the UNI Access Link. Reference MEF
        61.1 Section 13.8 and Section 16.5
      properties:
        connectionAddressFamily:
          $ref: '#/components/schemas/AddressFamilyIpv4Ipv6Both'
          description: The Connection Address Family parameter specifies whether the
            session is established over IPv4 or IPv6 or whether two separate sessions
            are established using IPv4 and IPv6. Reference - MEF 61.1 Section 13.8
            and 16.5
        transmissionInterval:
          description: Transmission Interval Reference - MEF 61.1 Section 13.8 and
            16.5
          minimum: 0
          type: integer
        detectMultiplier:
          description: BFD Detect multiple as an Integer. Reference - MEF 61.1 Section
            13.8 and 16.5 Attribute.
          minimum: 0
          type: integer
        activeEnd:
          $ref: '#/components/schemas/BfdActiveEnd'
          description: "BFD Active End. At least one end of BFD session has to have\
            \ an active role, meaning that it sends out asynchronous control messages\
            \ regardless of whether it has received any. Reference - MEF 61.1 Section\
            \ 13.8"
        authenticationType:
          $ref: '#/components/schemas/BfdAuthenticationType'
          description: BFD Authentication as describer in RFC 5880. Reference - MEF
            61.1 Section 13.8 and 16.5
      type: object
    AddressFamilyIpv4Ipv6:
      description: Specifies whether the session is established over IPv4 or IPv6.
      enum:
      - IPV4
      - IPV6
      type: string
    AddressFamilyIpv4Ipv6Both:
      description: Specifies whether the session is established over IPv4 or IPv6
        or whether two separate session are established using IPv4 and IPv6.
      enum:
      - IPV4
      - IPV6
      - BOTH
      type: string
    BfdActiveEnd:
      description: |
        At least one end of the BFD session must have an active role, meaning that
        it sends out asynchronous control messages regardless of whether it has
        received any. This enumeration represents the values that can be set for
        the BFD Active End. Reference - MEF 61.1 Section 13.8 [R171] and [R172].
        - SUBSCRIBER: Subscriber takes active BFD role.
        - SP: Service Provider takes active BFD role.
        - BOTH: Subscriber and Service Provider take active BFD role.
      enum:
      - SUBSCRIBER
      - SP
      - BOTH
      type: string
    BfdAuthenticationType:
      description: "Enumeration of possible BFD Authentication Type, as specified\
        \ by\nRFC 5880 [4]. In case other than `NONE` is specified additional\nspecific\
        \ parameters need to be agreed between the Buyer and the Seller. \n- NONE:\
        \ No BFD authentication.\n- SIMPLE_PASSWORD: Simple Password Authentication\
        \ is the most \nstraightforward (and weakest) form of authentication. In this\
        \ method\nof authentication one or more Passwords (with corresponding Key\
        \ IDs) \nare configured in each system and one of these Password/ID pairs\
        \ is \ncarried in each BFD Control packet. The receiving system accepts the\
        \ \npacket if the Password and Key ID matches one of the Password/ID \npairs\
        \ configured in that system. Reference IETF RFC5880 Section 6.7.2.\n- KEYED_MD5:\
        \ The Keyed MD5 and Meticulous Key MD5 Authentication \nmechanisms are very\
        \ similar to those used in other protocols. \nIn these methods of authentication,\
        \ one or more security keys \n(with corresponding key IDs) are configured\
        \ in each system. \nReference RFC5880 Section 6.7.3\n- METICULOUS_KEYED_MD5:\
        \ The Keyed MD5 and Meticulous Key MD5 \nAuthentication mechanisms are very\
        \ similar to those used in other \nprotocols. In these methods of authentication,\
        \ one or more security\nkeys (with corresponding key IDs) are configured in\
        \ each system.\nReference RFC5880 Section \n- KEYED_SHA1: The Keyed SHA1 and\
        \ Meticulous Key SHA1 Authentication\nmechanisms are very similar to those\
        \ used in other protocols. In \nthese methods of authentication, one or more\
        \ secret keys (with \ncorresponding key IDs) are configured in each system.\
        \ Reference\nRFC5880 Section 6.7.4\n- METICULOUS_KEYED_SHA1: The Keyed SHA1\
        \ and Meticulous Key \nSHA1 Authentication mechanisms are very similar to\
        \ those used in\nother protocols. In these methods of authentication, one\
        \ or more \nsecret keys (with corresponding key IDs) are configured in each\
        \ system.\nReference RFC5880 Section 6.7.4\n"
      enum:
      - NONE
      - SIMPLE_PASSWORD
      - KEYED_MD5
      - METICULOUS_KEYED_MD5
      - KEYED_SHA1
      - METICULOUS_KEYED_SHA1
      type: string
    Bgp:
      description: "When an entry in the UNI Routing Protocol is for BGP, BGP as specified\
        \ in RFC 4271 is used across the UNI to exchange information. Reference -\
        \ MEF 61.1 Section 12.7.3."
      properties:
        subscriberAsNumber:
          $ref: '#/components/schemas/FourOctetInteger'
          description: BGP Subscriber Autonomous System number.
        peerAsNumber:
          $ref: '#/components/schemas/FourOctetInteger'
          description: BGP Peer Autonomous System Number.
        connectionAddressFamily:
          $ref: '#/components/schemas/AddressFamilyIpv4Ipv6'
          description: Connection Address Family (IPv4 or IPv6).
        peeringAddresses:
          $ref: '#/components/schemas/PeeringAddress'
          description: Peering Addresses.
        authentication:
          description: BGP Authentication. It is either empty list or if present is
            it a value of MD5 Password. It is assumed that an encrypted channel is
            used when this data is passed across the API so that the password is protected.
          items:
            type: string
          maxItems: 1
          type: array
        bgpCommunityList:
          description: "Used to control which routers are accepted, preferred, distributed,\
            \ or advertised."
          items:
            $ref: '#/components/schemas/BgpCommunity'
          type: array
        bgpExtendedCommunityList:
          description: "Mechanism for labeling information carried in BGP-4. Provide\
            \ enhancement over existing BGP Community Attribute an extended range,\
            \ the addition of type field."
          items:
            $ref: '#/components/schemas/BgpExtendedCommunity'
          type: array
        holdTime:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: Hold time in seconds. Indicates the agreed Hold Time used for
            BGP sessions. The possible values are 0 or an integer in the range 3-65535.
        damping:
          description: "Route flap damping. When the Damping parameter is empty, the\
            \ attribute is not set. When set - a single set of parameters described\
            \ in Section 4.3 of RFC 2430 MUST be agreed."
          items:
            $ref: '#/components/schemas/Damping'
          maxItems: 1
          type: array
        asOverride:
          $ref: '#/components/schemas/EnabledDisabled'
          description: "Autonomous System Override. The SP (or Operator) can overwrite\
            \ instances of the Subscriber's AS Number in the AS Path with their own\
            \ AS Number, when advertising routes to the Subscriber. This needs to\
            \ be explicitly agreed between the SP and the Subscriber, and/or between\
            \ an SP/SO and an Operator."
        administrativeDistance:
          description: BGP Administrative Distance.
          minimum: 1
          type: integer
      type: object
    BgpCommunity:
      description: |
        A community is a group of destinations which share some common property. Each autonomous system administrator may define which communities a destination belongs to.
      properties:
        autonomousSystemNumber:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: The first two octets encoding the Autonomous System value.
        autonomousSystemDefined:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: The remaining octets.
        semantics:
          description: Text describing how the Seller will handle routes tagged with
            this Community
          type: string
      type: object
    BgpExtendedCommunity:
      description: "This attribute provides a mechanism for labeling information carried\
        \ in BGP-4. These labels can be used to control the distribution of this information,\
        \ or for other applications."
      properties:
        regularOrExtended:
          $ref: '#/components/schemas/BgpExtendedCommunityType'
          description: Indicates whether the BGP Extended Community is of Regular
            Type or Extended Type.
        semantics:
          description: Text describing how the Seller will handle routes tagged with
            this Community
          type: string
      type: object
    BgpExtendedCommunityType:
      description: Options for BGP Extended Community Type. Either Regular Type or
        Extended Type.
      maxProperties: 1
      minProperties: 1
      properties:
        regular:
          $ref: '#/components/schemas/BgpRegularType'
        extended:
          $ref: '#/components/schemas/BgpExtendedType'
      type: object
    BgpExtendedType:
      description: This resource provides a mechanism for labeling information carried
        in.
      properties:
        extendedType:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: "Extended Type Field, 2 octets length"
        extendedValue:
          description: Octets 3 - 8 of the value part of the address. Used in case
            only Extended Type is provided.
          format: int64
          maximum: 281474976710655
          minimum: 0
          type: integer
      type: object
    BgpRegularType:
      description: This resource provides a mechanism for labeling information carried
        in.
      properties:
        regularType:
          description: "Regular Type Field, 1 octet length"
          maximum: 255
          minimum: 0
          type: integer
        regularValue:
          description: Octets 2 - 8 of the value part of the address. Used in case
            only Regular Type is provided.
          format: int64
          maximum: 72057594037927940
          minimum: 0
          type: integer
      type: object
    BurstBehavior:
      description: |
        Enumeration used to select the Bandwidth Profile Flow Burst Behavior attribute.  Reference - MEF 61.1 Section 17.3 Table 29 - OPTIMIZE_DELAY: Enumeration representing the Burst Behavior of optimization of delay. - OPTIMIZE_THROUGHPUT: Enumeration representing the Burst Behavior of optimization of throughput.
      enum:
      - OPTIMIZE_DELAY
      - OPTIMIZE_THROUGHPUT
      type: string
    BusSofType:
      description: An enumeration with BUS and SOF values.
      enum:
      - bus
      - sof
      type: string
    ClassOfServiceMapEntry:
      description: "Values for the Cloud Ingress Class of Service Map. Reference MEF\
        \ 61.1 Table 11 - Values for the Cloud Ingress Class of Service Map, 11.0\
        \ IPVC EP Ingress Class of Service Map Service Attribute."
      properties:
        cosName:
          description: Class of Service name
          type: string
        destinationIpAddress:
          $ref: '#/components/schemas/Ipv4Prefix'
          description: Destination IP Address
        destinationL4Port:
          description: Destination Layer 4 Port
          maximum: 65535
          minimum: 0
          type: integer
        ethernetPcp:
          description: Ethernet PCP value
          maximum: 7
          minimum: 0
          type: integer
        ipds:
          description: DSCP value
          maximum: 63
          minimum: 0
          type: integer
        l4protocol:
          description: Layer 4 Protocol
          maximum: 255
          minimum: 0
          type: integer
        sourceIpAddress:
          $ref: '#/components/schemas/Ipv4Prefix'
          description: Source IP Address
        sourceL4Port:
          description: Source Layer 4 Port
          maximum: 65535
          minimum: 0
          type: integer
      type: object
    CloudDataLimit:
      description: "Specifies an absolute limit on the amount of data the Subscriber\
        \ can transmit to, or receive from, the cloud service in a given time period.\
        \ It is either Unlimited or a 4-tuple (scdl, tcdl, ucdl, dcdl).  Reference\
        \ MEF 61.1 Section 10.13.3 Cloud Data Limit."
      properties:
        startTime:
          description: Specifies a start time.
          format: date-time
          type: string
        duration:
          $ref: '#/components/schemas/TimeDuration'
          description: "Specifies a duration. Together with the start time, it describes\
            \ a service of contiguous time intervals, starting at the specified start\
            \ time and each lasting for the specified duration."
        upload:
          description: "An integer indicating a limit, in octets, on the amount of\
            \ IP traffic that can be transmitted towards the cloud service during\
            \ each time interval described by startTime and duration."
          type: integer
        download:
          description: "An integer indicating a limit, in octets, on the amount of\
            \ IP traffic received from the cloud service that can be delivered to\
            \ the Subscriber during each time interval described by startTime and\
            \ duration."
          type: integer
      type: object
    CloudDns:
      description: "Data type representing a Domain Name System. Reference MEF 69.1\
        \ Section 9.1 [R13].  \nFor an Internet Access Service, if the Cloud DNS parameter\
        \ of the IPVC Cloud Service \nAttribute is STATIC, the associated list of\
        \ DNS Servers MUST have at least one entry. \n[D4] For an Internet Access\
        \ Service, if the Cloud DNS parameter of the IPVC Cloud \nService Attribute\
        \ is STATIC, the associated list of DNS Servers\nSHOULD contain at least two\
        \ DNS servers.\n"
      properties:
        dnsServerIpv4List:
          description: DNS server list an IPv4 addresses.
          items:
            $ref: '#/components/schemas/Ipv4Address'
          type: array
        dnsServerIpv6List:
          description: DNS server list an IPv6 addresses.
          items:
            $ref: '#/components/schemas/Ipv6Address'
          type: array
        dnsType:
          $ref: '#/components/schemas/DnsType'
          description: Domain Name System type.
      type: object
    CloudType:
      description: "Indicates the type of cloud service being accessed. Reference\
        \ MEF 61.1 Table 10 \nSubscriber IPVC Cloud Service Attribute.\n- INTERNET_ACCESS:\
        \ Indicates the cloud access IPVC is used to access the public Internet.\n\
        - PRIVATE: Indicates the cloud access IPVC provides a direct connection over\
        \ the Service Provider's network to a cloud service.\n"
      enum:
      - INTERNET_ACCESS
      - PRIVATE
      type: string
    ConnectionType:
      description: |
        An enumeration representing the connection type.
        - POINT_TO_POINT indicates that the link is logically point to Point.
        - MULTIPOINT indicates the link is logically multipoint.
      enum:
      - POINT_TO_POINT
      - MULTIPOINT
      type: string
    ConnectorType:
      description: Enumeration representing type of connector presented to Subscriber.
      enum:
      - RJ45
      - SC
      - LC
      - OTHER
      type: string
    ContactInformation:
      description: Contact data for a person or organization that is involved in the
        product offering qualification. In a given context it is always specified
        by the SOF (e.g. SOF Contact Information) or by the BUS.
      properties:
        number:
          description: Phone number
          type: string
        emailAddress:
          description: Email address
          type: string
        postalAddress:
          $ref: '#/components/schemas/FieldedAddressRepresentation'
        organization:
          description: The organization or company that the contact belongs to
          type: string
        name:
          description: Name of the contact
          type: string
        numberExtension:
          description: Phone number extension
          type: string
      required:
      - emailAddress
      - name
      - number
      type: object
    ControlProtocol:
      description: "Data type representing Control Protocol. Each entry consists of\
        \ a 3-tuple containing the protocol name, addressing information (either SP/Operator\
        \ Addresses or Any) and one or more references. Reference - MEF 61.1 Section\
        \ 12.6"
      properties:
        addressing:
          $ref: '#/components/schemas/ControlProtocolAddressing'
          description: Enumeration representing the addressing.
        protocolName:
          description: Protocol name.
          type: string
        reference:
          description: Protocol reference.
          items:
            type: string
          minItems: 1
          type: array
      type: object
    ControlProtocolAddressing:
      description: "Enumeration representing the Address type for the Control Protocols\
        \ data\ntype. Reference - MEF 61.1 Section 12.6 \n- SP_OPERATOR_ADDRESSES:\
        \ If the addressing information is\nSP/Operator Addresses, then Ingress IP\
        \ Packets for the specified  protocol\nthat have a multicast or broadcast\
        \ destination address, or a unicast\ndestination address  that is reachable\
        \ within the SP's or Operator's\nnetwork, are considered to be IP Control\
        \ Protocol  Packets, and Egress IP\nPackets for the specified protocol that\
        \ have a source address that is\nreachable  within the SP's or Operator's\
        \ network are considered to be IP\nControl Protocol Packets.\n- ANY: If the\
        \ addressing information is Any, then all IP Packets for the\nspecified protocol\
        \ that cross the UNI are considered to be \nIP Control Protocol Packets.\n"
      enum:
      - SP_OPERATOR_ADDRESSES
      - ANY
      type: string
    Damping:
      description: "Damping parameters as defined in RFC 2439 BGP Route Flap Damping,\
        \ Section 4.2"
      properties:
        cutoffThreshold:
          description: This value is expressed as a number of route withdrawals.  It
            is the value above which a route advertisement will be suppressed.
          minimum: 0
          type: integer
        decayHalfLifeWhileReachable:
          description: This value is the time duration in seconds during which the
            accumulated stability figure of merit will be reduced by half if the route
            if considered reachable (whether suppressed or not).
          minimum: 0
          type: integer
        decayHalfLifeWhileUnReachable:
          description: "This value is the time duration in seconds during which the\
            \ accumulated stability figure of merit will be reduced by half if the\
            \ route if considered unreachable.  If not specified or set to zero, no\
            \ decay will occur while a route remains unreachable."
          minimum: 0
          type: integer
        decayMemoryLimit:
          description: "This is the maximum time (in seconds) that any memory of previous\
            \ instability will be retained given that the route's state remains unchanged,\
            \ whether reachable or unreachable.  This parameter is generally used\
            \ to determine array sizes."
          minimum: 0
          type: integer
        maxHoldDownTime:
          description: This value is the maximum time a route can be suppressed no
            matter how unstable it has been prior to this period of stability. In
            seconds.
          minimum: 0
          type: integer
        numberOfReuseLists:
          description: This is the number of reuse lists.  It may be determined from
            reuse-list-max or set explicitly.
          minimum: 0
          type: integer
        reuseListMemory:
          description: This is the time (in seconds) value corresponding to the last
            reuse list. This may be the maximum value of T-hold for all parameter
            sets of may be configured.
          minimum: 0
          type: integer
        reuseListTimeGranularity:
          description: This is the time (in seconds) interval between evaluations
            of the reuse lists.  Each reuse lists corresponds to an additional time
            increment.
          minimum: 0
          type: integer
        reuseThreshold:
          description: This value is expressed as a number of route withdrawals.  It
            is the value below which a suppressed route will now be used again.
          minimum: 0
          type: integer
        timeGranularity:
          description: This is the time granularity in seconds used to perform all
            decay computations.
          minimum: 0
          type: integer
        reuseIndexArraySize:
          description: This is the size of reuse index arrays.  This size determines
            the accuracy with which suppressed routes can be placed within the set
            of reuse lists when suppressed for a long time.
          minimum: 0
          type: integer
      type: object
    Demux:
      description: Is a value that is specific to each type of UNI Access Link Trunk
        and  indicates which Layer 2 sub-channel should be select for this UNI Access
        Link.
      properties:
        utpt:
          description: Untagged and priority tagged frames.
          type: boolean
        vlanId:
          description: VLAN ID.
          items:
            $ref: '#/components/schemas/VlanId'
          minItems: 0
          type: array
      type: object
    DhcpRelay:
      description: The UNI Access Link DHCP Relay Server Attribute is either Disabled
        or a pair containing a list of one or more DHCP Server IP addresses and an
        IPVC End Point Identifier.
      maxProperties: 1
      minProperties: 1
      properties:
        dhcpRelayDisabled:
          description: DHCP Relay Disabled.
          enum:
          - DISABLED
          type: string
        dhcpRelayEnabled:
          $ref: '#/components/schemas/DhcpRelayEnabled'
          description: Pointer to DhcpRelay.
      type: object
    DhcpRelayEnabled:
      description: "Dynamic Host Configuration Protocol (DHCP) Relay functionality\
        \ is useful when the Subscriber uses DHCP (per RFC 2131[15] and RFC 8415[24])\
        \ in the Subscriber Network but does not want to place a DHCP server (or possibly\
        \ a pair of redundant DHCP servers) in each part of the network."
      properties:
        dhcpServerList:
          description: Non-empty list of IP addresses for DHCP Servers belonging to
            the Subscriber. Reference MEF 61.1 Section 13.6 UNI Access Link DHCP Relay
            Server Attribute.
          items:
            $ref: '#/components/schemas/DhcpServer'
          minItems: 1
          type: array
        ipvcEndPointIdentifier:
          description: IPVC identifier as described in MEF 61.1 Section 11.1.
          maxLength: 53
          minLength: 1
          pattern: "[ -\x7f]+"
          type: string
      type: object
    DhcpServer:
      description: Data type representing a DHCP Server
      properties:
        ipv4Address:
          $ref: '#/components/schemas/Ipv4Address'
          description: DHCP Server IPv4 address.
        ipv6Address:
          $ref: '#/components/schemas/Ipv6Address'
          description: DHCP Server IPv6 address.
      type: object
    DnsType:
      description: |
        Enumeration representing the different types of DNS. Reference - MEF
        61.1 10.13.5 Cloud DNS Service
      enum:
      - NONE
      - DHCP
      - PPP
      - STATIC
      - SLAAC
      type: string
    DscpMapping:
      description: IP DSCP mapping of CoS name to DSCP value
      properties:
        cosName:
          description: Class of Service name
          type: string
        ipDscp:
          $ref: '#/components/schemas/DscpValue'
      type: object
    DscpValue:
      description: DSCP value
      maximum: 63
      minimum: 0
      type: integer
    Duration:
      description: "A Duration in a given unit of time e.g. 3 hours, or 5 days."
      properties:
        amount:
          description: "Duration (number of seconds, minutes, hours, etc.)"
          minimum: 0
          type: integer
        units:
          $ref: '#/components/schemas/TimeUnit'
      required:
      - amount
      - units
      type: object
    EgressClassOfServiceMap:
      description: "Pair of values (D,P). D specifies how to set the DS field in Egress\
        \ IP Data Packets based on CoS Name. It is either None, or a mapping from\
        \ CoS Names to DSCP values. P specifies how to set the PCP field in VLAN Tagged\
        \ Ethernet Frames containing Egress IP Data Packets based on CoS Name. It\
        \ is eitherNone, or a mapping from CoS Names to PCP values. Reference MEF\
        \ 61.1 Section 11.10 IPVC EP  Egress Class of Service Map Service Attribute.\
        \         "
      properties:
        defaultCosName:
          description: Default Class of Service Name.
          type: string
        dscpMapping:
          items:
            $ref: '#/components/schemas/DscpMapping'
          type: array
        pcpMapping:
          items:
            $ref: '#/components/schemas/PcpMapping'
          type: array
      type: object
    EnabledDisabled:
      description: Enumeration to indicate Enabled/Disabled state of an attribute.
      enum:
      - ENABLED
      - DISABLED
      type: string
    EndPointIdentifierAndCosName:
      description: Data type representing IPVC End Point Identifier and CoS name use
        for Bandwidth Profiles.
      properties:
        cosName:
          description: Class of Service name.
          type: string
        ipvcEndPointIdentifier:
          maxLength: 53
          minLength: 1
          pattern: "[ -\x7f]+"
          type: string
      type: object
    EnniIpv4ConnectionAddressing:
      description: "The ENNI Link IPv4 Connection Addressing specifies how IPv4 addresses\
        \ are allocated  to the devices connected to the ENNI Link. It is either NONE\
        \ or STATIC, plus in the  case of STATIC, some additional parameters. Reference\
        \ MEF 61.1 Section 16.3 ENNI  Link IPv4 Connection Addressing Attribute."
      properties:
        enniLinkIpv4AddressType:
          $ref: '#/components/schemas/EnniLinkIpv4AddressType'
        ipv4PrimarySubnet:
          $ref: '#/components/schemas/EnniIpv4Subnet'
        ipv4SecondarySubnetList:
          items:
            $ref: '#/components/schemas/EnniIpv4Subnet'
          minItems: 0
          type: array
      type: object
    EnniIpv4Subnet:
      description: Data type representing IPv4 Subnet for ENNI Links. Reference MEF
        61.1 Section 16.3 ENNI Link IPv4 Connection Addressing Attribute.
      properties:
        ipv4Prefix:
          $ref: '#/components/schemas/Ipv4Prefix'
        firstLloIpv4Address:
          description: First LLO (Lowest Level Operator IPv4 Address.
          type: string
        secondLloIpv4Address:
          description: Second LLO (Lowest Level Operator IPv4 Address.
          type: string
      type: object
    EnniIpv6ConnectionAddressing:
      description: "The ENNI Link IPv4 Connection Addressing specifies how IPv4 addresses\
        \ are allocated to the devices connected to the ENNI Link. It is either NONE\
        \ or STATIC, plus in the case of STATIC, some additional parameters. Reference\
        \ MEF 61.1 Section 16.3 ENNI Link IPv4 Connection Addressing Attribute."
      properties:
        enniLinkIpv6AddressType:
          $ref: '#/components/schemas/EnniLinkIpv6AddressType'
        ipv6Subnet:
          $ref: '#/components/schemas/EnniIpv6Subnet'
      type: object
    EnniIpv6Subnet:
      description: "Data type representing IPv6 Subnet for ENNI Links. Reference MEF\
        \ 61.1[1] Section 16.4 ENNI Link IPv6 Connection Addressing Attribute."
      properties:
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
        firstLloIpv6Address:
          description: First LLO (Lowest Level Operator IPv6 Address.
          type: string
        secondLloIpv6Address:
          description: Second LLO (Lowest Level Operator IPv6 Address.
          type: string
      type: object
    EnniLinkIpv4AddressType:
      description: Enumeration to indicate ENNI Link IPv4 Address Type.
      enum:
      - STATIC
      type: string
    EnniLinkIpv6AddressType:
      description: Enumeration to indicate ENNI Link IPv6 Address Type.
      enum:
      - STATIC
      - LL_ONLY
      type: string
    EnniList:
      description: "The ENNI List of ENNI Links Common Attribute is a list of 3-tuples\
        \ of  the form (ID, L1, Links). Each entry in the list corresponds to a  distinct\
        \ L1 link across the ENNI – in most cases, this means a separate  physical\
        \ link (although virtual or logical links are not precluded).  The first element\
        \ in the 3-tuple, ID, is the identifier of the L1 link.  The second element,\
        \ L1, contains the details of the L1 technology used  for the link. The third\
        \ element, Links, is a list (possibly empty) of  ENNI Link Identifiers (see\
        \ section 16.1) for the ENNI Links in this ENNI  that traverse the L1 link.\
        \ Reference MEF 61.1 Section 15.3 ENNI List of  ENNI Links Common Attribute."
      properties:
        identifier:
          maxLength: 53
          minLength: 1
          pattern: "[ -\x7f]+"
          type: string
        l1Technology:
          $ref: '#/components/schemas/L1Technology'
        enniIdentifier:
          items:
            maxLength: 53
            minLength: 1
            pattern: "[ -\x7f]+"
            type: string
          minItems: 1
          type: array
      type: object
    EnniPeeringType:
      description: "Attribute indicates the type of BGP Peering used across the ENNI.\
        \ The possible values  are Option A, Option B, Option C or Option B and C.\
        \ They refer to the options described  in RFC 4364. Reference MEF 61.1 Section\
        \ 15.2 ENNI Peering Type Common Attribute. For  Options reference MEF 61.1\
        \ Section 8.6 Connecting Services across an ENNI. OPTION_A is a separate eBGP\
        \ session is used across each ENNI Link and each session  carries routes for\
        \ one service. This results in packets for different services being  sent\
        \ over different ENNI Links. The packets can be plain IP Packets since it\
        \ is the  different links that distinguish them. OPTION_B is for when one\
        \ or more eBGP sessions are used across the ENNI, each exchanging  labelled\
        \ VPN routes for multiple services. The routes for different services are\
        \  distinguished by attributes such a Route Distinguishers and Route Targets.\
        \ This results  in IP Packets across the ENNI being encapsulated in MPLS where\
        \ IP Packets for different  services have different MPLS labels. Typically,\
        \ each packet has a single MPLS label, that  identifies both the egress PE\
        \ and the service. OPTION_C is for when one or more eBGP sessions are used\
        \ across the ENNI only to distribute  labeled unicast routes (and labels)\
        \ towards each Operator's own routers; furthermore,  multi-hop eBGP sessions\
        \ are used between the ingress PE and the egress PE (or equivalent  route\
        \ reflectors) to exchange labelled VPN routes for each service.  This results\
        \ in IP  Packets across the ENNI being encapsulated in MPLS, typically with\
        \ two MPLS labels, one  representing the egress PE, and the second that (roughly\
        \ speaking) identifies the service. OPTIONS_B_AND_C is a combination of Options\
        \ B and C."
      enum:
      - OPTION_A
      - OPTION_B
      - OPTION_C
      - OPTIONS_B_AND_C
      type: string
    EnniRoutingInformation:
      description: "For an ENNI Option A, the ENNI Routing Information Service Attribute\
        \ is a mapping  of ENNI Service Mapping Identifiers to four-tuples of the\
        \ form (Administrative Distance,  Route Flap Damping, AS Override, Static\
        \ Routes). Each four-tuple applies to the  corresponding ENNI Service Mapping\
        \ Identifier. Reference MEF 61.1 Section 14.3.1 ENNI  Routing Protocols for\
        \ Option A."
      properties:
        enniServiceMappingIdentifier:
          description: A string identifier that is used at the ENNI to match the IPVC
            EP on one side  of the ENNI with IPVC EPs on the other side. Reference
            MEF 61.1 Section 11.6  IPVC EP ENNI Service Mapping Identifier Service
            Attribute.
          maxLength: 53
          minLength: 1
          pattern: "[ -\x7f]+"
          type: string
        administrativeDistance:
          description: The Administrative Distance for a given ENNI Service Mapping
            Identifier is an  integer greater than 0 that indicates the value of the
            administrative distance  assigned by the Operator to eBGP routes received
            from another Operator over  the ENNI Links that are assigned to that ENNI
            Service Mapping Identifier at an  ENNI using Option A. Reference MEF 61.1
            Section 14.3.1.1 Administrative Distance.
          type: integer
        routeFlapDamping:
          $ref: '#/components/schemas/EnabledDisabled'
        asOverride:
          $ref: '#/components/schemas/EnabledDisabled'
        staticRoute:
          description: The Static Routes parameter for a given ENNI Service Mapping
            Identifier is a  list of static routes over the ENNI for the service identified
            by that ENNI  Service Mapping Identifier. The list can be empty. Reference
            MEF 61.1 Section  14.3.1.4 Static Routes.
          items:
            $ref: '#/components/schemas/StaticRoute'
          minItems: 0
          type: array
      type: object
    EnniServiceMap:
      description: "For an ENNI using Option A, the ENNI Service Map Common Attribute\
        \ is  a mapping from ENNI Service Mapping Contexts a set of ENNI Link Identifiers\
        \  for ENNI Links in the ENNI. Reference MEF 61.1[1] Section 15.6.1 ENNI \
        \ Service Map for Option A."
      properties:
        enniServiceMappingContext:
          $ref: '#/components/schemas/EnniServiceMappingContext'
        enniLinks:
          description: Pointer to ENNI Link list.
          items:
            $ref: '#/components/schemas/EnniList'
          minItems: 1
          type: array
      type: object
    EnniServiceMappingContext:
      description: "A pair of SP/SO, ENNI Service Mapping Identifier. It uniquely\
        \ identifies  services for a given SP/SO on either side of the ENNI that have\
        \ been  assigned the same ENNI Service Mapping Identifier. Reference MEF 61.1\
        \  Section 15.6.1 ENNI Service Map for Option A."
      properties:
        serviceProvider:
          description: Service Provider identifier.
          type: string
        serviceOperator:
          description: Service Operator identifier.
          type: string
        enniServiceMappingIdentifier:
          description: ENNI Service Mapping identifier
          type: string
      type: object
    EnniType:
      description: Indication of the type of BGP Peering at the ENNI. Reference MEF
        61.1 Section 14  ENNI Service Attributes.
      enum:
      - OPTION_A
      - OPTION_B
      - OPTION_C
      type: string
    Error:
      description: |
        Standard Class used to describe API response error Not intended to be used directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        message:
          description: Text that provides mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        reason:
          description: Text that explains the reason for the error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        referenceError:
          description: URL pointing to documentation describing the error
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: |-
        One of the following error codes:
        - missingQueryParameter: The URI is missing a required query-string parameter
        - missingQueryValue: The URI is missing a required query-string parameter value
        - invalidQuery: The query section of the URI is invalid.
        - invalidBody: The request has an invalid body
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. This code indicates that the server understood the request
        but refuses to authorize it. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: |-
        This code indicates that the server understood
        the request but refuses to authorize it because
        of one of the following error codes:
        - accessDenied: Access denied
        - forbiddenRequester: Forbidden requester
        - tooManyUsers: Too many users
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - notFound: A current representation for the target resource not found
            enum:
            - notFound
            type: string
        required:
        - code
        type: object
      description: Resource for the requested path not found. (https://tools.ietf.org/html/rfc7231#section-6.5.4)
    Error422:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error422Code'
          propertyPath:
            description: |
              A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.
              Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).
            type: string
        required:
        - code
        type: object
      description: Unprocessable entity due to a business validation problem. (https://tools.ietf.org/html/rfc4918#section-11.2)
    Error422Code:
      description: |
        One of the following error codes:
        - missingProperty: The property that was expected is not present in the payload
        - invalidValue: The property has an incorrect value
        - invalidFormat: The property value does not comply with the expected value format
        - referenceNotFound: The object referenced by the property cannot be identified in the target system
        - unexpectedProperty: Additional, not expected property has been provided
        - tooManyRecords: the number of records to be provided in the response exceeds the  threshold.
        - otherIssue: Other problem was identified (detailed information provided in a reason)
      enum:
      - missingProperty
      - invalidValue
      - invalidFormat
      - referenceNotFound
      - unexpectedProperty
      - tooManyRecords
      - otherIssue
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - internalError: Internal server error - the server encountered an unexpected condition that prevented it from fulfilling the request.
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    EthernetPhysicalLayer:
