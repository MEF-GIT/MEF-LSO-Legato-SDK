          ipEnniEgressBwp:
            $ref: '#/components/schemas/IpEnniEgressBwp'
            description: Reference to IpEnniEgressBwp.
          ipEnniEgressBwpCos:
            $ref: '#/components/schemas/IpEnniEgressBwpCos'
            description: Reference to IpEnniEgressBwpCos.
        type: object
    IpEnniIngressBwp:
      description: "All Ingress IP Data Packets at the ENNI Access Link.  Reference\
