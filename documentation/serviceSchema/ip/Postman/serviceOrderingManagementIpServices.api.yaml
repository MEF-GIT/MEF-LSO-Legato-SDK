    InformationRateUnits:
      description: Enum of information rates (such as MBPS)
      enum:
      - BPS
      - KBPS
      - MBPS
      - GBPS
      - TBPS
      - PBPS
      - EBPS
      - ZBPS
      - YBPS
      type: string
    IngressClassOfServiceMap:
      description: "Is a triple (F,M,D) where F is a list of one or more fields in\
        \ the packet  header that are used to determine the CoS Name, M is a mapping\
        \ from combinations  of values of those fields to CoS Names, and D is a default\
        \ CoS Name used when the  map cannot be applied.  Reference MEF 61.1 Section\
        \ 10.13.2 Cloud Ingress Class  of Service Map and Section 11.10 IPVC EP Egress\
        \ Class of Service Map Service Attribute."
