          \ to any of a given set of CoS Names. Reference MEF 61.1[1] Section 14.4."
        properties:
          ipEnniIngressBwp:
            description: Class of Service name.
            type: string
        type: object
    IpEnniIngressBwpEnvelopePerEnniLink:
      allOf:
      - $ref: '#/components/schemas/IpBwpEnvelope'
      - description: "Is a list (possibly empty) of pairs of (ENNI Service Mapping\
