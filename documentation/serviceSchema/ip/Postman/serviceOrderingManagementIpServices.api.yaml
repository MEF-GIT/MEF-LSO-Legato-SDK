      - startToStart
      - startToFinish
      - finishToStart
      - finishToFinish
      type: string
    Ospf:
      description: "When an entry in the UNI Routing Protocols is for OSPF, OSPF as\
        \ specified in RFC 2328 (for IPv4) and/or RFC 5340 (for IPv6) is used across\
        \ each UNI Access Link to exchange routing information. Reference - MEF 61.1\
        \ Section 12.7.2."
      properties:
        areaId:
          $ref: '#/components/schemas/Ipv4Address'
          description: Area ID (0-429496295) normally expressed as an IPv4 address.
        areaType:
          $ref: '#/components/schemas/OspfAreaType'
          description: OSPF Area Type enumeration.
        authenticationType:
          $ref: '#/components/schemas/OspfAuthenticationType'
          description: OSPF Authentication Type.
        helloInterval:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: "Hello interval (0-65535, in seconds)."
        deadInterval:
          description: "Dead interval (0-429496295, in seconds)."
          maximum: 429967295
          minimum: 0
          type: integer
        retransmissionInterval:
          description: "Retransmit interval (integer greater than 0, in seconds)."
          minimum: 0
          type: integer
        administrativeDistance:
          description: Administrative distance (integer greater than 0).
          minimum: 1
          type: integer
      type: object
    OspfAreaType:
      description: |-
        OSPF Area Type enumeration. Reference - MEF 61.1 Section 12.7.2
        - NORMAL - the Area is not a stub or NSSA (Not So Stubby Area) - STUB -  the Area is a stub - NSSA - the Area is NSSA (see RFC 3101)
      enum:
      - NORMAL
      - STUB
      - NSSA
      type: string
    OspfAuthenticationType:
      description: Enumeration of possible OSPF Authentication Type. In case other
        than `NONE`  is specified additional specific parameters need to be agreed
        between the  Buyer and the Seller. - NONE - No authentication is used. - PASSWORD
        - the 64-bit clear password is used which is inserted into the OSPF packet
        header - MESSAGE_DIGEST - Cryptographic authentication is used as specified
        in RFC 2828
      enum:
      - NONE
      - PASSWORD
      - MESSAGE_DIGEST
      type: string
    PacketDelivery:
      description: "For each Ingress IP Data Packet that is mapped to one of the IPVC\
        \ EPs for\nthe IPVC it takes one of two values. STANDARD_ROUTING or\nPOLICY-BASED_ROUTING\n\
        STANDARD_ROUTING: If the IPVC Packet Delivery is Standard Routing,\nthe egress\
        \ UNI and UNI Ac-cess Link or egress ENNI and ENNI Link are\ngenerally selected\
        \ by examining the destination IP address in the packet\nand matching it to\
        \ an IP Prefix reachable via the IPVC EP at the egress \nEI - in other words,\
        \ by normal IP routing.\nPOLICY_BASED_ROUTING: The behavior and requirements\
        \ when the\nIPVC Packet Delivery Service Attribute is set to Policy-Based\
        \ Routing\nare deferred to a future revision of this specification (MEF 61.1)\n"
      enum:
      - STANDARD_ROUTING
      - POLICY_BASED_ROUTING
      type: string
    PcpMapping:
      description: Ethernet PCP mapping of CoS name to PCP value
      properties:
        cosName:
          description: Class of Service name
          type: string
        ethernetPcp:
          description: PCP value
          maximum: 7
          minimum: 0
          type: integer
      type: object
    PeeringAddress:
      description: "Peering Addresses. Connection Addresses, or Loopbacks plus a list\
        \ of pairs of IP addresses. Reference - MEF 61.1 Section 12.7.3."
      properties:
        peeringAddressType:
          $ref: '#/components/schemas/PeeringAddressType'
          description: |
            If the Peering Addresses parameter is CONNECTION_ADDRESSES, a separate
            BGP peering session is established over each UNI Access Link, using
            the primary IPv4 addresses in the UNI Access Link IPv4 Connection
            Addressing Service Attribute (section 13.4) or the first IPv6
            addresses in the UNI Access Link IPv6 Connection Addressing Service
            Attribute (section 13.5), as indicated by the Connection Address
            Family parameter.
            If the Peering Addresses parameter is LOOPBACKS, a list of pairs of IP
            addresses is additionally specified, each pair containing the
            Subscriber's loopback address and the SP's or Operator's loopback
            address. A single BGP peering session is established for each pair of
            addresses.
        subscriberAndSpLoopbackAddresses:
          description: "A list of pairs of IP addresses, each pair containing the\
            \ Subscriber's loopback address and the SP's or Operator's loopback address.\
            \ A single BGP peering session is established for each pair of addresses."
          items:
            $ref: '#/components/schemas/SubscriberAndSpLoopbackAddresses'
          type: array
      type: object
    PeeringAddressType:
      description: |
        If the Peering Addresses parameter is CONNECTION_ADDRESSES, a separate BGP peering session is established over each UNI Access Link, using the primary IPv4 addresses in the UNI Access Link IPv4 Connection Addressing Service Attribute (section 13.4) or the first IPv6 addresses in the UNI Access Link IPv6 Connection Addressing Service Attribute (section 13.5), as indicated by the Connection Address Family parameter. If the Peering Addresses parameter is LOOPBACKS, a list of pairs of IP addresses is additionally specified, each pair containing the Subscriber's loopback address and the SP's or Operator's loopback address. A single BGP peering session is established for each pair of addresses.
      enum:
      - CONNECTION_ADDRESSES
      - LOOPBACKS
      type: string
    Percentage:
      description: This is a number of percent - a number between 0 and 100.
      maximum: 100
      minimum: 0
      type: number
    PlaceRefOrQuery:
      discriminator:
        mapping:
          GeographicAddressRef: '#/components/schemas/GeographicAddressRef'
          GeographicAddress_Query: '#/components/schemas/GeographicAddress_Query'
          GeographicSiteRef: '#/components/schemas/GeographicSiteRef'
        propertyName: '@type'
      properties:
        '@type':
          description: Used to unambiguously designate the class type when using `oneOf`
          enum:
          - GeographicAddressRef
          - GeographicAddress_Query
          - GeographicSiteRef
          type: string
      required:
      - '@type'
      type: object
    PortMap:
      description: "LACP Portmap as a 2-tuple <vid,lspl> where vid is VLAN ID and\
        \ lslp is Link Selection  Priority List. Reference MEF 61.1.1 Section A1-1.3.2\
        \ UNI Access Link Ethernet Link  Aggregation Service Attribute."
      properties:
        vlanId:
          $ref: '#/components/schemas/VlanId'
        linkSelectionPriorityList:
          items:
            type: integer
          type: array
      type: object
    RelatedContactInformation:
      description: Contact information of an individual or organization playing a
        role for this Order Item. The rule for mapping a represented attribute value
        to a `role` is to use the _lowerCamelCase_ pattern. In a given context it
        is always specified by the SOF (e.g. SOF Contact Information) or by the BUS.
      properties:
        role:
          description: The role of the particular contact in the request
          type: string
        number:
          description: Phone number
          type: string
        emailAddress:
          description: Email address
          type: string
        postalAddress:
          $ref: '#/components/schemas/FieldedAddressRepresentation'
        organization:
          description: The organization or company that the contact belongs to
          type: string
        name:
          description: Name of the contact
          type: string
        numberExtension:
          description: Phone number extension
          type: string
      required:
      - emailAddress
      - name
      - number
      - role
      type: object
    RelatedPlaceRefOrQuery:
      description: "Allows pointing to a place by referring to a GeographicAddress,\
        \ GeographicSite, or providing GeographicAddress by value. It also provides\
        \ additional information like the `role` the place plays for given Product\
        \ and `contact` needed access to this place."
      properties:
        place:
          $ref: '#/components/schemas/PlaceRefOrQuery'
        role:
          description: Role of this place. The values that can be specified here are
            described by Product Specification (e.g. "INSTALL_LOCATION").
          type: string
        contact:
          description: The person to call to get access to this place in case such
            access is required to complete the evaluation of this POQ Item.
          items:
            $ref: '#/components/schemas/ContactInformation'
          type: array
      required:
      - place
      - role
      type: object
    RoutingProtocols:
      description: "Data type to support routing protocols and associated parameters\
        \ that are used to exchange IP routes across the UNI. It has three attributes\
        \ allowing for providing configuration of BGP, OSPF and Static routing protocols.\
        \ Reference - MEF 61.1 Section 12.7"
      properties:
        bgp:
          description: BGP routing protocol configuration options.
          items:
            $ref: '#/components/schemas/RoutingProtocolsBgpOptions'
          maxItems: 1
          type: array
        ospf:
          description: OSPF routing protocol configuration options.
          items:
            $ref: '#/components/schemas/RoutingProtocolsOspfOptions'
          maxItems: 1
          type: array
        static:
          description: Static routing configuration options.
          items:
            $ref: '#/components/schemas/Static'
          maxItems: 1
          type: array
      type: object
    RoutingProtocolsBgpOptions:
      description: |
        BGP routing protocol configuration options. The configuration of the BGP
        can be provided for the following type of routes that will be exchanged:
        - ipv4, or
        - ipv6, or
        - both, or (one BGP session exchanging both IPv4 and IPv6)
        - ipv4 and ipv6 (separate BGP session for exchanging IPv4 and IPv6)
      properties:
        ipv4:
          $ref: '#/components/schemas/Bgp'
          description: Configuration for exchanging IPv4 types of routes.
        ipv6:
          $ref: '#/components/schemas/Bgp'
          description: Configuration for exchanging IPv6 types of routes.
        both:
          $ref: '#/components/schemas/Bgp'
          description: Common configuration for exchanging both IPv4 and IPv6 types
            of routes.
      type: object
    RoutingProtocolsOspfOptions:
      description: |
        OSPF routing protocol configuration options. The configuration of the OSPF
        can be provided for the following type of routes that will be exchanged:
        - ipv4, or
        - ipv6, or
        - ipv4 and ipv6
      properties:
        ipv4:
          $ref: '#/components/schemas/Ospf'
          description: Configuration for exchanging IPv4 types of routes.
        ipv6:
          $ref: '#/components/schemas/Ospf'
          description: Configuration for exchanging IPv6 types of routes.
      type: object
    ServiceActionType:
      description: |
        Action to be applied to the Service referred by this Service Order
        Item
      enum:
      - add
      - modify
      - delete
      type: string
    ServiceOrder:
      allOf:
      - $ref: '#/components/schemas/ServiceOrder_Common'
      - properties:
          href:
            description: Hyperlink reference
            type: string
          id:
            description: unique identifier
            type: string
          completionDate:
            description: Effective delivery date amended by the provider
            format: date-time
            type: string
          expectedCompletionDate:
            description: Expected delivery date amended by the provider
            format: date-time
            type: string
          serviceOrderItem:
            description: A list of service order items to be processed by this order
            items:
              $ref: '#/components/schemas/ServiceOrderItem'
            minItems: 1
            type: array
          startDate:
            description: Date when the order was started for processing
            format: date-time
            type: string
          state:
            $ref: '#/components/schemas/ServiceOrderStateType'
          orderDate:
            description: Date when the Service Order was created in the SOF's system
              and a Service Order Identifier was assigned
            format: date-time
            type: string
        required:
        - id
        - orderDate
        - serviceOrderItem
        - state
        type: object
      description: "A Service Order is used to request operations on a Service instance.\
        \ A Service Order groups one or more one Service Order Items - one per specific\
        \ action on a Service instance. The Action associated with the Service Order\
        \ Item describes the operation (add, modify, delete) to be applied on the\
        \ specified Service instance.The Service Order Item and its associated Action\
        \ can operate on both existing (modify, delete) as well as future (add) Service\
        \ instance.The Service Order is triggered from the Business Application (BA)\
        \ system in charge of the Service Order management to the Service Orchestration\
        \ Function (SOF) system that will orchestrate the Service fulfillment."
    ServiceOrderItem:
      allOf:
      - $ref: '#/components/schemas/ServiceOrderItem_Common'
      - description: |
          An identified part of the order. A service order is decomposed into
          one or more order items.
          The modelling pattern introduces the `Common` supertype to
          aggregate attributes that are common to both `ServiceOrderItem` and
          `ServiceOrderItem_Create`. The `Create` type has a subset of
          attributes of the response type and does not introduce any new,
          thus the `Create` type has an empty definition
        properties:
          state:
            $ref: '#/components/schemas/ServiceOrderStateType'
          terminationError:
            description: "When the SOF cannot process the request, the SOF returns\
              \ a text-based list of reasons here."
            items:
              $ref: '#/components/schemas/TerminationError'
            type: array
        required:
        - state
        type: object
    ServiceOrderItemRef:
      description: "A reference to a Service Order Item. When referencing item from\
        \ within the same Service Order, the `serviceOrderId` and `serviceOrderHref`\
        \ MUST be empty."
      properties:
        itemId:
          description: Identifier of referenced item within the referenced Service
            Order
          type: string
        serviceOrderHref:
          description: Link to the order to which the referenced item belongs to
          type: string
        serviceOrderId:
          description: Identifier of the order to which the referenced item belongs
            to
          type: string
      required:
      - itemId
      type: object
    ServiceOrderItemRelationship:
      description: |
        Specifies the type (nature) of the relationship to the related
        Service. The nature of required relationships varies for Services of
        different types. For example, a UNI or ENNI Service may not have any
        relationships, but an E-Line may have two mandatory
        relationships (related to the UNI on one end and the ENNI on the
        other). More complex Services such as multipoint IP or Firewall
        Services may have more complex relationships. As a result, the
        allowed and mandatory `relationshipType` values are defined in the
        Service Specification.
        Related item can be both from within the same Service Order or from
        other one. When referencing item from within the same Service Order,
        the `orderItem.serviceOrderId` and `orderItem.serviceOrderHref` MUST
        be empty.
      properties:
        orderItem:
          $ref: '#/components/schemas/ServiceOrderItemRef'
        relationshipType:
          description: Specifies the nature of the relationship to the related Service
            Order Item. A string that is one of the relationship types specified in
            the Service Specification.
          type: string
      required:
      - orderItem
      - relationshipType
      type: object
    ServiceOrderItem_Common:
      description: An identified part of the order. A service order is decomposed
        into one or more order items. This type holds the attributes common to request
        and response representation of the Service Order Item.
      properties:
        id:
          description: "Identifier of the order item (generally it is a sequence number\
            \ 01, 02, 03, ...)"
          type: string
        action:
          $ref: '#/components/schemas/ServiceActionType'
        coordinatedAction:
          description: The interval after the completion of one or more related Service
            Order Items that this Service Order Item can be started or completed
          items:
            $ref: '#/components/schemas/OrderItemCoordinatedAction'
          type: array
        note:
          description: Extra-information about the order item; e.g. useful to add
            extra delivery information that could be useful for a human process
          items:
            $ref: '#/components/schemas/Note_BusSof'
          type: array
        relatedContactInformation:
          description: |-
            Contact information of an individual or organization playing a role for this Service Order.
            For providing Notification Contact, `role=notificationContact` MUST be used.
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          type: array
        service:
          $ref: '#/components/schemas/ServiceValue'
        serviceOrderItemRelationship:
          description: |
            Specifies the type (nature) of the relationship to the related
            Service. The nature of required relationships varies for Services of
            different types. For example, a UNI or ENNI Service may not have any
            relationships, but an E-Line may have two mandatory
            relationships (related to the UNI on one end and the ENNI on the
            other). More complex Services such as multipoint IP or Firewall
            Services may have more complex relationships. As a result, the
            allowed and mandatory `relationshipType` values are defined in the
            Service Specification.
            Related items can be both from within the same Service Order or from
            other one. When referencing item within the same Service Order,
          items:
            $ref: '#/components/schemas/ServiceOrderItemRelationship'
          type: array
      required:
      - action
      - id
      - service
      type: object
    ServiceOrderItem_Create:
      allOf:
      - $ref: '#/components/schemas/ServiceOrderItem_Common'
      - description: |
          An identified part of the order. A service order is decomposed into one or more order items. This type is used in the request.
        type: object
    ServiceOrderRef:
      description: Reference to a Service Order instance.
      properties:
        href:
          description: A hyperlink to the related order
          type: string
        id:
          description: The id of the related order
          type: string
      required:
      - id
    ServiceOrderRelationship:
      description: Reference to a related Service Order and the type of that association.
      properties:
        serviceOrder:
          $ref: '#/components/schemas/ServiceOrderRef'
        relationshipType:
          description: "Specifies the type (nature) of the relationship to the related\
            \ Service. The nature of required relationships varies for Services of\
            \ different types. For example, a UNI or ENNI Service may not have any\
            \ relationships, but an Access E-Line may have two mandatory relationships\
            \ (related to the UNI on one end and the ENNI on the other). More complex\
            \ Services such as multipoint IP or Firewall Services may have more complex\
            \ relationships. As a result, the allowed and mandatory `relationshipType`\
            \ values are defined in the Service Specification."
          type: string
      required:
      - relationshipType
      - serviceOrder
      type: object
    ServiceOrderStateType:
      description: |
        Possible values for the state of a Service Order

        | State        | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           |
        | ------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | acknowledged | A `ServiceOrder` request has been received and has passed message and basic validations and a _Success Response_ has been sent.                                                                                                                                                                                                                                                                                                                                                                                                                       |
        | rejected     | This state indicates that: <br>- Invalid information is provided through the `ServiceOrder` / `ServiceOrderItem` request <br>- The request fails to meet validation rules for `Service` delivery (processing) <br>If one `ServiceOrderItem` is rejected, then the entire `ServiceOrder` request is rejected and a _Error Response_ is sent.                                                                                                                                                                                                           |
        | inProgress   | This state indicates that all `ServiceOrderItems` have successfully passed the validations checks and the scheduled `Service` delivery/processing has started. <br> The `ServiceOrder` will be in _`inProgress`_ state if _at least one_ `ServiceOrderItem` is in _`inProgress`_ state                                                                                                                                                                                                                                                                |
        | pending      | This state indicates that a `ServiceOrderItem` is currently in a waiting stage for an action/activity to be completed before the order-processing can progress further (this may happen also via non-API channel). <br> A _`pending`_ state can lead into automatic `failed` of an `ServiceOrderItem`, if no action is taken within the agreed timeframe.<br>The `ServiceOrder` will be in _`pending`_ state if _at least one_ `ServiceOrderItem` is in _`pending`_ state                                                                               |
        | held         | This state indicates that a `ServiceOrderItem` cannot be progressed due to an issue. The `Service` delivery (processing) has been temporarily delayed to resolve an infrastructure shortfall to facilitate supply of order. Upon resolution of the issue, the `ServiceOrderItem` will continue to progress.<br> A _`held`_ state can lead into automatic `failed` of an `ServiceOrderItem`, if no action is taken within the agreed timeframe.<br>The `ServiceOrder` will be in _`held`_ state if at least one `ServiceOrderItem` is in _`held`_ state |
        | failed       | This state indicates that `Service` delivery (processing) associated with a `ServiceOrderItem` has failed. This indicates an irrecoverable error as opposed to _`held`_ or _`pending`_ issues.<br>The `ServiceOrder` will be in _`failed`_ state if at _ALL_ `ServiceOrderItems` are in _`failed`_ state                                                                                                                                                                                                                                              |
        | completed    | This state indicates that `Service` delivery (processing) associated with a `ServiceOrderItem` has completed. <br>The `ServiceOrder` will be in _`completed`_ state if at _ALL_ `ServiceOrderItems` are in _`completed`_ state                                                                                                                                                                                                                                                                                                                        |
        | partial      | This state indicates that some `ServiceOrderItem` are in _`completed`_ state while others are in _`failed`_ states, so the entire `ServiceOrder` is in a _`partial`_ state. Not applicable to _`ServiceOrderItem`_.                                                                                                                                                                                                                                                                                                              |
      enum:
      - acknowledged
      - rejected
      - pending
      - held
      - inProgress
      - completed
      - failed
      - partial
      type: string
    ServiceOrder_Common:
      description: |
        A Service Order is used to request operations on a Service instance. A
        Service Order groups one or more one Service Order Items - one per
        specific action on a Service instance. The Action associated with the
        Service Order Item describes the operation (add, modify, delete) to be
        applied on the specified Service instance.The Service Order Item and its
        associated Action can operate on both existing (modify, delete) as well
        as future (add) Service instance.The Service Order is triggered from the
        Business Application (BA) system in charge of the Service Order
        management to the Service Orchestration Function (SOF) system that will
        orchestrate the Service fulfillment.

        This type defines all attributes common to objects used in request and
        response.
      properties:
        coordinatedAction:
          description: The interval after the completion of one or more related Service
            Order Items that this Service Order Item can be started or completed
          items:
            $ref: '#/components/schemas/OrderCoordinatedAction'
          type: array
        description:
          description: A free-text description of the service order
          type: string
        externalId:
          description: ID given by the consumer to facilitate searches
          type: string
        note:
          description: Extra-information about the order; e.g. useful to add extra
            delivery information that could be useful for a human process
          items:
            $ref: '#/components/schemas/Note_BusSof'
          type: array
        orderRelationship:
          description: A list of service orders related to this order
          items:
            $ref: '#/components/schemas/ServiceOrderRelationship'
          type: array
        relatedContactInformation:
          description: |-
            Contact information of an individual or organization playing a role for this Service Order.
            For providing Notification Contact, `role=notificationContact` MUST be used.
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          type: array
        requestedCompletionDate:
          description: Requested delivery date from the requestors perspective
          format: date-time
          type: string
        requestedStartDate:
          description: Order start date wished by the requestor
          format: date-time
          type: string
      required:
      - requestedCompletionDate
      - requestedStartDate
      type: object
    ServiceOrder_Create:
      allOf:
      - $ref: '#/components/schemas/ServiceOrder_Common'
      - properties:
          serviceOrderItem:
            description: A list of service order items to be processed by this order
            items:
              $ref: '#/components/schemas/ServiceOrderItem_Create'
            minItems: 1
            type: array
        required:
        - serviceOrderItem
      description: |-
        A Service Order is used to request operations on a Service instance. A Service Order groups one or more one Service Order Items - one per specific action on a Service instance. The Action associated with the Service Order Item describes the operation (add, modify, delete) to be applied on the specified Service instance.The Service Order Item and its associated Action can operate on both existing (modify, delete) as well as future (add) Service instance.The Service Order is triggered from the Business Application (BA) system in charge of the Service Order management to the Service Orchestration Function (SOF) system that will orchestrate the Service fulfillment.
        This type extends `ServiceOrder_Common` and adds attributes specific to the request response.
    ServiceRef:
      description: Reference to a Service instance.
      properties:
        href:
          description: Hyperlink reference to Service
          type: string
        id:
          description: unique identifier of Service
          type: string
      required:
      - id
      type: object
    ServiceRelationship:
      description: A relationship to an existing Service. The requirements for usage
        for given Service are described in the Service Specification.
      properties:
        relationshipType:
          description: |
            Specifies the type (nature) of the relationship to the related
            Service. The nature of required relationships varies for Services of
            different types. For example, a UNI or ENNI Service may not have any
            relationships, but an Access E-Line may have two mandatory
            relationships (related to the UNI on one end and the ENNI on the
            other). More complex Services such as multipoint IP or Firewall
            Services may have more complex relationships. As a result, the
            allowed and mandatory `relationshipType` values are defined in the
            Service Specification.
          type: string
        service:
          $ref: '#/components/schemas/ServiceRef'
      required:
      - relationshipType
      - service
      type: object
    ServiceStateType:
      description: |
        Valid values for the lifecycle state of the Service.

        | State              | Description                                                                                                           |
        | ------------------ | --------------------------------------------------------------------------------------------------------------------- |
        | feasibilityChecked | Initial check whether the necessary resources are available and sufficient for the installation of a given service.   |
        | designed           | The Service is designed. The resources are identified and/or allocated, but not reserved.                             |
        | reserved           | All required resources for given service are reserved and ready.                                                      |
        | inactive           | The service is deactivated and is no longer available.                                                                |
        | active             | The service is fully available and active                                                                             |
        | terminated         | The service is 'logically deleted'. All associated resources are freed and made available for service to other users. |
      enum:
      - feasibilityChecked
      - designed
      - reserved
      - inactive
      - active
      - terminated
      type: string
    ServiceTopology:
      description: Enumeration used to represent the different Service Topologies.
      enum:
      - MULTIPOINT
      - ROUTED_MULTIPOINT
      - CLOUD_ACCESS
      type: string
    ServiceUptime:
      description: "The Service Uptime Performance Metric is the proportion of time,\
        \ during a given time period Tk, that the service is working from the perspective\
        \ of the Subscriber (for a Subscriber IP Service) or the  perspective of the\
        \ SP/SO (for an Operator IP Service), excluding any pre-agreed exceptions,\
        \ for  example maintenance intervals. Reference MEF 61.1[1] Section 10.9 Service\
        \ Uptime Performance Metric.."
      properties:
        serviceUptimeObjective:
          $ref: '#/components/schemas/Percentage'
          description: "Service Uptime Objective. Reference MEF 61.1 Section 10.9.9\
            \ Service Uptime Performance Metric, Table 9."
      type: object
    ServiceValue:
      description: ServiceValue is a base class for defining the Service.
      properties:
        href:
          description: Hyperlink reference to a Service
          type: string
        id:
          description: unique identifier of a Service
          type: string
        description:
          description: Free-text description of the service
          type: string
        externalId:
          description: ID given by the consumer to facilitate searches
          type: string
        startDate:
          description: Date when the service starts
          format: date-time
          type: string
        endDate:
          description: Date when the service ends
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/ServiceStateType'
        note:
          description: A list of notes made on this service
          items:
            $ref: '#/components/schemas/Note_BusSof'
          type: array
        serviceType:
          description: Business type of the service
          type: string
        name:
          description: Name of the service
          type: string
        serviceRelationship:
          description: "Specifies the type (nature) of the relationship to the related\
            \ Service. The nature of required relationships varies for Services of\
            \ different types. For example, a UNI or ENNI Service may not have any\
            \ relationships, but an Access E-Line may have two mandatory relationships\
            \ (related to the UNI on one end and the ENNI on the other). More complex\
            \ Services such as multipoint IP or Firewall Services may have more complex\
            \ relationships. As a result, the allowed and mandatory `relationshipType`\
            \ values are defined in the Service Specification."
          items:
            $ref: '#/components/schemas/ServiceRelationship'
          type: array
        relatedContactInformation:
          description: Contact information of an individual or organization playing
            a role for this Service
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          type: array
        place:
          description: The relationships between this Service Order Item and one or
            more Places as defined in the Service Specification.
          items:
            $ref: '#/components/schemas/RelatedPlaceRefOrQuery'
          type: array
        serviceConfiguration:
          $ref: '#/components/schemas/MefServiceConfiguration'
        serviceOrderItem:
          description: A list of service order items related to this service
          items:
            $ref: '#/components/schemas/ServiceOrderItemRef'
          type: array
      type: object
    SlsReferencePoint:
      description: SlsReferencePoint is an abstract data type that can be subclassed
        to IpvcEndPoint and Location. Reference MEF 61.1 Section 10.9.1 SLS Reference
        Points.
      type: object
    SlsRpPair:
      description: "Service Level Specification Reference Point Pair. In a multipoint\
        \ or rooted multipoint IPVC, performance objectives are ideally specified\
        \ as applying between pairs of IPVC EPs - in other words, they apply to the\
        \ performance that IP Data Packets experience as they flow from one EI to\
        \ another. The SlsRpPair is a representation of this association. Reference\
        \ MEF 61.1 Section 10.9.1"
      properties:
        fromSlsReferencePoint:
          $ref: '#/components/schemas/SlsReferencePoint'
          description: Pointer to the "from" SLS Reference Point.
        toSlsReferencePoint:
          $ref: '#/components/schemas/SlsReferencePoint'
          description: Pointer to the "to" SLS Reference Point.
      required:
      - fromSlsReferencePoint
      - toSlsReferencePoint
      type: object
    Static:
      description: "When an entry in the UNI Routing Protocols list is for Static,\
        \ the IP Prefixes used in the Subscriber Network that are reachable via this\
        \ UNI are specified as additional parameters in the entry. These are known\
        \ as Static IP Prefixes. Reference - MEF 61.1 Section 12.7.1."
      properties:
        staticIpEntry:
          description: Static IP address entry.
          items:
            $ref: '#/components/schemas/StaticIpEntry'
          minItems: 1
          type: array
      type: object
    StaticIpEntry:
      description: "StaticIpEntry data type including IPv4/IPv6 prefixes, forwarding\
        \ information and administrative distance."
      properties:
        administrativeDistance:
          description: "Administrative distance, an integer > 0."
          minimum: 1
          type: integer
        forwardingInformation:
          $ref: '#/components/schemas/ForwardingInformation'
          description: Forwarding information with either Next Hop IP address or UNI
            Access Link identifier.
        staticPrefix:
          $ref: '#/components/schemas/Ipv4OrIpv6Prefix'
          description: IPv4 or IPv6 Prefix that is advertised.
      type: object
    StaticRoute:
      description: Data type representing IP static routes.
      properties:
        ipv4Prefix:
          $ref: '#/components/schemas/Ipv4Prefix'
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
        administrativeDistance:
          description: "The administrative distance is a numeric metric used to control\
            \ which routes  are selected, when there are multiple routes for the same\
            \ IP Prefix. A lower  number indicates a more preferable route."
          type: integer
        targetRole:
          $ref: '#/components/schemas/TargetRole'
      type: object
    SubUnit:
      description: Allows for sub unit identification
      properties:
        subUnitNumber:
          description: "The discriminator used for the subunit, often just a simple\
            \ number but may also be a range."
          type: string
        subUnitType:
          description: "The type of subunit e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER,\
            \ UNIT, WHARF."
          type: string
      required:
      - subUnitNumber
      - subUnitType
      type: object
    SubscriberAndSpLoopbackAddresses:
      description: "A list of pairs of IP addresses, each pair containing the Subscriber's\
        \ loopback address and the SP's or Operator's loopback address. A single BGP\
        \ peering session is established for each pair of addresses."
      properties:
        subscriberLoopbackAddress:
          $ref: '#/components/schemas/Ipv4OrIpv6Address'
          description: Subscriber's loopback Address for BGP establishing a session
        spLoopbackAddress:
          $ref: '#/components/schemas/Ipv4OrIpv6Address'
          description: Service Provider's loopback Address for BGP establishing a
            session
      type: object
    SynchronousEthernet:
      description: Enumeration representing the value of fs which indicates if the
        physical link  supports Synchronous Ethernet.
      enum:
      - DISABLED
      - ESMC
      - NO_ESMC
      type: string
    TargetRole:
      description: Enumeration representing the Static Route Target Role. Reference
        MEF 61.1 Section  14.3.1.4 Static Routes. ROOT - Root role. LEAK - Leaf role.
      enum:
      - ROOT
      - LEAF
      type: string
    TerminationError:
      description: This indicates an error that caused an Item to be terminated. The
        code and propertyPath should be used like in Error422.
      properties:
        code:
          $ref: '#/components/schemas/Error422Code'
        propertyPath:
          description: |
            A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.
            Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).
          type: string
        value:
          description: Text to describe the reason of the termination.
          type: string
      type: object
    TimeDuration:
      description: "This class is used to describe durations expressed as a 2-tuple,\
        \ (value, units). The units from from nanoseconds to years."
      properties:
        timeDurationValue:
          description: "The value of the duration. For example, if the duration is\
            \ 20 ms, this element is 20."
          minimum: 0
          type: integer
        timeDurationUnits:
          $ref: '#/components/schemas/TimeDurationUnits'
          description: "The unit of measure in the duration. For example, if an interval\
            \ is 2ms, this element is MS."
      type: object
    TimeDurationUnits:
      description: Enum listing the units of measure for a Time Duration
      enum:
      - NS
      - US
      - MS
      - SEC
      - MIN
      - HOUR
      - DAY
      - WEEK
      - MONTH
      - YEAR
      type: string
    TimeUnit:
      description: |
        Represents a unit of time.
      enum:
      - seconds
      - minutes
      - businessHours
      - calendarHours
      - businessDays
      - calendarDays
      - months
      - years
      type: string
    TwoOctetInteger:
      description: A two octet integer. Value range 0 - 65535
      maximum: 65535
      minimum: 0
      type: integer
    UniAccessLinkEthernetLinkAggregation:
      description: "Link Aggregation, as described in IEEE Std. 802.1AX-2020 allows\
        \ one or more parallel instances of full-duplex point-to-point Ethernet links\
        \ to be aggregated to form a Link Aggregation Group  (LAG) such that the MAC\
        \ Client (the UNI Access Link) can treat the LAG as if it were a single  link.\
        \ Reference MEF 61.1.1 Section A1-1.3.2 UNI Access Link Trunk Ethernet Link\
        \ Aggregation  Service Attribute."
      properties:
        lacpVersion:
          $ref: '#/components/schemas/LacpVersion'
        portMap:
          $ref: '#/components/schemas/PortMap'
      type: object
    UniAccessLinkTrunk:
      description: 'A UNI Access Link Trunk is a construct that encapsulates the physical
        link properties  of one or more UNI Access Links. '
      maxProperties: 1
      minProperties: 1
      properties:
        otherUniAccessLink:
          description: Indicates that the UNI Access Link is of a type other.
          enum:
          - OTHER
          type: string
        ethernetAccessLinkTrunk:
          $ref: '#/components/schemas/EthernetUniAccessLinkTrunk'
    UniIpv4ConnectionAddressing:
      description: "UniIpv4ConnectionAddressing is a data type representing how IPv4\
        \ addresses are allocated to the devices on the UNI Access Link. Reference\
        \ - MEF 61 Section 13.4. [R22] \"At a UNI Access Link in a UNI with an IPVC\
        \ EP for an Advanced Internet Access Service, UNI Access Link IPv4 Connection\
        \ Addressing MUST be Static or null. Reference - MEF 69.1 Section 9.4."
      properties:
        ipv4AddressingType:
          $ref: '#/components/schemas/Ipv4AddressingType'
          description: IPv4 Connection Addressing.
        ipv4PrimarySubnet:
          $ref: '#/components/schemas/Ipv4PrimarySubnet'
          description: Primary IPv4 Subnet. Includes IPv4 Prefix and Service Provider
            IPv4 Addresses.
        ipv4SecondarySubnetList:
          description: Secondary IPv4 Subnet List. Includes IPv4 Prefix and Service
            Provider IPv4 Addresses.
          items:
            $ref: '#/components/schemas/Ipv4SecondarySubnet'
          type: array
      type: object
    UniIpv6ConnectionAddressing:
      description: "UniIpv6ConnectionAddressing is a data type representing how IPv6\
        \ addresses are allocated to the devices on the UNI Access Link. Reference\
        \ - MEF 61 Section 13.5. [R26] \"At a UNI Access Link in a UNI with an IPVC\
        \ EP for an Advanced Internet Access Service, UNI Access Link IPv6 Connection\
        \ Addressing MUST be Static or null. Reference - MEF 69.1 Section 9.4."
      properties:
        ipv6AddressingType:
          $ref: '#/components/schemas/Ipv6AddressingType'
          description: IPv6 Connection Addressing.
        subscriberIpv6Address:
          $ref: '#/components/schemas/Ipv6Address'
          description: Subscriber IPv6 address.
        ipv6Subnet:
          description: Ipv6 Subnet
          items:
            $ref: '#/components/schemas/Ipv6Subnet'
          type: array
      type: object
    UniManagementType:
      description: Enumeration representing the UNI Management Type options. Reference
        MEF 61.1 Section 12.2 UNI Management Type Service Attribute.
      enum:
      - SUBSCRIBER_MANAGEMENT
      - PROVIDER_MANAGEMENT
      type: string
    VlanId:
      description: "Data type used for VLAN id configuration. Defined as a Integer,\
        \ Value 1 to 4094."
      maximum: 4094
      minimum: 1
      type: integer
    Vrid:
      description: "VRID (Virtual Router ID) as defined in RFC 5798[29] is a number\
        \ between 1 and 255"
      maximum: 255
      minimum: 1
      type: integer
