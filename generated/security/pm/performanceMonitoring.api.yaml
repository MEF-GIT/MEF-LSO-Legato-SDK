        \  exceeds the threshold\n- tooManyRequests: The number of simultaneous requests\
        \ from one API \n  client exceeds the threshold\n- performanceProfileInUse:\
        \ Requested Performance Profile is being used\n  by a Performance Job\n- otherIssue:\
        \ Other problem was identified (detailed information\n  provided in a reason)."
      enum:
      - missingProperty
      - invalidValue
      - invalidFormat
      - referenceNotFound
      - unexpectedProperty
      - tooLargeDataset
      - tooManyRecords
      - tooManyRequests
      - performanceProfileInUse
      - otherIssue
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
