            \ To subscribe for more than one event type, put the values separated\
            \ by a comma: `eventType=performanceReportStateChangeEvent,performanceJobCreateEvent`.\
            \ The possible values are enumerated by Event type enums in performanceNotification.api.yaml.\
            \ An empty query is treated as specifying no filters - ending in subscription\
            \ for all event types."
          type: string
      required:
      - callback
      type: object
