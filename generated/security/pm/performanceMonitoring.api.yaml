    TimeDurationUnits:
      description: >-
        The unit of measure in the duration. For example, if an interval is
        2ms, this element is MS.
      enum:
        - NS
        - US
        - MS
        - SEC
        - MIN
        - HOUR
        - DAY
        - WEEK
        - MONTH
        - YEAR
      type: string
    Source:
      description: >-
        Describes the source (Buyer/Client or Seller/Server) from which the
        action was done.
      enum:
        - client
        - server
      type: string
