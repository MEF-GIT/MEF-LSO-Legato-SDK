          description: "This callback value must be set to the *host* property from\
            \ Performance Notification API (performanceNotification.api.yaml). This\
            \ property is appended with the base path and notification resource path\
            \ specified in that API to construct a URL to which notification is sent.\
            \ E.g. for 'callback':  \"https://buyer.co/listenerEndpoint\", the performance\
            \ job state change event notification will be sent to `https://buyer.co/listenerEndpoint/mefApi/legato/performanceMonitoring/v2/listener/performanceJobStateChangeEvent`."
          type: string
        query:
          description: "This attribute is used to define which type of events to register\
