    OutputFormat:
      description: List of possible output formats for the Report.
      enum:
        - json
        - xml
        - avro
        - csv
      type: string
    PerformanceJob:
      allOf:
        - $ref: '#/components/schemas/PerformanceJob_Create'
        - properties:
            creationDateTime:
              description: Date when the Performance Job was created.
              format: date-time
              type: string
            href:
              description: Hyperlink reference
              format: uri
              type: string
            id:
              description: Unique identifier
              type: string
            lastTimeModified:
              description: Date when the Performance Job was last modified.
              format: date-time
              type: string
            state:
              $ref: '#/components/schemas/PerformanceJobStateType'
            terminationError:
              description: >-
