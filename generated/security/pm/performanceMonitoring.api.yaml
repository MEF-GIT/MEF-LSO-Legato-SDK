    RecurringSchedule:
      description: "A definition of recurring schedule to run a job based on the Cron\
        \  utility in Linux-like systems. It defines how the job should  periodically\
        \ run at specified times, dates, or intervals. "
      properties:
        second:
          description: "A definition of time (seconds) to run a job. Allowed values:\
            \ 0-59,  and special characters: (,-*/), where:\n  - `*` -> any value\n\
            \  - `,` -> value list seprator\n  - `-` -> range of values\n  - '/' ->\
            \ step values\nFor example:\n  - */5 * * * * * -> run a job at every 5th\
            \ second. \n  - */30 */1 * * * * -> run a job at every 30 seconds \n \
            \ past every minute."
          type: string
        minute:
          description: "A definition of time (minutes) to run a job. Allowed values:\
            \ 0-59,  and special characters: (,-*/), where:\n  - `*` -> any value\n\
            \  - `,` -> value list seprator\n  - `-` -> range of values\n  - '/' ->\
            \ step values\nFor example:\n  - 0 */10 * * * * -> run a job at every\
            \ 10th minute. \n  - 0 */30 0 * * * -> run a job at every 30th minute\
            \ past midnight.\n  - 0 */30 8 * * 1 -> run a job at every 30th minute\
            \ \n  past hour 8 on Monday."
          type: string
        hour:
          description: "A definition of time (hour) to run a job. Allowed values:\
            \ 0-23,  and special characters: (,-*/), where:\n  - `*` -> any value\n\
            \  - `,` -> value list seprator\n  - `-` -> range of values\n  - '/' ->\
            \ step values\nFor example:\n  - 0 0 10 10 * * -> run a job at 10 am on\
            \ 10th day of every month. \n  - 0 * 1,2 * * * -> run a job at every minute\
            \ past hour 1 and 2.\n  - 0 0 */2 * * * -> run a job at every 2nd hour."
          type: string
        dayOfMonth:
          description: "A definition of time (day of month) to run a job.  Allowed\
            \ values: 1-31, and special characters: (,-*/), where:\n  - `*` -> any\
            \ value\n  - `,` -> value list seprator\n  - `-` -> range of values\n\
            \  - '/' -> step values\nFor example:\n  - 0 0 0 1,5,10,15 * * -> run\
            \ a job at midnight \n  on every 1st, 5th, 10th, 15th day of month. \n\
            \  - 0 0 */1 1-10 1-3 * -> run a job at every full hour between 1st \n\
            \  and 10th day of month in January, February, and March."
          type: string
        month:
          description: "A definition of time (month) to run a job. Allowed values:\
            \ 1-12 or JAN-DEC, and special characters: (,-*/), where:\n  - `*` ->\
            \ any value\n  - `,` -> value list seprator\n  - `-` -> range of values\n\
            \  - '/' -> step values\nFor example:\n  - 0 5 0 * 8 * -> run a job at\
            \ 00:05 on every day in August. \n  - 0 0 0,12 1 */2 * -> run a job at\
            \ midnight and noon \n  on every 1st day of every 2nd month."
          type: string
        dayOfWeek:
          description: "A definition of time (day of week) to run a job. Allowed values:\
            \ 0-6 or SUN-SAT, and special characters: (,-*/), where:\n  - `*` -> any\
            \ value\n  - `,` -> value list seprator\n  - `-` -> range of values\n\
            \  - '/' -> step values\nFor example:\n  - 0 0 22 * * 1-5 -> run a job\
            \ at 22:00 on every day \n  between Monday and Friday. \n  - 0 5 4 * *\
            \ sun -> run a job at 04:05 on Sunday."
          type: string
        hourRange:
          description: "A list of time ranges within a specific day that the schedule\
            \ will be active on, for example, 08:00-12:00, 16:00-19:00."
          items:
            $ref: '#/components/schemas/HourRange'
          type: array
      type: object
    ReportContentItem:
      description: Single item of the performance monitoring results in case result
        format was set to payload. Each item contains the timeframe of the collected
        data and a list of values measured in that timeframe.
      properties:
        measurementTime:
          $ref: '#/components/schemas/MeasurementTime'
        measurementDataPoints:
          description: List of performance monitoring values measured in the related
            timeframe.
          items:
            $ref: '#/components/schemas/ResultPayload'
          type: array
      required:
      - measurementDataPoints
      - measurementTime
      type: object
    ReportingTimeframe:
      description: Specifies the date range between which data points will be included
        in the report.
      properties:
        reportingStartDate:
          description: Start date of reporting timeframe.
          format: date-time
          type: string
        reportingEndDate:
          description: End date of reporting timeframe.
          format: date-time
          type: string
      type: object
    ResultFormat:
      description: List of possible result formats that define how Seller/Server will
        deliver Performance Report to the Buyer/Client.
      enum:
      - attachment
      - payload
      type: string
    ResultPayload:
      description: ResultPayload is used as an extension point for MEF-specific service
        performance monitoring results. The `@type` attribute is used as a discriminator.
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          description: "The name that uniquely identifies the type of performance\
            \ monitoring results that are returned by the Performance Report. In the\
            \ case of MEF services, this is the URN provided in the performance monitoring\
            \ results specification. The named type must be a subclass of ResultPayload."
          type: string
      required:
      - '@type'
      type: object
    ScheduleDefinition:
      description: The schedule definition for running jobs.
      properties:
        scheduleDefinitionStartTime:
          description: The start time of the Schedule Definition. If the attribute
            is  empty the Schedule starts immediately after provisioning of the Job.
          format: date-time
          type: string
        scheduleDefinitionEndTime:
          description: "The end time of the Schedule Definition. If the attribute\
            \ is empty the Schedule runs forever, not having a time constraint."
          format: date-time
          type: string
        recurringSchedule:
          $ref: '#/components/schemas/RecurringSchedule'
        executionDuration:
          $ref: '#/components/schemas/Interval'
      type: object
    ServiceId:
      allOf:
      - $ref: '#/components/schemas/MonitoredObjectId'
      - properties:
          serviceIdFrom:
            description: Identifier of a Service Endpoint.
            type: string
          serviceIdTo:
            description: Identifier of a Service Endpoint.
            type: string
        required:
        - serviceIdFrom
        - serviceIdTo
        type: object
      description: Identifier of a Service.
    ServicePayloadSpecificAttributes:
      description: ServicePayloadSpecificAttributes is used as an extension point
        for  MEF-specific service performance monitoring configuration. The `@type`
        attribute is used as a discriminator.
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          description: "Uniquely identifies the type of performance monitoring configuration\
            \ that specifies PM objectives. In the case of MEF services, this is the\
            \ URN provided in the performance monitoring configuration specification.\
            \ The named type must be a subclass of ServicePayloadSpecificAttributes."
          type: string
      required:
      - '@type'
      type: object
    TrackingRecord:
      description: "Tracking Records allow the tracking of modifications of  Performance\
        \ Job, Profile, or Report."
      properties:
        creationDate:
          description: Date when the record was created.
          format: date-time
          type: string
        description:
          description: Free-text field describing the action that created the Tracking
            Record and its details.
          type: string
        id:
          description: Identifier of the Tracking Record.
          type: string
        relatedObjectId:
          description: "Identifier of Performance Job, Profile or Report."
          type: string
        request:
          description: Request that created the Tracking Record.
          type: string
        system:
          description: Describes the system from which the action was done.
          type: string
        user:
          description: Describes the user doing the action.
          type: string
      required:
      - creationDate
      - id
      - relatedObjectId
      type: object
    TrackingRecord_Find:
      description: This class represents a single list item for the response of the
        `listTrackingRecord` operation.
      properties:
        creationDate:
          description: Date when the record was created.
          format: date-time
          type: string
        description:
          description: "Describes the action that created the Tracking Record, such\
            \ as: create, update."
          type: string
        id:
          description: Identifier of the Tracking Record.
          type: string
        relatedObjectId:
          description: "Identifier of Performance Job, Profile or Report."
          type: string
        user:
          description: User that executed the action which created a Tracking Record.
          type: string
      required:
      - creationDate
      - id
      - relatedObjectId
      type: object
    _attype:
      description: This field is used as a discriminator to differentiate if monitored
        object is an Entity or a Service.
      enum:
      - Entity
      - Service
      type: string
  securitySchemes:
    oauth2MEFLSOAPI:
      description: Default m2m client code
      flows:
        clientCredentials:
          refreshUrl: http://mef.net/example/refresh
          scopes:
            default: default scope
          tokenUrl: http://mef.net/example/token
      type: oauth2
