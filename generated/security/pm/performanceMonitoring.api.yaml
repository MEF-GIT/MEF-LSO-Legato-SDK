openapi: 3.0.1
info:
  description: "**This file forms part of MEF W143**\n\n**This API implements part\
    \ of Business Requirements & Use Cases described\nin MEF W133.1.**\n\n**This specification\
    \ represents MEF work in progress and is subject to\nchange.**\n\nMEF Performance\
    \ Monitoring API allows to manage Performance Profiles, \nPerformance Jobs and\
    \ collect Performance Reports, as well as receive \nnotifications related to these\
    \ entities. This allows managing the \nperformance objectives that are typically\
    \ associated with an SLS. \n\nThree types of performance-related entities are\
    \ supported by the API:\n- **Performance Monitoring Profile** - templates used\
    \ to simplify the PM \nJob provisioning. Common attributes for PM Jobs are defined\
    \ in the PM \nProfile. One PM Profile can be used by multiple PM Jobs but PM Jobs\
    \ can \nbe created without relationship to PM Profile.\n\n- **Performance Monitoring\
    \ Job** - provisions the performance monitoring\nobjectives specific to each subject\
    \ of monitoring which could be an \nordered pair (i.e., two UNIs) or an entity\
    \ (i.e., port).\n\n- **Performance Monitoring Report** - The execution of PM Job\
    \ results in\nPerformance Monitoring collections that provide Buyer/Client with\
    \ \nperformance objective results. In some cases performance collection\ncan be\
    \ produced on Buyer/Client request which can be useful for collecting\npassive\
    \ statistics or historical data.\n\nList of use cases supported by the API:\n\
    - Create Performance Monitoring Profile\n- Retrieve list of Performance Monitoring\
    \ Profiles\n- Retrieve Performance Monitoring Profile by Profile Identifier\n\
    - Modify Performance Monitoring Profile\n- Delete Performance Monitoring Profile\n\
    - Subscribe to Performance Monitoring Profile Notifications\n- Unsubscribe from\
    \ Performance Monitoring Profile Notifications\n\n- Create Performance Monitoring\
    \ Job\n- Retrieve list of Performance Monitoring Jobs\n- Retrieve Performance\
    \ Monitoring Job by Job Identifier\n- Modify Performance Monitoring Job\n- Retrieve\
    \ Modify Performance Monitoring Job List\n- Retrieve Modify Performance Monitoring\
    \ Job by Identifier\n- Cancel Performance Monitoring Job\n- Retrieve Cancel Performance\
    \ Monitoring Job List\n- Retrieve Cancel Performance Monitoring Job by Identifier\n\
    - Suspend Performance Monitoring Job\n- Resume Performance Monitoring Job\n- Subscribe\
    \ to Performance Monitoring Job Notifications\n- Unsubscribe from Performance\
    \ Monitoring Job Notifications\n\n- Create Performance Monitoring Report\n- Retrieve\
    \ list of Performance Monitoring Reports\n- Retrieve Performance Report by Report\
    \ Identifier\n- Subscribe to Performance Monitoring Report Notifications\n- Unsubscribe\
    \ from Performance Monitoring Report Notifications\n\nCopyright 2024 MEF Forum\
    \ and its contributors\n\nThis file includes content based on the TM Forum Performance\
    \ Management API\n(TMF628 v5.0.0) available at \nhttps://www.tmforum.org/oda/open-apis/directory/performance-management-api-TMF628/v5.0,\
    \ which is licensed by \nthe TM Forum under the Apache License version 2.0. Such\
    \ content has been\nmodified by the MEF Forum and its contributors.\n"
  title: Performance Monitoring
  version: 3.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/legato/performanceMonitoring/v3/"
  variables:
    serverBase:
      default: mef.net
      description: The base of SOF's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- name: performanceJob
- name: modifyPerformanceJob
- name: suspendPerformanceJob
- name: resumePerformanceJob
- name: cancelPerformanceJob
- name: performanceJobComplexQuery
- name: performanceProfile
- name: performanceProfileOperations
- name: performanceReport
- name: performanceReportComplexQuery
- name: trackingRecord
- name: events subscription
paths:
  /performanceJob:
    get:
      description: "The Buyer/Client requests a list of PM Jobs based on a set of\
        \ filter criteria. The Seller/Server returns a summarized list of PM  Jobs.\
        \ For each PM Job returned, the Seller/Server also provides a  Performance\
        \ Job Identifier that uniquely identifiers this PM Job within the Seller/Server.\
        \ The order of the elements returned to the  Buyer/Client is defined by the\
        \ Seller/Server (e.g. natural order) and does not change between the pages."
      operationId: listPerformanceJob
      parameters:
      - description: Identifier assigned and understandable by Buyer/Client to  facilitate
          search requests.
        in: query
        name: buyerJobId
        required: false
        schema:
          type: string
      - description: Identifier of a Service Endpoint.
        in: query
        name: serviceIdFrom
        required: false
        schema:
          type: string
      - description: Identifier of a Service Endpoint.
        in: query
        name: serviceIdTo
        required: false
        schema:
          type: string
      - description: Identifier of an Entity.
        in: query
        name: entityId
        required: false
        schema:
          type: string
      - description: Identifier of Performance Profile used as a template for  Performance
          Job.
        in: query
        name: performanceProfileId
        required: false
        schema:
          type: string
      - description: State of the Performance Job. See `PerformanceJobStateType`  definition
          for details.
        in: query
        name: state
        required: false
        schema:
          enum:
          - acknowledged
          - cancelled
          - completed
          - inProgress
          - pending
          - pendingCancel
          - rejected
          - resourcesUnavailable
          - scheduled
          - suspended
          type: string
      - description: Date when the job was created - greater than.
        in: query
        name: creationDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the job was created - lower than.
        in: query
        name: creationDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Type of the Performance Job.
        in: query
        name: jobType
        required: false
        schema:
          $ref: '#/components/schemas/JobType'
      - description: Sampling rate of the collection of measurements.
        in: query
        name: granularity
        required: false
        schema:
          $ref: '#/components/schemas/Interval'
      - description: Definition of time period during which report will be active  and
          collect measurements.
        in: query
        name: reportingPeriod
        required: false
        schema:
          $ref: '#/components/schemas/Interval'
      - description: Identifier of consuming application.
        in: query
        name: consumingApplicationId
        required: false
        schema:
          type: string
      - description: Identifier of producing application.
        in: query
        name: producingApplicationId
        required: false
        schema:
          type: string
      - description: The priority of the Performance Job.
        in: query
        name: jobPriority
        required: false
        schema:
          type: string
      - description: Requested index for start of item to be provided in response
          requested by the client. Note that the index starts with "0".
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Requested number of resources to be provided in response.
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/PerformanceJob_Find'
                type: array
          description: '''OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)'''
          headers:
            X-Pagination-Throttled:
              description: Used to indicate that result page was throttled to maximum
                possible size  and there are additional results that can be fetched.
              schema:
                type: boolean
            X-Total-Count:
              description: "The total number of matching items. E.g. if there are\
                \ 50 matching items in total, but the request has offset=10 and limit=10,\
                \ then the X-Total-Count is 50."
              schema:
                type: integer
            X-Result-Count:
              description: The number of items included in the response.
              schema:
                type: integer
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems.
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - listPerformanceJob
      summary: List or find Performance Job objects.
      tags:
      - performanceJob
    post:
      description: A request initiated by the Buyer/Client to create a Performance
        Job in the Seller/Server system to indicate performance monitoring objectives.
      operationId: createPerformanceJob
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/PerformanceJob_Create'
        description: The Performance Job to be created.
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/PerformanceJob'
          description: '''Created (https://tools.ietf.org/html/rfc7231#section-6.3.2)'''
        "400":
          content:
            application/json;charset=utf-8:
