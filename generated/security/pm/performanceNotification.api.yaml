components:
  schemas:
    Error:
      description: |
        Standard Class used to describe API response error.
        Not intended to be use directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        reason:
          description: Text that explains the reason for error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        message:
          description: Text that provide mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        referenceError:
          description: url pointing to documentation describing the error.
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: "One of the following error codes: - missingQueryParameter: The\
        \ URI is missing a required query-string parameter. - missingQueryValue: The\
        \ URI is missing a required query-string parameter value. - invalidQuery:\
        \ The query section of the URI is invalid. - invalidBody: The request has\
        \ an invalid body."
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired.
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: "This code indicates that the server understood the request but\
        \ refuses \nto authorize it because of one of the following error codes:\n\
        - accessDenied: Access denied.\n- forbiddenRequester: Forbidden requester.\n\
        - tooManyUsers: Too many users."
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error408:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: "List of supported error codes: - timeOut: Request Time-out\
              \ - indicates that the server did not receive a complete request message\
              \ within the time that it was prepared to wait."
            enum:
            - timeOut
            type: string
        required:
        - code
        type: object
      description: Request Time-out (https://tools.ietf.org/html/rfc7231#section-6.5.7)
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: "One of the following error codes: - internalError: Internal\
              \ server error - the server encountered an unexpected condition that\
              \ prevented it from fulfilling the request."
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    Event:
      description: Event class is used to describe the information structure used
        for notification.
      properties:
        eventId:
          description: Id of the event
          type: string
        eventTime:
          description: Date-time when the event occurred.
          format: date-time
          type: string
      required:
      - eventId
      - eventTime
      type: object
    PerformanceJobEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            $ref: '#/components/schemas/PerformanceJobEventType'
          event:
            $ref: '#/components/schemas/PerformanceJobEventPayload'
        required:
        - event
        - eventType
        type: object
    PerformanceJobEventPayload:
      description: The identifier of the Performance Job being the subject to this
        event and its state.
      properties:
        href:
          description: Hyperlink to access the Performance Job.
          type: string
        id:
          description: ID of the Performance Job.
          type: string
        state:
          $ref: '#/components/schemas/State'
          description: State of the Performance Job.
      required:
      - id
      type: object
    PerformanceJobEventType:
      description: Indicates the type of Performance Job event.
      enum:
      - performanceJobCreateEvent
      - performanceJobStateChangeEvent
      - performanceJobAttributeValueChangeEvent
      type: string
    PerformanceJobReportReadyEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            $ref: '#/components/schemas/PerformanceJobReportReadyEventType'
          event:
            $ref: '#/components/schemas/PerformanceJobReportReadyEventPayload'
        required:
        - event
        - eventType
        type: object
    PerformanceJobReportReadyEventPayload:
      description: The identifier of the Performance Job and Report ID being the subjects  of
        this event.
      properties:
        href:
          description: Hyperlink to access the Performance Job.
          type: string
        id:
          description: ID of the Performance Job.
          type: string
        reportHref:
          description: Hyperlink to access the Performance Report.
          type: string
        reportId:
          description: ID of generated Performance Report.
          type: string
      required:
      - id
      - reportId
      type: object
    PerformanceJobReportReadyEventType:
      description: Indicates the type of Performance Job event.
      enum:
      - performanceJobReportReadyEvent
      type: string
    PerformanceJobReportPreparationErrorEvent:
      allOf:
