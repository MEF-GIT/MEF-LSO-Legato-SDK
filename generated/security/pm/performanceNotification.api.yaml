openapi: 3.0.1
info:
  description: "**This file forms part of MEF W143**\n\n**This API implements part\
    \ of Business Requirements & Use Cases described \nin MEF W133.1.**\n\n**This\
    \ specification represents MEF work in progress and is subject to\nchange.**\n\
    \nPerformance monitoring allows the Buyer/Client to provision entities that\n\
    define performance objectives (Performance Profile, Performance Job),\ncollect\
    \ monitoring data (Performance Report), as well as receive\nnotifications about\
    \ these objects. This allows managing issues and situations that\nare not part\
    \ of normal operations of the Service provided by the Seller.\n\nList of supported\
    \ use cases:\n- Send Event Notification\n\nCopyright 2024 MEF Forum and its contributors\n\
    \nThis file includes content based on the TM Forum Performance Management API\
    \ \n(TMF628 v14.5.1) available at https://www.tmforum.org/resources/standard/tmf628-performance-management-api-rest-specification-r14-5-0/,\n\
    which is licensed by the TM Forum under the Apache License version 2.0.\nSuch\
    \ content has been modified by the MEF Forum and its contributors.\n"
  title: Performance Monitoring Notification
  version: 3.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/legato/performanceNotification/v3/"
  variables:
    serverBase:
      default: mef.net
      description: The base of Buyer/Client's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- description: The Buyer/Client's endpoint to send particular event types  notifications
    to.
