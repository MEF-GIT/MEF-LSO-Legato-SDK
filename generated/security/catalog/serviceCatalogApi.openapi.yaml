openapi: 3.0.3
info:
  description: "The Service Catalog API provides a standardized mechanism for retrieving\
    \ \n*ServiceSpecifications*. Using these APIs Business Applications (BUS) \nsystems\
    \ query the **Service Catalog** for *ServiceSpecifications* supported \nby the\
    \ Service Orchestration Function (SOF).\n\nAdditionally, the APIs also allow the\
    \ BUS to register listeners to be \nnotified of the changes to the *ServiceSpecifications*.\
    \  \n\n- MEF Developer Guide Reference : MEF_W99 v1.0\n\n- TMF API Reference :\
    \ TMF 633 v18.5.1\n\nCopyright © MEF 2020. All Rights Reserved\n\nThis file includes\
    \ content based on the TM Forum Service Catalog Management API\n(TMF633 v3.0.0)\
    \ available at\nhttps://github.com/tmforum-apis/TMF633_ServiceCatalog, which is\
    \ licensed\nby the TM Forum under the Apache License version 2.0. Such content\
    \ has been\nmodified by the MEF Forum and its contributors."
  title: Legato Service Catalog API
  version: 4.0.0-RC
servers:
- url: "https://{server}:{port}{basePath}"
  variables:
    server:
      default: mef.net
    port:
      default: "8443"
      enum:
      - "8443"
      - "443"
    basePath:
      default: /mefApi/legato/serviceCatalog/v4
security:
- oauth2MEFLSOAPI:
  - default
tags:
- description: Mechanisms for BUS to query and retrieve *ServiceSpecifications*.
  name: ServiceSpecification
- description: Mechanisms for BUS to subscribe/unsubscribe to *Notifications*.
  name: EventSubscriptionHub
paths:
  /serviceSpecification:
    get:
      deprecated: false
      description: This operation returns service specifications from a catalog
      operationId: serviceSpecificationFind
      parameters:
      - description: Service Category
        in: query
        name: category
        required: false
        schema:
          type: string
      - description: Service Specification status
        in: query
        name: lifecycleStatus
        required: false
        schema:
          $ref: '#/components/schemas/ServiceSpecificationState'
      - description: "Comma-separated properties of the Service Specification to be\
          \ \nincluded in the returned response"
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: "Requested start index in a ordered list (sorted by id property)\
          \ of \nmatching Service Specifications to be provided in response. "
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: "Requested maximum number of Service Specifications to be provided\
          \ \nin the response"
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceSpecification'
                type: array
          description: Ok
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable entity
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
        "503":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      security:
      - oauth2MEFLSOAPI:
        - serviceSpecificationFind
      summary: List service specifications
      tags:
      - ServiceSpecification
  /serviceSpecification/{id}:
    get:
      deprecated: false
      description: This operation returns a service specification by its id from a
        catalog. Attribute selection is enabled using the fields attribute.
      operationId: serviceSpecificationGet
      parameters:
      - description: Identifier of the ServiceSpecification
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "Comma-separated properties of the Service Specification to be\
          \ \nincluded in the returned response"
        in: query
        name: fields
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceSpecification'
          description: Ok
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "405":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method Not Allowed
        "408":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request Time-out
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable entity
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
        "503":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      security:
      - oauth2MEFLSOAPI:
        - serviceSpecificationGet
      summary: Retrieve a service specification
      tags:
      - ServiceSpecification
  /hub:
    post:
      deprecated: false
      description: Structure used to create a hub (to subscribe to notification
      operationId: hubCreate
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/EventSubscriptionInput'
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Created
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "405":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method Not Allowed
        "408":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request Time-out
        "409":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
        "503":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      security:
      - oauth2MEFLSOAPI:
        - hubCreate
      summary: Create Hub
      tags:
      - EventSubscriptionHub
  /hub/{hubId}:
    delete:
      deprecated: false
      description: Delete an existing Hub
      operationId: hubDelete
      parameters:
      - in: path
        name: hubId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "405":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method Not Allowed
        "408":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request Time-out
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable entity
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
        "503":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      security:
      - oauth2MEFLSOAPI:
        - hubDelete
      summary: Delete Hub
      tags:
      - EventSubscriptionHub
    get:
      deprecated: false
      operationId: hubGet
      parameters:
      - in: path
        name: hubId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Ok
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "405":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method Not Allowed
        "408":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request Time-out
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable entity
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
        "503":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      security:
      - oauth2MEFLSOAPI:
        - hubGet
      summary: get hub
      tags:
      - EventSubscriptionHub
components:
  responses:
    BadRequest:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad Request
    Unauthorized:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    Forbidden:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    NotFound:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Not Found
    UnprocessableEntity:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unprocessable entity
    InternalServerError:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Internal Server Error
    ServiceUnavailable:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Service Unavailable
    MethodNotAllowed:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Method Not Allowed
    RequestTimeout:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request Time-out
    Conflict:
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict
  schemas:
    ServiceSpecificationState:
      description: "List of possible states that represents the entire Service \n\
        Specification lifecycle. This includes all the processes required to \ndesign,\
        \ build, deploy, maintain and ultimately retire the catalog \nelement."
      enum:
      - IN_STUDY
      - IN_DESIGN
      - IN_TEST
      - LAUNCHED
      - ACTIVE
      - RETIRED
      - OBSOLETE
      - REJECTED
      type: string
    ServiceSpecification:
      allOf:
      - $ref: '#/components/schemas/Addressable'
      - properties:
          category:
            description: |-
              The category is used to group service specifications in logical
              containers. Categories can be further sub-categorized into other
              categories.
            type: string
          subcategory:
            description: Categories can be further sub-categorized into other categories.
            type: string
          version:
            description: Service specification version
            type: string
          description":
            description: A narrative that explains  details of the service specification.
            type: string
          isBundle:
            description: "Determines whether a ServiceSpecification represents a single\
              \ \nServiceSpecification (false), or a bundle of \nServiceSpecification\
              \ (true)."
            type: boolean
          lastUpdate:
            description: Date and time of the last update of the service specification
            format: date-time
            type: string
          validFor:
            $ref: '#/components/schemas/TimePeriod'
            description: The period for which the service specification is valid
            type: object
          lifecycleStatus:
            $ref: '#/components/schemas/ServiceSpecificationState'
          attachment:
            description: "A list of attachments (Attachment [*]). Complements \nthe\
              \ description of the specification through video, pictures..."
            items:
              $ref: '#/components/schemas/AttachmentRef'
            maxItems: 1
            minItems: 0
            type: array
          relatedParty:
            items:
              $ref: '#/components/schemas/RelatedPartyRef'
            minItems: 0
            type: array
          serviceLevelSpecification:
            description: "A list of service level specifications related to this service\
              \ specification, and which will need to be satisifiable for corresponding\
              \ service instances; e.g. Gold, Platinum"
            items:
              $ref: '#/components/schemas/ServiceLevelSpecificationRef'
            type: array
          serviceSpecRelationship:
            description: "A list of service specifications related to this specification,\
              \ e.g. migration, substitution, dependency or exclusivity relationship"
            items:
              $ref: '#/components/schemas/ServiceSpecificationRelationship'
            type: array
          serviceSpecCharacteristic:
            description: "A list of service spec characteristics (ServiceSpecCharacteristic\
              \ [*]). This class represents the key features of this service specification."
            items:
              $ref: '#/components/schemas/ServiceSpecCharacteristic'
            type: array
          targetServiceSchema:
            $ref: '#/components/schemas/TargetServiceSchema'
        type: object
      description: |-
        ServiceSpecification offers the ability to describe the characteristics
        of a specific type of service. Functionally, it acts as a template by
        which Services may be instantiated. By sharing the same specification,
        these services would therefore share the same set of characteristics.
    AttachmentRef:
      allOf:
      - $ref: '#/components/schemas/Referenceable'
      - properties:
          description:
            description: A narrative text describing the content of the attachment
            type: string
          url:
            description: Link to the attachment media/content
            format: uri
            type: string
        type: object
      description: |-
        An attachment represents a file that is used to complement the
        description of an entity through video, pictures, etc..
    ServiceLevelSpecificationRef:
      allOf:
      - $ref: '#/components/schemas/Referenceable'
      description: "A Service Level Specification represents a pre-defined or negotiated\
        \ set\nof Service Level Objectives. In addition, certain consequences are\
        \ \nassociated with not meeting the Service Level Objectives. Service Level\
        \ \nAgreements are expressed in terms of Service Level Specifications."
    ServiceSpecificationRelationship:
      allOf:
      - $ref: '#/components/schemas/Referenceable'
      - properties:
          relationshipType:
            $ref: '#/components/schemas/ServiceSpecificationRelationshipType'
          role:
            description: The association role for this service specification.
            type: string
          validFor:
            $ref: '#/components/schemas/TimePeriod'
            type: object
        type: object
      description: Reference to a ServiceSpecification instance.
    ServiceSpecificationRelationshipType:
      description: Relationship type.
      enum:
      - reliesOn
      - dependency
      - migration
      - substitution
      - exclusivity
      type: string
    ServiceSpecCharacteristic:
      allOf:
      - $ref: '#/components/schemas/Addressable'
      - properties:
          '@valueSchemaLocation':
            description: "This (optional) field provides a link to the schema describing\
              \ \nthe value type."
            type: string
          valueType:
            description: |-
              A kind of value that the characteristic can take on, such as numeric,
              text and so forth
            type: string
          description:
            description: A narrative that explains in details the nature of the serviceSpecCharacteristic
            type: string
          extensible:
            description: "An indicator that specifies that the values for the \ncharacteristic\
              \ can be extended by adding new values when \ninstantiating a characteristic\
              \ for an Entity."
            type: boolean
          isUnique:
            description: |-
              An indicator that specifies if a value is unique for the
              specification. Possible values are; "unique while value is in effect" and "unique whether value is in effect or not"
            type: boolean
          maxCardinality:
            description: "The maximum number of instances a CharacteristicValue can\
              \ take on. For example, zero to five phone numbers in a group calling\
              \ plan, where five is the value for the maxCardinality."
            type: integer
          minCardinality:
            description: "The minimum number of instances a CharacteristicValue can\
              \ take on. For example, zero to five phone numbers in a group calling\
              \ plan, where  zero is the value for the minCardinality."
            type: integer
          regex:
            description: A rule or principle represented in regular expression used
              to derive the value of a characteristic value.
            type: string
          validFor:
            $ref: '#/components/schemas/TimePeriod'
            description: The period for which the serviceSpecCharacteristic is valid
            type: object
          serviceSpecCharRelationship:
            description: "A list of service spec char relationships. An aggregation,\
              \ migration, substitution, dependency or exclusivity relationship between/among\
              \ Specification Characteristics."
            items:
              $ref: '#/components/schemas/ServiceSpecificationRelationship'
            type: array
          serviceSpecCharacteristicValue:
            description: "A list of service spec characteristic values. A \nServiceSpecCharacteristicValue\
              \ object is used to define a set \nof attributes, each of which can\
              \ be assigned to a corresponding \nset of attributes in a ServiceSpecCharacteristic\
              \ object. The \nvalues of the attributes in the ServiceSpecCharacteristicValue\
              \ \nobject describe the values of the attributes that a \ncorresponding\
              \ ServiceSpecCharacteristic object can take on."
            items:
              $ref: '#/components/schemas/ServiceSpecCharacteristicValue'
            type: array
        type: object
      description: "This class represents the key features of this service specification.\
        \ \nFor example, bandwidth is a characteristic of many different types of\n\
        services; if bandwidth is a relevant characteristic (e.g., from the\npoint-of-view\
        \ of a Customer obtaining this Service via a Product) then\nbandwidth would\
        \ be a ServiceSpecCharacteristic for that particular\nService."
    ServiceSpecCharacteristicValue:
      allOf:
      - $ref: '#/components/schemas/Addressable'
      - properties:
          isDefault:
            description: Indicates if the value is the default value for a characteristic
            type: boolean
          rangeInterval:
            description: "An indicator that specifies the inclusion or exclusion of\
              \ the\nvalueFrom and valueTo attributes. If applicable, possible \n\
              values are \"open\", \"closed\", \"closedBottom\" and \"closedTop\"."
            type: string
          regex:
            description: A regular expression constraint for given value
            type: string
          unitOfMeasure:
            description: "A length, surface, volume, dry measure, liquid measure,\
              \ money, \nweight, time, and the like. In general, a determinate quantity\
              \ \nor magnitude of the kind designated, taken as a standard of \ncomparison\
              \ for others of the same kind, in assigning to them \nnumerical values,\
              \ as 1 foot, 1 yard, 1 mile, 1 square foot."
            type: string
          valueFrom:
            description: The low range value that a characteristic can take on
            type: integer
          valueTo:
            description: The upper range value that a characteristic can take on
            type: integer
          valueType:
            description: "A kind of value that the characteristic can take on, such\
              \ as numeric,  text, and so forth"
            type: string
          validFor:
            $ref: '#/components/schemas/TimePeriod'
            description: The period of time for which a value is applicable
            type: object
          value:
            additionalProperties:
              type: object
            description: "A discrete value that the characteristic can take on, or\
              \ the actual value of the characteristic"
            type: object
        type: object
      description: "A ServiceSpecCharacteristicValue object is used to define a set\
        \ of attributes, each of which can be assigned to a corresponding set of attributes\
        \ in a ServiceSpecCharacteristic object. The values of the attributes in the\
        \ ServiceSpecCharacteristicValue object describe the values of the attributes\
        \ that a corresponding ServiceSpecCharacteristic object can take on."
    TargetServiceSchema:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      description: The reference to the schema and type of target service which is
        described by service specification
    Error:
      description: "Used when an API throws an Error, typically with a HTTP error\
        \     response-code (3xx, 4xx, 5xx)"
      properties:
        code:
          description: |-
            Application related code.
            List of supported error codes are defined below:

            **400: Bad Request**
            - 20: Invalid URL parameter value
            - 21: Missing body
            - 22: Invalid body
            - 23: Missing body field
            - 24: Invalid body field
            - 25: Missing header
            - 26: Invalid header value
            - 27: Missing query-string parameter
            - 28: Invalid query-string parameter value

            **401: Unauthorized**
            - 40: Missing credentials
            - 41: Invalid credentials
            - 42: Expired credentials

            **403: Forbidden**
            - 50: Access denied
            - 51: Forbidden requester
            - 52: Forbidden user
            - 53: Too many requests

            **404: Not Found**
            - 60: Resource not found

            **405: Method Not Allowed**
            - 61: Method not allowed

            **408: Request Timeout**
            - 63: Request time-out

            **409: Conflict**
            - 64: Resource Conflict

            **422: Unprocessable Entity**
            - Functional Error codes specific to operation

            **500: Internal Server Error**
            - 1: Internal Error

            **501: Not Implemented**

            **503: Service Unavailable**
          format: int32
          type: integer
        reason:
          description: |-
            Text that explains the reason for error. This can be shown to a
            client user.
          type: string
        message:
          description: |-
            Text that provides more details and corrective actions related to
            the error. This can be shown to a client user.
          items:
            type: string
          maxItems: 1
          minItems: 0
          type: array
        status:
          description: HTTP error code extension like 400-2.
          items:
            type: string
          maxItems: 1
          minItems: 0
          type: array
        referenceError:
          description: URI pointing to (external) documentation describing the error.
          items:
            type: string
          maxItems: 1
          minItems: 0
          type: array
      required:
      - code
      - reason
      type: object
    EventSubscriptionInput:
      description: The information needed to create a Hub.
      properties:
        query:
          description: |-
            The query must have an eventType= information.
            Optionally a ? could be added to reduce hub.
            query”:”eventType = ServiceOrderStateChangeNotification”&serviceOrder.state=COMPLETED
          type: string
        callback:
          description: URL where notification must be send
          type: string
      required:
      - callback
      - query
      type: object
    EventSubscription:
      allOf:
      - $ref: '#/components/schemas/EventSubscriptionInput'
      - properties:
          id:
            description: Unique identifier of Hub
            type: string
        required:
        - id
        type: object
      description: Resource used to manage notification subscription.
    Addressable:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - properties:
          id:
            description: "Unique identifier of the API schema object instance. The\
              \ \nID is invariant and is assigned by the server. In other words \n\
              this entity will have the same ID throught its lifetime."
            readOnly: true
            type: string
          href:
            description: URI reference of the API schema object instance.
            format: uri
            type: string
          name:
            description: Name of the API schema object instance.
            type: string
        type: object
      description: Base schema for all adressable API schema objects.
      required:
      - id
    Extensible:
      description: "Base schema for all API schema objects that support polymorphic\
        \ \nextensions of its defined schema."
      properties:
        '@type':
          description: The concrete (non-abstract) class type of the API schema object.
          type: string
        '@baseType':
          description: "When sub-classing, this defines the super/base class type\
            \ (if \napplicable) of the API schema object."
          type: string
        '@schemaLocation':
          description: A URI refernce to the schema file that defines the attributes
            and relationships of the API schema object.
          format: uri
          type: string
      required:
      - '@type'
      type: object
    TimePeriod:
      description: "A period of time, either as a deadline (endDateTime only) a startDateTime\
        \ only, or both "
      properties:
        endDateTime:
          description: "End of the time period, using IETC-RFC-3339 format"
          format: date-time
          type: string
        startDateTime:
          description: "Start of the time period, using IETC-RFC-3339 format. If you\
            \ \ndefine a start, you must also define an end"
          format: date-time
          type: string
      type: object
    RelatedPartyRef:
      allOf:
      - $ref: '#/components/schemas/Referenceable'
      - properties:
          role:
            description: "The role of the related party (e.g. Owner, requester)."
            type: string
        type: object
      description: |-
        A related party defines a party and its role, that is linked to a
        specific entity such as ServiceSpecification, ServiceOrder, Service, etc
    Referenceable:
      allOf:
      - $ref: '#/components/schemas/Addressable'
      - properties:
          '@referredType':
            description: The class type of the target API schema object instance.
            type: string
        required:
        - '@referredType'
        type: object
      description: Base schema for all adressable API schema object references.
  securitySchemes:
    oauth2MEFLSOAPI:
      description: Default m2m client code
      flows:
        clientCredentials:
          refreshUrl: http://mef.net/example/refresh
          scopes:
            default: default scope
          tokenUrl: http://mef.net/example/token
      type: oauth2
