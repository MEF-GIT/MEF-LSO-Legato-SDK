          type: string
      type: object
    TestMeasureAttributes:
      description: TestMeasureAttributes is used as an extension point for schema
        to be used that de-fines the  Test Result attributes. The `@type` attribute
        is used as a discriminator.
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          description: The named type must be a subclass of TestMeasureAttributes.
          type: string
      required:
      - '@type'
      type: object
    TestProfile:
      allOf:
      - $ref: '#/components/schemas/TestProfile_Common'
      - description: The test profile describes the test job in terms of parameters
          to be configured and measures to be taken.
        properties:
          id:
            description: A unique identifier for the Test Profile assigned by the
              Seller/Server.
            type: string
          creationDate:
            description: Date when test profile was created.
            format: date-time
            type: string
          state:
            $ref: '#/components/schemas/TestProfileStateType'
          isAssigned:
            description: Indicates if Test Profile is assigned to a Test Job.
            type: boolean
          lastUpdate:
            description: Date and time of the last update of the test profile
            format: date-time
            type: string
        type: object
    TestProfileLifecycleStatusType:
      description: |-
        Current lifecycle status of the test profile.

        | State          | MEF W136.1 name     | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |
        | -------------- | --------------   | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `experimental` | EXPERIMENTAL     | Test Profile use may be limited to a small number of users. |
        | `pending`      | PENDING          | Test Profile is waiting to be Approved |
        | `approved`     | APPROVED         | Test Profile has been Approved for general use. |
        | `deprecated`   | DEPRECATED       | Test Profile has been replaced by another Test Profile. |
      enum:
      - experimental
      - pending
      - approved
      - deprecated
      type: string
    TestProfileRef:
      allOf:
      - $ref: '#/components/schemas/TestProfileRefOrValue'
      - properties:
          href:
            description: Hyperlink to the referenced Test Profile
            type: string
          id:
            description: Identifier of the referenced Test Profile
            type: string
        required:
        - id
        type: object
      description: A reference to a Test Profile resource
    TestProfileRefOrValue:
      description: Defines the reference to Test Profile or defines values from TestProfile
        type.
      discriminator:
        mapping:
          TestProfileRef: '#/components/schemas/TestProfileRef'
          TestProfileValue: '#/components/schemas/TestProfileValue'
        propertyName: '@type'
      properties:
        '@type':
          description: This field is used as a discriminator to differentiate if object
            relates directly to Test Profile entity or defines values from TestProfile
            type.
          enum:
          - TestProfileRef
          - TestProfileValue
          type: string
      required:
      - '@type'
    TestProfileRelationshipRole:
      description: |-
        Role of the relationship.

        | role          | MEF W136.1 name    | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |
        | -------------- | -------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `primary`      | PRIMARY        | Test Profile to be started first. |
        | `secondary`    | SECONDARY      | Test Profile to be started after Primary Test Profile is completed. |
      enum:
      - primary
      - secondary
      type: string
    TestProfileRelationshipType:
      description: |-
        Type of relationship.

        | state          | MEF W136.1 name   | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |
        | -------------- | -------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `bundled`      | BUNDLED        | Two or more Test Profiles are related together in a bundle. |
      enum:
      - bundled
      type: string
    TestProfileStateType:
      description: |-
        Current lifecycle status of the test profile.

        | State          | MEF W136.1 name   | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |
        | -------------- | -------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `acknowledged` | ACKNOWLEDGED   | The Create Test Profile request has been received from the Buyer/Client and the Sell-er/Server has assigned a Test Profile Identifier to it. |
        | `completed`    | COMPLETED      | The Test Profile has been created and is ready for use by the Buyer/Client. |
        | `rejected`     | REJECTED       | The Create Test Profile does not pass attribute validation and the Create Test Profile is rejected. |
      enum:
      - acknowledged
      - completed
      - rejected
      type: string
    TestProfileValue:
      allOf:
      - $ref: '#/components/schemas/TestProfileRefOrValue'
      properties:
        description:
          description: A free-text description of the Test Profile
          type: string
        serviceSpecificTestProfileAttributes:
          $ref: '#/components/schemas/ServiceSpecificTestProfileAttributes'
        relatedServiceSpecificationId:
          description: The unique identifier of the related Service Specification
            that this Test Profile can be used to test
          type: string
        relatedContact:
          description: Contacts who manage or otherwise have an interest in this test
            profile
          items:
            $ref: '#/components/schemas/RelatedContact'
          type: array
      required:
      - '@type'
    TestProfile_Common:
      description: The common test profile specifies the common parameters  that can
        be re-used by multiple test profiles.
      properties:
        description:
          description: A free-text description of the Test Profile
          type: string
        isBundled:
          description: "Determines whether test profile represents a single test profile\
            \ (false), or a bundle of test profiles (true)."
          type: boolean
        lifecycleStatus:
          $ref: '#/components/schemas/TestProfileLifecycleStatusType'
        name:
          description: The name of the test profile
          type: string
        validFor:
          description: Last date that the test profile is valid
          format: date-time
          type: string
        relatedTestProfile:
          description: Test profile may relate to more than one sub test profiles.
          items:
            $ref: '#/components/schemas/RelatedTestProfileRef'
          type: array
        serviceSpecificTestProfileAttributes:
          $ref: '#/components/schemas/ServiceSpecificTestProfileAttributes'
        relatedServiceSpecificationId:
          description: The unique identifier of the related Service Specification
            that this Test Profile can be used to test
          type: string
        relatedContact:
          description: Contacts who manage or otherwise have an interest in this test
            profile
          items:
            $ref: '#/components/schemas/RelatedContact'
          type: array
      type: object
    TestProfile_Create:
      allOf:
      - $ref: '#/components/schemas/TestProfile_Common'
      - description: The test profile describes the test job in terms of parameters
          to be configured and measures to be taken.
        type: object
      required:
      - lifecycleStatus
      - name
      - validFor
    TestProfile_Find:
      description: This class represents a single list item for the response of  `listTestProfile`
      properties:
        id:
          description: A unique identifier for the Test Profile assigned by the Seller/Server.
          type: string
        name:
          description: The name of the test profile
          type: string
        description:
          description: A free-text description of the Test Profile
          type: string
        lifecycleStatus:
          $ref: '#/components/schemas/TestProfileLifecycleStatusType'
        creationDate:
          description: Date when test profile was created.
          format: date-time
          type: string
        lastUpdate:
          description: Date and time of the last update of the test profile
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/TestProfileStateType'
      required:
      - creationDate
      - description
      - id
      - lastUpdate
      - lifecycleStatus
      - name
      - state
      type: object
    TestProfile_Modify:
      allOf:
      - $ref: '#/components/schemas/TestProfile_Common'
      - description: The test profile describes the test job in terms of parameters
          to be configured and measures to be taken.
        type: object
  securitySchemes:
    oauth2MEFLSOAPI:
      description: Default m2m client code
      flows:
        clientCredentials:
          refreshUrl: http://mef.net/example/refresh
          scopes:
            default: default scope
          tokenUrl: http://mef.net/example/token
      type: oauth2
