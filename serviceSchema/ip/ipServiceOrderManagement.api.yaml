      properties:
        ipv4Prefix:
          $ref: '#/components/schemas/Ipv4Prefix'
          description: IPv4 prefix.
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
          description: IPv6 prefix.
      type: object
    Ipv4Prefix:
      description: Data type representing IPv4 address prefix and mask length between
        0 and 31 bits.
      properties:
        ipv4Address:
          $ref: '#/components/schemas/Ipv4Address'
          description: IPv4 address.
        prefixLength:
          description: IPv4 address prefix. Length 0-31.
          maximum: 31
          minimum: 0
          type: integer
      type: object
    Ipv4PrimarySubnet:
      allOf:
      - $ref: '#/components/schemas/Ipv4SecondarySubnet'
      - description: IPv4 Subnet used in context of Primary Ipvc subnet. It adds the
          subscriberIpv4Address attribute to the Ipv4SecondarySubnet.
        properties:
          subscriberIpv4Address:
            $ref: '#/components/schemas/Ipv4Address'
            description: Subscriber IPv4 Address
        type: object
    Ipv4SecondarySubnet:
      description: Data type representing an IPv4 subnet logical partition of an IP
        network. Included is list of Service Provider IPv4 addresses.
      properties:
        ipv4Prefix:
          $ref: '#/components/schemas/Ipv4Prefix'
          description: IPv4 address prefix (IPv4 address prefix and mask length between
            0 and 31 in bits).
        serviceProviderIpv4Addresses:
          description: |
            List of Service Provider IPv4 addresses. [R25] "If IPv4 Connection Addressing is DHCP, the UNI Access Link IPv4 Connection Addressing Primary Subnet parameter MUST contain only a single Service Provider IPv4 Address." Reference - MEF 69.1 Section 9.4
          items:
            $ref: '#/components/schemas/Ipv4Address'
          minItems: 1
          type: array
        reservedPrefixes:
          description: "List of IPv4 Prefixes, possibly empty"
          items:
            $ref: '#/components/schemas/Ipv4Prefix'
          type: array
      type: object
    Ipv6Address:
      description: Data type representing IPv6 address.
      format: ipv6
      type: string
    Ipv6AddressingType:
      description: "Enumeration representing IPv6 Address Types specific for UNI Access\
        \ Links.\n-DHCP: Dynamic Host Configuration Protocol (DHCP) is used by the\
        \ Subscriber\ndevices to request IPv6 addresses in a given subnet from the\
        \ SP or Operator.\n-SLAAC: Stateless Address Autoconfiguration (SLAAC) is\
        \ used by the Subscriber \ndevices to create unique IPv6 global addresses\
        \ within an IP Prefix advertised \nby the SP or Operator as describer in RFC\
        \ 4862.\n-STATIC: IPv6 addresses in a given IPv6 subnet are statically assigned\
        \ to the \nSP or Operator and to the Subscriber.\n- LL_ONLY: o\tIf the value\
        \ is LL-only, these are only IPv6 addresses used on \nthe UNI Access Link.\n"
      enum:
      - DHCP
      - SLAAC
      - STATIC
      - LL_ONLY
      type: string
    Ipv6Prefix:
      description: Data type representing IPv6 address prefix and mask length between
        0 and 127 in bits.
      properties:
        ipv6Address:
          $ref: '#/components/schemas/Ipv6Address'
          description: IPv6 address.
        prefixLength:
          description: IPv6 address prefix. Length 0-127.
          maximum: 127
          minimum: 0
          type: integer
      type: object
    Ipv6Subnet:
      description: IPv6Subnet is a data type representing an IPv6 subnet logical partition
        of an IP network. Included is list of Service Provider IPv6 addresses.
      properties:
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
          description: IPv6 Prefix (IPv6 address prefix and mask length between 0
            and 127 in bits).
        serviceProviderIpv6Addresses:
          description: List of IPv6 Service Provider addresses.
          items:
            $ref: '#/components/schemas/Ipv6Address'
          minItems: 1
          type: array
        reservedPrefixes:
          description: "List of IPv6 Prefixes, possibly empty"
          items:
            $ref: '#/components/schemas/Ipv6Prefix'
          type: array
      type: object
    Ipvc:
      allOf:
      - $ref: '#/components/schemas/MefServiceConfiguration'
      - description: An IP Service is formed of an IP Virtual Connection (IPVC) that
          links together IPVC End Points at External Interfaces (EIs). Reference MEF
          61.1 Section 7.4 IP Virtual Connections and IPVC End Points.
        properties:
          ipvcIdentifier:
            description: A unique string identifier for the IPVC. Reference MEF 61.1
              Section 10.1 IPVC Identifier Service Attribute.
            maxLength: 53
            type: string
          ipvcTopology:
            $ref: '#/components/schemas/ServiceTopology'
          packetDelivery:
            $ref: '#/components/schemas/PacketDelivery'
          maximumNumberOfIpv4Routes:
            description: Maximum number of IPv4 routes supported by the service as
              a whole. Absence of this attribute corresponds to a value of “Unlimited”.
              Reference MEF 61.1 Section 10.5 IPVC Maximum Number of IPv4 Routes Service
              Attribute.
            type: integer
          maximumNumberOfIpv6Routes:
            description: Maximum number of IPv6 routes supported by the service as
              a whole. Absence of this attribute corresponds to a value of “Unlimited”.
              Reference MEF 61.1 Section 10.6 IPVC Maximum Number of IPv6 Routes Service
              Attribute.
            type: integer
          dscpPreservation:
            $ref: '#/components/schemas/EnabledDisabled'
          serviceLevelSpecification:
            $ref: '#/components/schemas/IpSls'
          maximumTransferUnit:
            description: Indicates the maximum size (in octets) of an IP packet that
              can traverse the IPVC without fragmentation.  Reference MEF 61.1 Section
              10.10 IPVC MTU Service Attribute.
            type: integer
          pathMtuDiscovery:
            $ref: '#/components/schemas/EnabledDisabled'
          fragmentation:
            $ref: '#/components/schemas/EnabledDisabled'
          cloud:
            $ref: '#/components/schemas/IpvcCloud'
          reservedPrefixes:
            description: "Reference - MEF 61.1 Section 10.14. For an Internet Access\
              \ Service, IPVC Reserved Prefixes MUST be either empty, or free from\
              \ any public address prefixes. (Reference MEF 69.1 Section 9.1 [R14])"
            items:
              $ref: '#/components/schemas/Ipv4OrIpv6Prefix'
            type: array
          listOfClassOfServiceNames:
            description: The list of CoS Names supported by the IPVC. Reference MEF
              61.1 Section 10.8 IPVC List of Class of Service Names Service Attribute.
            items:
              type: string
            minItems: 1
            type: array
        required:
        - dscpPreservation
        - fragmentation
        - ipvcIdentifier
        - ipvcTopology
        - listOfClassOfServiceNames
        - maximumTransferUnit
        - packetDelivery
        - reservedPrefixes
        type: object
      x-discriminator-value: urn:mef:lso:spec:legato:ipvc:v0.0.4:all
    IpvcCloud:
      description: The IPVC Cloud Service Attribute is a set of parameters describing
        the access to the cloud service. Reference MEF 61.1 Section 10.13 IPVC Cloud
        Service Attribute.
      properties:
        cloudType:
          $ref: '#/components/schemas/CloudType'
        ingressClassOfServiceMap:
          $ref: '#/components/schemas/IngressClassOfServiceMap'
        dataLimit:
          $ref: '#/components/schemas/CloudDataLimit'
        dns:
          $ref: '#/components/schemas/CloudDns'
        networkAddressTranslation:
          $ref: '#/components/schemas/Ipv4Prefix'
        subscriberPrefixList:
          $ref: '#/components/schemas/Ipv4OrIpv6Prefix'
      type: object
    IpvcEndPointIdentifier:
      description: "IPVC End Point identifier as described in MEF 61.1 Section 11.1.\
        \ Note, it points to the value of IpvcEndPoint.identifier Service Attribute."
      maxLength: 53
      type: string
    IpvcEndPointRef:
      allOf:
      - $ref: '#/components/schemas/SlsReferencePoint'
      - description: A subclass of a SlsReferencePoint point to an instance of IPVC
          Endpoint.
        properties:
          ipvcEndPointIdentifier:
            $ref: '#/components/schemas/IpvcEndPointIdentifier'
        type: object
    IrUnits:
      description: "The unit of measure for the Information Rate. For example if the\
        \ Information Rate is 70KBPS this element is KBPS. Note that the values are\
        \ decimal values. 1 KBPS is 1000 bits per second and 1MBPS is 1,000,000 bits\
        \ per second."
      enum:
      - BPS
      - KBPS
      - MBPS
      - GBPS
      - TBPS
      - PBPS
      - EBPS
      - ZBPS
      - YBPS
      type: string
    L2Technology:
      description: Specifies the UNI Access Link Trunk used to carry IP Packets across
        the UNI along with information needed to identify IP Packets for this UNI
        Access Link. Reference MEF 61.1.1 Section 13.3 UNI Access Link L2 Technology
        Service Attribute.
      properties:
        trunkId:
          type: string
        demux:
          $ref: '#/components/schemas/Demux'
      type: object
    Location:
      allOf:
      - $ref: '#/components/schemas/SlsReferencePoint'
      - description: A subclass of a SlsReferencePoint.
        properties:
          name:
            description: Location name
            type: string
          description:
            description: Location description
            type: string
          cloudService:
            description: Attribute to indicate if associated with a cloud service.
            type: boolean
          ipvcEndpointIdentifier:
            description: Pointer to IPVC End Point.
            items:
              $ref: '#/components/schemas/IpvcEndPointRef'
            minItems: 1
            type: array
        type: object
    MeanTimeToRepair:
      description: "The Mean Time To Repair Performance Metric is the arithmetic mean\
        \ of the durations of all outages that start in a given time period, excluding\
        \ any pre-agreed maintenance."
      properties:
        name:
          type: string
        mttrObjective:
          $ref: '#/components/schemas/TimeDuration'
      type: object
    MefServiceConfiguration:
      description: MEFServiceConfiguration is used as an extension point for MEF specific
        service payload. The `@type` attribute is used as a discriminator
      discriminator:
        mapping:
          urn:mef:lso:spec:legato:ip-enni-link:v0.0.4:all: '#/components/schemas/IpEnniLink'
          urn:mef:lso:spec:legato:ipvc:v0.0.4:all: '#/components/schemas/Ipvc'
          urn:mef:lso:spec:legato:ip-uni-access-link-trunk:v0.0.4:all: '#/components/schemas/IpUniAccessLinkTrunk'
          urn:mef:lso:spec:legato:ip-uni:v0.0.4:all: '#/components/schemas/IpUni'
          urn:mef:lso:spec:legato:ip-uni-access-link:v0.0.4:all: '#/components/schemas/IpUniAccessLink'
        propertyName: '@type'
      properties:
        '@type':
          description: The value of the "$id" as defined in the JSON schema of the
            service.
          enum:
          - urn:mef:lso:spec:legato:ip-enni-link:v0.0.4:all
          - urn:mef:lso:spec:legato:ipvc:v0.0.4:all
          - urn:mef:lso:spec:legato:ip-uni-access-link-trunk:v0.0.4:all
          - urn:mef:lso:spec:legato:ip-uni:v0.0.4:all
          - urn:mef:lso:spec:legato:ip-uni-access-link:v0.0.4:all
          type: string
      required:
      - '@type'
      type: object
    Note_BusSof:
      description: Extra information about a given entity. Only useful in processes
        involving human interaction. Not applicable for an automated process.
      properties:
        author:
          description: Author of the note
          type: string
        date:
          description: Date of the note
          format: date-time
          type: string
        id:
          description: "Identifier of the note within its containing entity (may or\
            \ may not be globally unique, depending on provider implementation)"
          type: string
        source:
          $ref: '#/components/schemas/BusSofType'
        text:
          description: Text of the note
          type: string
      required:
      - author
      - date
      - id
      - source
      - text
      type: object
    OneWayInterPacketDelayVariation:
      description: "The One-way Inter-Packet Delay Variation Performance Metric is\
        \ the maximum, over all the ordered pairs of SLS-RPs in a given set S, of\
        \ the vth percentile of differences between the one-way packet delays of Qualified\
        \ Packets that arrive at time separated by a given interval tau, for a given\
        \ ordered pair of SLS-RPs, a given CoS Name, and a given time period Tk. Reference\
        \ MEF 61.1 Section 10.9.6 One-way Inter-Packet Delay Variation Performance\
        \ Metric."
      properties:
        slsRpPair:
          description: "Set of ordered SLS-RP pairs. Reference MEF 61.1 Section 10.9.5\
            \ One-way Mean Packet Delay Performance Metric, Table-5."
          items:
            $ref: '#/components/schemas/SlsRpPair'
          minItems: 1
          type: array
        cosName:
          description: "One of the values in the IPVC List of Class of Service Names\
            \ Service Attribute. Reference MEF 61.1 Section 10.9.6 One-way Inter-Packet\
            \ Delay Variation Performance Metric, Table-6."
          type: string
        packetArrivalTimeDifference:
          description: "Difference in the time of arrival of packets. Reference MEF\
            \ 61.1 Section 10.9.6 One-way Inter-Packet Delay Variation Performance\
            \ Metric, Table 6."
          type: number
        interPacketDelayVariationPercentile:
          $ref: '#/components/schemas/Percentage'
        interPacketDelayVariationObjective:
          description: "Inter-Packet Delay Variation Objective. Reference MEF 61.1\
            \ Section 10.9.6 One-way Inter-Packet Delay Variation Performance Metric,\
            \ Table 6."
          type: number
      type: object
    OneWayMeanPacketDelay:
      description: "The One-way Mean Packet Delay Performance Metric is the maximum,\
        \ over all the ordered pairs of SLS-RPs in a given set S, of the arithmetic\
        \ mean of one-way packet delay for Qualified Packets for a given ordered pair\
        \ of SLS-RPs, a given CoS Name, and a  given time period Tk. Reference MEF\
        \ 61.1 Section 10.9.5 One-way Mean Packet Delay Performance Metric."
      properties:
        slsRpPair:
          description: "Set of ordered SLS-RP pairs. Reference MEF 61.1 Section 10.9.5\
            \ One-way Mean Packet Delay Performance Metric, Table-5."
          items:
            $ref: '#/components/schemas/SlsRpPair'
          minItems: 1
          type: array
        meanPacketDelayObjective:
          description: "Mean Packet Delay Objective. Reference MEF 61.1 Section 10.9.5\
            \ One-way Mean Packet Delay Performance Metric, Table-5."
          type: number
        cosName:
          description: "One of the values in the IPVC List of Class of Service Names\
            \ Service Attribute. Reference MEF 61.1 Section 10.9.5 One-way Mean Packet\
            \ Delay Performance Metric, Table-5."
          type: string
      type: object
    OneWayPacketDelayLossRatio:
      description: "The One-way Packet Loss Ratio Performance Metric is the maximum,\
        \ over the ordered pairs of SLS-RPs in a given set S, of the ratio of lost\
        \ packets to transmitted packets for a given ordered pair of SLS-RPs, a given\
        \ CoS Name and a given time period Tk. Reference MEF 61.1 Section 10.9.8 One-way\
        \ Packet Loss Ratio Performance Metric."
      properties:
        slsRpPair:
          description: "Set of ordered SLS-RP pairs. Reference MEF 61.1 Section 10.9.5\
            \ One-way Mean Packet Delay Performance Metric, Table-5."
          items:
            $ref: '#/components/schemas/SlsRpPair'
          minItems: 1
          type: array
        packetLossRatioObjective:
          $ref: '#/components/schemas/Percentage'
        cosName:
          description: "One of the values in the IPVC List of Class of Service Names\
            \ Service Attribute. Reference MEF 61.1 Section 10.9.8 One-way Packet\
            \ Loss Ratio Performance Metric, Table-8."
          type: string
      type: object
    OneWayPacketDelayPercentile:
      description: "The One-way Packet Delay Percentile Performance Metric is the\
        \ maximum, over all the order pairs of SLS-RPs in a given set S, of the pth\
        \ percentile of one-way packet delay for Qualified Packets for a given order\
        \ pair of SLS-RPs, a given CoS Name and a given time period Tk. Reference\
        \ MEF 61.1 Section 10.9.4 One-way Packet Delay Percentile Performance Metric."
      properties:
        slsRpPair:
          description: "Set of ordered SLS-RP pairs. Reference MEF 61.1 Section 10.9.5\
            \ One-way Mean Packet Delay Performance Metric, Table-5."
          items:
            $ref: '#/components/schemas/SlsRpPair'
          minItems: 1
          type: array
        cosName:
          description: "One of the values in the IPVC List of Class of Service Names\
            \ Service Attribute. Reference MEF 61.1 Section 10.9.4 One-way Packet\
            \ Delay Percentile Performance Metric, Table-4."
          type: string
        packetDelayRangePercentile:
          $ref: '#/components/schemas/Percentage'
        packetDelayRangeObjective:
          description: "Packet Delay Objective. Reference MEF 61.1 Section 10.9.4\
            \ One-way Packet Delay Percentile Performance Metric, Table-4."
          type: number
      type: object
    OneWayPacketDelayRange:
      description: "The One-way Packet Delay Range Performance Metric is the maximum,\
        \ over all the ordered pairs of SLS-RPs in a given set S, of the difference\
        \ between the rth percentile of one-way packet delay and the minimum one-way\
        \ packet delay, for Qualified Packets for a given ordered pair of SLS-RPs,\
        \ a given CoS Name, and a given time period Tk. Reference MEF 61.1 Section\
        \ 10.9.7 One-way Packet Delay Range Performance Metric."
      properties:
        slsRpPair:
          description: "Set of ordered SLS-RP pairs. Reference MEF 61.1 Section 10.9.5\
            \ One-way Mean Packet Delay Performance Metric, Table-5."
          items:
            $ref: '#/components/schemas/SlsRpPair'
          minItems: 1
          type: array
        packetDelayRangePercentile:
          $ref: '#/components/schemas/Percentage'
        packetDelayRangeObjective:
          description: "Packet Delay Range Objective. Reference MEF 61.1 Section 10.9.7\
            \ One-way Packet Delay Range Performance Metric, Table 7."
          type: number
        cosName:
          description: "One of the values in the IPVC List of Class of Service Names\
            \ Service Attribute. Reference MEF 61.1 Section 10.9.7 One-way Mean Packet\
            \ Delay Performance Metric, Table-7."
          type: string
      type: object
    OrderCoordinatedAction:
      description: The interval after the completion of one or more related Order
        that this Order can be started or completed
      properties:
        coordinatedActionDelay:
          $ref: '#/components/schemas/Duration'
        coordinationDependency:
          $ref: '#/components/schemas/OrderItemCoordinationDependencyType'
        orderId:
          description: Specifies Order that is to be coordinated with this Order.
          type: string
      required:
      - coordinatedActionDelay
      - coordinationDependency
      - orderId
      type: object
    OrderItemCoordinatedAction:
      description: The interval after the completion of one or more related Order
        Items that this Order Item can be started or completed
      properties:
        coordinatedActionDelay:
          $ref: '#/components/schemas/Duration'
        coordinationDependency:
          $ref: '#/components/schemas/OrderItemCoordinationDependencyType'
        itemId:
          description: Specifies Order Item that is to be coordinated with this Order
            Item.
          type: string
      required:
      - coordinatedActionDelay
      - coordinationDependency
      - itemId
      type: object
    OrderItemCoordinationDependencyType:
      description: |
        Possible values of the Order Item Coordination Dependency

        | OrderItemCoordinationDependencyType | Description                                                                                        |
        |-------------------------------------|----------------------------------------------------------------------------------------------------|
        | startToStart                        | Work on the Specified Order Item can only be started after the Coordinated Order Items are started |
        | startToFinish                       | The Coordinated Order Items must complete before work on the Specified Order Item begins           |
        | finishToStart                       | Work on the Related Order Items begins after the completion of the Specified Order Item            |
        | finishToFinish                      | Work on the Related Order Items completes at the same time as the Specified Order Item             |
      enum:
      - startToStart
      - startToFinish
      - finishToStart
      - finishToFinish
      type: string
    Ospf:
      description: "When an entry in the UNI Routing Protocols is for OSPF, OSPF as\
        \ specified in RFC 2328 (for IPv4) and/or RFC 5340 (for IPv6) is used across\
        \ each UNI Access Link to exchange routing information. Reference MEF 61.1\
        \ Section 12.7.2 OSPF."
      properties:
        administrativeDistance:
          description: Administrative distance (integer greater than 0)
          type: integer
        areaId:
          type: string
        areaType:
          $ref: '#/components/schemas/OspfAreaType'
        authenticationType:
          $ref: '#/components/schemas/OspfAuthenticationType'
        deadInterval:
          description: "Dead interval (0-429496295, in seconds)"
          type: integer
        helloInterval:
          description: "Hello interval (0-65535, in seconds)"
          type: integer
        ipPrefixes:
          $ref: '#/components/schemas/Ipv4OrIpv6Prefix'
        retransmissionInterval:
          description: "Retransmit interval (integer greater than 0, in seconds)"
          type: integer
      type: object
    OspfAreaType:
      description: OSPF Area Type enumeration.
      enum:
      - NORMAL
      - STUB
      - NSSA
      type: string
    OspfAuthenticationType:
      description: OSPF Authentication Type enumeration.
      enum:
      - NONE
      - PASSWORD
      - MESSAGE_DIGEST
      type: string
    PacketDelivery:
      description: "For each Ingress IP Data Packet that is mapped to one of the IPVC\
        \ EPs for\nthe IPVC it takes one of two values. STANDARD_ROUTING or\nPOLICY-BASED_ROUTING\n\
        STANDARD_ROUTING: If the IPVC Packet Delivery is Standard Routing,\nthe egress\
        \ UNI and UNI Ac-cess Link or egress ENNI and ENNI Link are\ngenerally selected\
        \ by examining the destination IP address in the packet\nand matching it to\
        \ an IP Prefix reachable via the IPVC EP at the egress \nEI - in other words,\
        \ by normal IP routing.\nPOLICY_BASED_ROUTING: The behavior and requirements\
        \ when the\nIPVC Packet Delivery Service Attribute is set to Policy-Based\
        \ Routing\nare deferred to a future revision of this specification (MEF 61.1)\n"
      enum:
      - STANDARD_ROUTING
      - POLICY_BASED_ROUTING
      type: string
    PeeringAddress:
      description: "Peering Addresses. Connection Addresses, or Loopbacks plus a list\
        \ of pairs of IP addresses. Reference - MEF 61.1 Section 12.7.3."
      properties:
        peeringAddressType:
          $ref: '#/components/schemas/PeeringAddressType'
          description: |
            If the Peering Addresses parameter is CONNECTION_ADDRESSES, a separate
            BGP peering session is established over each UNI Access Link, using
            the primary IPv4 addresses in the UNI Access Link IPv4 Connection
            Addressing Service Attribute (section 13.4) or the first IPv6
            addresses in the UNI Access Link IPv6 Connection Addressing Service
            Attribute (section 13.5), as indicated by the Connection Address
            Family parameter.
            If the Peering Addresses parameter is LOOPBACKS, a list of pairs of IP
            addresses is additionally specified, each pair containing the
            Subscriber's loopback address and the SP's or Operator's loopback
            address. A single BGP peering session is established for each pair of
            addresses.
        subscriberAndSpLoopbackAddresses:
          description: "A list of pairs of IP addresses, each pair containing the\
            \ Subscriber's loopback address and the SP's or Operator's loopback address.\
            \ A single BGP peering session is established for each pair of addresses."
          items:
            $ref: '#/components/schemas/SubscriberAndSpLoopbackAddresses'
          type: array
      type: object
    PeeringAddressType:
      description: |
        If the Peering Addresses parameter is CONNECTION_ADDRESSES, a separate BGP peering session is established over each UNI Access Link, using the primary IPv4 addresses in the UNI Access Link IPv4 Connection Addressing Service Attribute (section 13.4) or the first IPv6 addresses in the UNI Access Link IPv6 Connection Addressing Service Attribute (section 13.5), as indicated by the Connection Address Family parameter. If the Peering Addresses parameter is LOOPBACKS, a list of pairs of IP addresses is additionally specified, each pair containing the Subscriber's loopback address and the SP's or Operator's loopback address. A single BGP peering session is established for each pair of addresses.
      enum:
      - CONNECTION_ADDRESSES
      - LOOPBACKS
      type: string
    Percentage:
      description: This is a number of percent - a floating point number between 0
        and 100.
      maximum: 100
      minimum: 0
      type: number
    RelatedContactInformation:
      description: |
        Contact information of an individual or organization playing a role for
        this Order Item. The rule for mapping a represented attribute value to a
        `role` is to use the _lowerCamelCase_ pattern
      properties:
        emailAddress:
          description: Email address
          type: string
        name:
          description: Name of the contact
          type: string
        number:
          description: Phone number
          type: string
        numberExtension:
          description: Phone number extension
          type: string
        organization:
          description: The organization or company that the contact belongs to
          type: string
        postalAddress:
          $ref: '#/components/schemas/FieldedAddressValue'
        role:
          description: A role the party plays in a given context.
          type: string
      required:
      - emailAddress
      - name
      - number
      - role
      type: object
    RelatedPlaceRefOrValue:
      description: A Place provided either by value or by reference
      discriminator:
        mapping:
          FieldedAddress: '#/components/schemas/FieldedAddress'
          FormattedAddress: '#/components/schemas/FormattedAddress'
          GeographicAddressLabel: '#/components/schemas/GeographicAddressLabel'
          GeographicAddressRef: '#/components/schemas/GeographicAddressRef'
          GeographicSiteRef: '#/components/schemas/GeographicSiteRef'
          GeographicPoint: '#/components/schemas/GeographicPoint'
        propertyName: '@type'
      properties:
        '@type':
          description: |
            This field is used as a discriminator and is used between different place representations. This type might discriminate for additional related place as defined in '@schemaLocation'.
          enum:
          - FieldedAddress
          - FormattedAddress
          - GeographicAddressLabel
          - GeographicAddressRef
          - GeographicSiteRef
          - GeographicPoint
          type: string
        '@schemaLocation':
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships. May be used to define additional related place types.
          format: uri
          type: string
        role:
          description: Role of this place
          type: string
      required:
      - '@type'
      - role
      type: object
    RoutingProtocols:
      description: "Data type to support routing protocols and associated parameters\
        \ that are used to exchange IP routes across the UNI. The value is a list\
        \ of protocols (possibly empty), where each entry consists of the protocol\
        \ name (one of Static, OSPF or BGP) the type of routes that will be exchanged\
        \ (one of IPv4 or IPv6 or Both) and set of additional parameters as specified.\
        \  Reference MEF 61.1 Section 12.7 UNI Routing Protocols Service Attributes."
      properties:
        bgp:
          description: Reference to BGP routing
          items:
            $ref: '#/components/schemas/Bgp'
          minItems: 1
          type: array
        ospf:
          description: Reference to OSPF routing.
          items:
            $ref: '#/components/schemas/Ospf'
          minItems: 1
          type: array
        static:
          description: Reference to Static routing
          items:
            $ref: '#/components/schemas/Static'
          type: array
      type: object
    ServiceActionType:
      description: |
        Action to be applied to the Service referred by this Service Order
        Item
      enum:
      - add
      - modify
      - delete
      type: string
    ServiceOrder:
      allOf:
      - $ref: '#/components/schemas/ServiceOrder_Common'
      - properties:
          href:
            description: Hyperlink reference
            format: uri
            type: string
          id:
            description: unique identifier
            type: string
          completionDate:
            description: Effective delivery date amended by the provider
            format: date-time
            type: string
          expectedCompletionDate:
            description: Expected delivery date amended by the provider
            format: date-time
            type: string
          serviceOrderItem:
            description: A list of service order items to be processed by this order
            items:
              $ref: '#/components/schemas/ServiceOrderItem'
            minItems: 1
            type: array
          startDate:
            description: Date when the order was started for processing
            format: date-time
            type: string
          state:
            $ref: '#/components/schemas/ServiceOrderStateType'
          orderDate:
            description: Date when the Service Order was created in the SOF's system
              and a Service Order Identifier was assigned
            format: date-time
            type: string
        required:
        - id
        - orderDate
        - serviceOrderItem
        - state
        type: object
      description: "A Service Order is used to request operations on a Service instance.\
        \ A Service Order groups one or more one Service Order Items - one per specific\
        \ action on a Service instance. The Action associated with the Service Order\
        \ Item describes the operation (add, modify, delete) to be applied on the\
        \ specified Service instance.The Service Order Item and its associated Action\
        \ can operate on both existing (modify, delete) as well as future (add) Service\
        \ instance.The Service Order is triggered from the Business Application (BA)\
        \ system in charge of the Service Order management to the Service Orchestration\
        \ Function (SOF) system that will orchestrate the Service fulfillment."
    ServiceOrderItem:
      allOf:
      - $ref: '#/components/schemas/ServiceOrderItem_Common'
      - description: |
          An identified part of the order. A service order is decomposed into
          one or more order items.
          The modelling pattern introduces the `Common` supertype to
          aggregate attributes that are common to both `ServiceOrderItem` and
          `ServiceOrderItem_Create`. The `Create` type has a subset of
          attributes of the response type and does not introduce any new,
          thus the `Create` type has an empty definition
        properties:
          state:
            $ref: '#/components/schemas/ServiceOrderStateType'
          terminationError:
            description: "When the SOF cannot process the request, the SOF returns\
              \ a text-based list of reasons here."
            items:
              $ref: '#/components/schemas/TerminationError'
            type: array
        required:
        - state
        type: object
    ServiceOrderItemRef:
      description: "A reference to a Service Order Item. When referencing item from\
        \ within the same Service Order, the `serviceOrderId` and `serviceOrderHref`\
        \ MUST be empty."
      properties:
        itemId:
          description: Identifier of referenced item within the referenced Service
            Order
          type: string
        serviceOrderHref:
          description: Link to the order to which the referenced item belongs to
          type: string
        serviceOrderId:
          description: Identifier of the order to which the referenced item belongs
            to
          type: string
      required:
      - itemId
      type: object
    ServiceOrderItemRelationship:
      description: |
        Specifies the type (nature) of the relationship to the related
        Service. The nature of required relationships varies for Services of
        different types. For example, a UNI or ENNI Service may not have any
        relationships, but an E-Line may have two mandatory
        relationships (related to the UNI on one end and the ENNI on the
        other). More complex Services such as multipoint IP or Firewall
        Services may have more complex relationships. As a result, the
        allowed and mandatory `relationshipType` values are defined in the
        Service Specification.
        Related item can be both from within the same Service Order or from
        other one. When referencing item from within the same Service Order,
        the `orderItem.serviceOrderId` and `orderItem.serviceOrderHref` MUST
        be empty.
      properties:
        orderItem:
          $ref: '#/components/schemas/ServiceOrderItemRef'
        relationshipType:
          description: Specifies the nature of the relationship to the related Service
            Order Item. A string that is one of the relationship types specified in
            the Service Specification.
          type: string
      required:
      - orderItem
      - relationshipType
      type: object
    ServiceOrderItem_Common:
      description: An identified part of the order. A service order is decomposed
        into one or more order items. This type holds the attributes common to request
        and response representation of the Service Order Item.
      properties:
        id:
          description: "Identifier of the order item (generally it is a sequence number\
            \ 01, 02, 03, ...)"
          type: string
        action:
          $ref: '#/components/schemas/ServiceActionType'
        coordinatedAction:
          description: The interval after the completion of one or more related Service
            Order Items that this Service Order Item can be started or completed
          items:
            $ref: '#/components/schemas/OrderItemCoordinatedAction'
          type: array
        note:
          description: Extra-information about the order item; e.g. useful to add
            extra delivery information that could be useful for a human process
          items:
            $ref: '#/components/schemas/Note_BusSof'
          type: array
        service:
          $ref: '#/components/schemas/ServiceValue'
        serviceOrderItemRelationship:
          description: |
            Specifies the type (nature) of the relationship to the related
            Service. The nature of required relationships varies for Services of
            different types. For example, a UNI or ENNI Service may not have any
            relationships, but an E-Line may have two mandatory
            relationships (related to the UNI on one end and the ENNI on the
            other). More complex Services such as multipoint IP or Firewall
            Services may have more complex relationships. As a result, the
            allowed and mandatory `relationshipType` values are defined in the
            Service Specification.
            Related items can be both from within the same Service Order or from
            other one. When referencing item within the same Service Order,
          items:
            $ref: '#/components/schemas/ServiceOrderItemRelationship'
          type: array
      required:
      - action
      - id
      - service
      type: object
    ServiceOrderItem_Create:
      allOf:
      - $ref: '#/components/schemas/ServiceOrderItem_Common'
      - description: |
          An identified part of the order. A service order is decomposed into one or more order items. This type is used in the request.
        type: object
    ServiceOrderRef:
      description: Reference to a Service Order instance.
      properties:
        href:
          description: A hyperlink to the related order
          type: string
        id:
          description: The id of the related order
          type: string
      required:
      - id
    ServiceOrderRelationship:
      description: Reference to a related Service Order and the type of that association.
      properties:
        serviceOrder:
          $ref: '#/components/schemas/ServiceOrderRef'
        relationshipType:
          description: "Specifies the type (nature) of the relationship to the related\
            \ Service. The nature of required relationships varies for Services of\
            \ different types. For example, a UNI or ENNI Service may not have any\
            \ relationships, but an Access E-Line may have two mandatory relationships\
            \ (related to the UNI on one end and the ENNI on the other). More complex\
            \ Services such as multipoint IP or Firewall Services may have more complex\
            \ relationships. As a result, the allowed and mandatory `relationshipType`\
            \ values are defined in the Service Specification."
          type: string
      required:
      - relationshipType
      - serviceOrder
      type: object
    ServiceOrderStateType:
      description: |
        Possible values for the state of a Service Order

        | State        | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           |
        | ------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | acknowledged | A `ServiceOrder` request has been received and has passed message and basic validations and a _Success Response_ has been sent.                                                                                                                                                                                                                                                                                                                                                                                                                       |
        | rejected     | This state indicates that: <br>- Invalid information is provided through the `ServiceOrder` / `ServiceOrderItem` request <br>- The request fails to meet validation rules for `Service` delivery (processing) <br>If one `ServiceOrderItem` is rejected, then the entire `ServiceOrder` request is rejected and a _Error Response_ is sent.                                                                                                                                                                                                           |
        | inProgress   | This state indicates that all `ServiceOrderItems` have successfully passed the validations checks and the scheduled `Service` delivery/processing has started. <br> The `ServiceOrder` will be in _`inProgress`_ state if _at least one_ `ServiceOrderItem` is in _`inProgress`_ state                                                                                                                                                                                                                                                                |
        | pending      | This state indicates that a `ServiceOrderItem` is currently in a waiting stage for an action/activity to be completed before the order-processing can progress further, pending order amend or cancel assessment. <br> A _`pending`_ state can lead into auto cancellation of an `ServiceOrderItem`, if no action is taken within the agreed timeframe.<br>The `ServiceOrder` will be in _`pending`_ state if _at least one_ `ServiceOrderItem` is in _`pending`_ state                                                                               |
        | held         | This state indicates that a `ServiceOrderItem` cannot be progressed due to an issue. The `Service` delivery (processing) has been temporarily delayed to resolve an infrastructure shortfall to facilitate supply of order. Upon resolution of the issue, the `ServiceOrderItem` will continue to progress.<br> A _`held`_ state can lead into auto cancellation of an `ServiceOrderItem`, if no action is taken within the agreed timeframe.<br>The `ServiceOrder` will be in _`held`_ state if at least one `ServiceOrderItem` is in _`held`_ state |
        | failed       | This state indicates that `Service` delivery (processing) associated with a `ServiceOrderItem` has failed. This indicates an irrecoverable error as opposed to _`held`_ or _`pending`_ issues.<br>The `ServiceOrder` will be in _`failed`_ state if at _ALL_ `ServiceOrderItems` are in _`failed`_ state                                                                                                                                                                                                                                              |
        | completed    | This state indicates that `Service` delivery (processing) associated with a `ServiceOrderItem` has completed. <br>The `ServiceOrder` will be in _`completed`_ state if at _ALL_ `ServiceOrderItems` are in _`completed`_ state                                                                                                                                                                                                                                                                                                                        |
        | partial      | This state indicates that some `ServiceOrderItem` are in _`completed`_ state while others are in _`cancelled`_ and/or _`failed`_ states, so the entire `ServiceOrder` is in a _`partial`_ state.                                                                                                                                                                                                                                                                                                                                                      |
      enum:
      - acknowledged
      - rejected
      - pending
      - held
      - inProgress
      - completed
      - failed
      - partial
      type: string
    ServiceOrder_Common:
      description: |
        A Service Order is used to request operations on a Service instance. A
        Service Order groups one or more one Service Order Items - one per
        specific action on a Service instance. The Action associated with the
        Service Order Item describes the operation (add, modify, delete) to be
        applied on the specified Service instance.The Service Order Item and its
        associated Action can operate on both existing (modify, delete) as well
        as future (add) Service instance.The Service Order is triggered from the
        Business Application (BA) system in charge of the Service Order
        management to the Service Orchestration Function (SOF) system that will
        orchestrate the Service fulfillment.

        This type defines all attributes common to objects used in request and
        response.
      properties:
        coordinatedAction:
          description: The interval after the completion of one or more related Service
            Order Items that this Service Order Item can be started or completed
          items:
            $ref: '#/components/schemas/OrderCoordinatedAction'
          type: array
        description:
          description: A free-text description of the service order
          type: string
        externalId:
          description: ID given by the consumer to facilitate searches
          type: string
        note:
          description: Extra-information about the order; e.g. useful to add extra
            delivery information that could be useful for a human process
          items:
            $ref: '#/components/schemas/Note_BusSof'
          type: array
        orderRelationship:
          description: "A list of service orders related to this order (e.g. prerequisite,\
            \ dependent on)"
          items:
            $ref: '#/components/schemas/ServiceOrderRelationship'
          type: array
        relatedContactInformation:
          description: |-
            Contact information of an individual or organization playing a role for this Service Order.
            For providing Notification Contact, `role=notificationContact` MUST be used.
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          type: array
        requestedCompletionDate:
          description: Requested delivery date from the requestors perspective
          format: date-time
          type: string
        requestedStartDate:
          description: Order start date wished by the requestor
          format: date-time
          type: string
      required:
      - requestedCompletionDate
      - requestedStartDate
      type: object
    ServiceOrder_Create:
      allOf:
      - $ref: '#/components/schemas/ServiceOrder_Common'
      - properties:
          serviceOrderItem:
            description: A list of service order items to be processed by this order
            items:
              $ref: '#/components/schemas/ServiceOrderItem_Create'
            minItems: 1
            type: array
        required:
        - serviceOrderItem
      description: |-
        A Service Order is used to request operations on a Service instance. A Service Order groups one or more one Service Order Items - one per specific action on a Service instance. The Action associated with the Service Order Item describes the operation (add, modify, delete) to be applied on the specified Service instance.The Service Order Item and its associated Action can operate on both existing (modify, delete) as well as future (add) Service instance.The Service Order is triggered from the Business Application (BA) system in charge of the Service Order management to the Service Orchestration Function (SOF) system that will orchestrate the Service fulfillment.
        This type extends `ServiceOrder_Common` and adds attributes specific to the request response.
    ServiceRef:
      description: Reference to a Service instance.
      properties:
        href:
          description: Hyperlink reference to Service
          type: string
        id:
          description: unique identifier of Service
          type: string
      required:
      - id
      type: object
    ServiceRelationship:
      description: A relationship to an existing Service. The requirements for usage
        for given Service are described in the Service Specification.
      properties:
        relationshipType:
          description: |
            Specifies the type (nature) of the relationship to the related
            Service. The nature of required relationships varies for Services of
            different types. For example, a UNI or ENNI Service may not have any
            relationships, but an Access E-Line may have two mandatory
            relationships (related to the UNI on one end and the ENNI on the
            other). More complex Services such as multipoint IP or Firewall
            Services may have more complex relationships. As a result, the
            allowed and mandatory `relationshipType` values are defined in the
            Service Specification.
          type: string
        service:
          $ref: '#/components/schemas/ServiceRef'
      required:
      - relationshipType
      - service
      type: object
    ServiceStateType:
      description: |
        Valid values for the lifecycle state of the Service.

        | State              | Description                                                                                                           |
        | ------------------ | --------------------------------------------------------------------------------------------------------------------- |
        | feasibilityChecked | Initial check whether the necessary resources are available and sufficient for the installation of a given service.   |
        | designed           | The Service is designed. The resources are identified and/or allocated, but not reserved.                             |
        | reserved           | All required resources for given service are reserved and ready.                                                      |
        | inactive           | The service is deactivated and is no longer available.                                                                |
        | active             | The service is fully available and active                                                                             |
        | terminated         | The service is 'logically deleted'. All associated resources are freed and made available for service to other users. |
      enum:
      - feasibilityChecked
      - designed
      - reserved
      - inactive
      - active
      - terminated
      type: string
    ServiceTopology:
      description: Enumeration used to represent the different Service Topologies.
      enum:
      - MULTIPOINT
      - ROUTED_MULTIPOINT
      - CLOUD_ACCESS
      type: string
    ServiceUptime:
      description: "The Service Uptime Performance Metric is the proportion of time,\
        \ during a given time period Tk, that the service is working from the perspective\
        \ of the Subscriber (for a Subscriber IP Service) or the  perspective of the\
        \ SP/SO (for an Operator IP Service), excluding any pre-agreed exceptions,\
        \ for  example maintenance intervals. Reference MEF 61.1[1] Section 10.9 Service\
        \ Uptime Performance Metric.."
      properties:
        serviceUptimeObjective:
          $ref: '#/components/schemas/Percentage'
          description: "Service Uptime Objective. Reference MEF 61.1 Section 10.9.9\
            \ Service Uptime Performance Metric, Table 9."
      type: object
    ServiceValue:
      description: ServiceValue is a base class for defining the Service.
      properties:
        href:
          description: Hyperlink reference to a Service
          type: string
        id:
          description: unique identifier of a Service
          type: string
        description:
          description: Free-text description of the service
          type: string
        externalId:
          description: ID given by the consumer to facilitate searches
          type: string
        startDate:
          description: Date when the service starts
          format: date-time
          type: string
        endDate:
          description: Date when the service ends
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/ServiceStateType'
        note:
          description: A list of notes made on this service
          items:
            $ref: '#/components/schemas/Note_BusSof'
          type: array
        serviceType:
          description: Business type of the service
          type: string
        name:
          description: Name of the service
          type: string
        serviceRelationship:
          description: "Specifies the type (nature) of the relationship to the related\
            \ Service. The nature of required relationships varies for Services of\
            \ different types. For example, a UNI or ENNI Service may not have any\
            \ relationships, but an Access E-Line may have two mandatory relationships\
            \ (related to the UNI on one end and the ENNI on the other). More complex\
            \ Services such as multipoint IP or Firewall Services may have more complex\
            \ relationships. As a result, the allowed and mandatory `relationshipType`\
            \ values are defined in the Service Specification."
          items:
            $ref: '#/components/schemas/ServiceRelationship'
          type: array
        relatedContactInformation:
          description: Contact information of an individual or organization playing
            a role for this Service
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          type: array
        place:
          description: The relationships between this Service Order Item and one or
            more Places as defined in the Service Specification.
          items:
            $ref: '#/components/schemas/RelatedPlaceRefOrValue'
          type: array
        serviceConfiguration:
          $ref: '#/components/schemas/MefServiceConfiguration'
      type: object
    SlsReferencePoint:
      description: SlsReferencePoint is an abstract data type that can be subclassed
        to IpvcEndPoint and Location. Reference MEF 61.1 Section 10.9.1 SLS Reference
        Points.
      type: object
    SlsRpPair:
      description: "Service Level Specification Reference Point Pair. In a multipoint\
        \ or rooted multipoint IPVC, performance objectives are ideally specified\
        \ as applying between pairs of IPVC EPs - in other words, they apply to the\
        \ performance that IP Data Packets experience as they flow from one EI to\
        \ another. The SlsRpPair is a representation of this association. Reference\
        \ MEF 61.1 Section 10.9.1"
      properties:
        fromSlsReferencePoint:
          $ref: '#/components/schemas/SlsReferencePoint'
          description: Pointer to the "from" SLS Reference Point.
        toSlsReferencePoint:
          $ref: '#/components/schemas/SlsReferencePoint'
          description: Pointer to the "to" SLS Reference Point.
      required:
      - fromSlsReferencePoint
      - toSlsReferencePoint
      type: object
    Static:
      description: "When an entry in the UNI Routing Protocols list is for Static,\
        \ the IP Prefixes used in the Subscriber Network that are reachable via this\
        \ UNI are specified as additional parameters in the entry. These are known\
        \ as Static IP Prefixes. Reference MEF 61.1 Section 12.7.1 Static."
      properties:
        staticIpEntry:
          description: Static IP address entry.
          items:
            $ref: '#/components/schemas/StaticIpEntry'
          minItems: 1
          type: array
      type: object
    StaticIpEntry:
      description: "StaticIpEntry data type including IPv4/IPv6 prefixes, forwarding\
        \ information and administrative distance."
      properties:
        administrativeDistance:
          description: "Administrative distance, an integer > 0."
          type: integer
        forwardingInformation:
          $ref: '#/components/schemas/ForwardingInformation'
        staticPrefix:
          $ref: '#/components/schemas/Ipv4OrIpv6Prefix'
      type: object
    SubscriberAndSpLoopbackAddresses:
      description: "A list of pairs of IP addresses, each pair containing the Subscriber's\
        \ loopback address and the SP's or Operator's loopback address. A single BGP\
        \ peering session is established for each pair of addresses."
      properties:
        subscriberLoopbackAddress:
          $ref: '#/components/schemas/Ipv4OrIpv6Address'
          description: Subscriber's loopback Address for BGP establishing a session
        spLoopbackAddress:
          $ref: '#/components/schemas/Ipv4OrIpv6Address'
          description: Service Provider's loopback Address for BGP establishing a
            session
      type: object
    TerminationError:
      description: This indicates an error that caused an Item to be terminated. The
        code and propertyPath should be used like in Error422.
      properties:
        code:
          $ref: '#/components/schemas/Error422Code'
        propertyPath:
          description: |
            A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.
            Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).
          type: string
        value:
          description: Text to describe the reason of the termination.
          type: string
      type: object
    TimeDuration:
      description: "This class is used to describe durations expressed as a 2-tuple,\
        \ (value, units). The units from from nanoseconds to years."
      properties:
        timeDurationValue:
          description: "The value of the duration. For example, if the duration is\
            \ 20 ms, this element is 20."
          type: integer
        timeDurationUnits:
          $ref: '#/components/schemas/TimeDurationUnits'
          description: "The unit of measure in the duration. For example, if an interval\
            \ is 2ms, this element is MS."
      type: object
    TimeDurationUnits:
      description: |-
        The unit of measure in the duration. For example, if an interval is 2ms, this element is MS.
          type: string
      enum:
      - NS
      - US
      - MS
      - SEC
      - MIN
      - HOUR
      - DAY
      - WEEK
      - MONTH
      - YEAR
      type: string
    TimeUnit:
      description: |
        Represents a unit of time.
      enum:
      - calendarMonths
      - calendarDays
      - calendarHours
      - calendarMinutes
      - businessDays
      - businessHours
      - businessMinutes
      type: string
    TwoOctetInteger:
      description: A two octet integer. Value range 0 - 65535
      maximum: 65535
      minimum: 0
      type: integer
    UniAccessLinkTrunkType:
      description: Enumeration representing the UNI Access Link Trunk Type Service
        Attribute.
      enum:
      - ETHERNET
      - OTHER
      type: string
    UniIpv4ConnectionAddressing:
      description: "UniIpv4ConnectionAddressing is a data type representing how IPv4\
        \ addresses are allocated to the devices on the UNI Access Link. Reference\
        \ - MEF 61 Section 13.4. [R22] \"At a UNI Access Link in a UNI with an IPVC\
        \ EP for an Advanced Internet Access Service, UNI Access Link IPv4 Connection\
        \ Addressing MUST be Static or null. Reference - MEF 69.1 Section 9.4."
      properties:
        ipv4AddressingType:
          $ref: '#/components/schemas/Ipv4AddressingType'
          description: IPv4 Connection Addressing.
        ipv4PrimarySubnet:
          $ref: '#/components/schemas/Ipv4PrimarySubnet'
          description: Primary IPv4 Subnet. Includes IPv4 Prefix and Service Provider
            IPv4 Addresses.
        ipv4SecondarySubnetList:
          description: Secondary IPv4 Subnet List. Includes IPv4 Prefix and Service
            Provider IPv4 Addresses.
          items:
            $ref: '#/components/schemas/Ipv4SecondarySubnet'
          type: array
      type: object
    UniIpv6ConnectionAddressing:
      description: "UniIpv6ConnectionAddressing is a data type representing how IPv6\
        \ addresses are allocated to the devices on the UNI Access Link. Reference\
        \ - MEF 61 Section 13.5. [R26] \"At a UNI Access Link in a UNI with an IPVC\
        \ EP for an Advanced Internet Access Service, UNI Access Link IPv6 Connection\
        \ Addressing MUST be Static or null. Reference - MEF 69.1 Section 9.4."
      properties:
        ipv6AddressingType:
          $ref: '#/components/schemas/Ipv6AddressingType'
          description: IPv6 Connection Addressing.
        subscriberIpv6Address:
          $ref: '#/components/schemas/Ipv6Address'
          description: Subscriber IPv6 address.
        ipv6Subnet:
          description: Ipv6 Subnet
          items:
            $ref: '#/components/schemas/Ipv6Subnet'
          type: array
      type: object
    UniManagementType:
      description: Enumeration representing the UNI Management Type options. Reference
        MEF 61.1 Section 12.2 UNI Management Type Service Attribute.
      enum:
      - SUBSCRIBER_MANAGEMENT
      - PROVIDER_MANAGEMENT
      type: string
    VlanId:
      description: "Data type with single attribute, vlanId which is defined as a\
        \ PositiveInteger. Value 1 to 4094."
      maximum: 4094
      minimum: 1
      type: integer
    Vrid:
      description: "VRID (Virtual Router ID) as defined in RFC 5798[29] is a number\
        \ between 1 and 255"
      maximum: 255
      minimum: 1
      type: integer
