openapi: 3.0.1
info:
  description: "**This file forms part of MEF 99** \n\nSupported use cases:\n- Create\
    \ Service Order\n- Retrieve List of Service Orders\n- Retrieve Service Order by\
    \ Service Order Identifier\n- Register for Notifications\n\nCopyright 2023 MEF\
    \ Forum and its contributors.\n\nThis file includes content based on the TM Forum\
    \ Service Order API (TMF641\nv4.1.0) available at https://github.com/tmforum-apis/TMF641_ServiceOrder,\n\
    which is licensed by the TM Forum under the Apache License version 2.0. Such\n\
    content has been modified by the MEF Forum and its contributors.\n"
  title: Legato Service Ordering Management API
  version: 5.0.0
servers:
- url: "https://{serverBase}/mefApi/legato/serviceOrderingManagement/v5/"
  variables:
    serverBase:
      default: mef.net
      description: The base of SOF's URL.
tags:
- description: Operations for Service Order Resource
  name: Service Order
- description: Endpoints to register and terminate an Event Listener
  name: Events subscription
paths:
  /serviceOrder:
    get:
      description: This operation retrieves list of ServiceOrder entities.
      operationId: listServiceOrder
      parameters:
      - description: State of the Service Order
        in: query
        name: state
        required: false
        schema:
          enum:
          - acknowledged
          - rejected
          - pending
          - held
          - inProgress
          - completed
          - failed
          - partial
          type: string
      - description: Date when the order was created greater than
        in: query
        name: orderDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the order was created lesser than
        in: query
        name: orderDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Effective completion date greater than
        in: query
        name: completionDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Effective completion date lesser than
        in: query
        name: completionDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Expected delivery date greater than
        in: query
        name: expectedCompletionDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Expected delivery date lesser than
        in: query
        name: expectedCompletionDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the order was started for processing
        in: query
        name: startDate.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: Date when the order was started for processing
        in: query
        name: startDate.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: Requested index for start of item to be provided in response
          requested by the client. Note that the index starts with "0".
        in: query
        name: offset
        required: false
        schema:
          format: int32
          type: integer
      - description: Requested number of items to be provided in response requested
          by client
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceOrder'
                type: array
          description: OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)
          headers:
            X-Pagination-Throttled:
              description: |
                Used to indicate that result page was throttled to maximum possible size  and there are additional results that can be fetched
              schema:
                type: boolean
            X-Total-Count:
              description: |
                The total number of matching items. E.g. if there are 50 matching items in total, but the request has offset=10 and limit=10, then the X-Total-Count is 50.
              schema:
                type: integer
            X-Result-Count:
              description: The number of items included in the response
              schema:
                type: integer
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: List or find ServiceOrder objects
      tags:
      - Service Order
    post:
      description: This operation creates a ServiceOrder entity.
      operationId: createServiceOrder
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ServiceOrder_Create'
        description: The ServiceOrder to be created
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
          description: Created (https://tools.ietf.org/html/rfc7231#section-6.3.2)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Creates a ServiceOrder
      tags:
      - Service Order
  /serviceOrder/{id}:
    get:
      description: This operation retrieves a ServiceOrder entity.
      operationId: retrieveServiceOrder
      parameters:
      - description: Identifier of the ServiceOrder
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
          description: OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Retrieves a ServiceOrder by ID
      tags:
      - Service Order
  /hub:
    post:
      description: "Sets the communication endpoint address the service instance must\
        \ use to deliver information about its health state, execution state, failures\
        \ and metrics."
      operationId: registerListener
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/EventSubscriptionInput'
        description: Data containing the callback endpoint to deliver the information
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Subscribed
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Register a listener
      tags:
      - Events subscription
  /hub/{id}:
    delete:
      description: "Resets the communication endpoint address the service instance\
        \ must use to deliver information about its health state, execution state,\
        \ failures and metrics."
      operationId: unregisterListener
      parameters:
      - description: The id of the registered listener
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Unregister a listener
      tags:
      - Events subscription
    get:
      description: This operation retrieves a EventSubscription entity.
      operationId: retrieveEventSubscription
      parameters:
      - description: Identifier of the EventSubscription
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Success
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      summary: Retrieves a EventSubscription by ID
      tags:
      - Events subscription
components:
  schemas:
    AccessLinkBfd:
      description: The Access Link BFD Service Attribute indicates whether Bidirectional
        Forwarding Detection (BFD) is enabled on the UNI Access Link. Reference MEF
        61.1Section 13.8 UNI Access Link BFD Service Attribute and Section 16.5 ENNI
        Link BFD Attribute.
      properties:
        connectionAddressFamily:
          $ref: '#/components/schemas/ConnectionAddressFamily'
        transmissionInterval:
          $ref: '#/components/schemas/BfdTransmissionInterval'
        detectMultiplier:
          description: BFD Detect multiple as an Integer. Reference MEF 61.1 Section
            13.8 UNI Access Link BFD Service Attribute and Section 16.5 ENNI Link
            BFD Attribute.
          type: integer
        authenticationType:
          $ref: '#/components/schemas/BfdAuthenticationType'
        activeEnd:
          $ref: '#/components/schemas/BfdActiveEnd'
      type: object
    AddressFamilyIpv4Ipv6:
      description: Specifies whether the session is established over IPv4 or IPv6.
      enum:
      - IPV4
      - IPV6
      type: string
    Addressing:
      description: "Enumeration representing the Address type for the Control Protocols\
        \ data type. SP_OPERATOR_ADDRESSES If the addressing information is SP/Operator\
        \ Addresses, then Ingress IP Packets for the specified  protocol that have\
        \ a multicast or broadcast destination address, or a unicast destination address\
        \  that is reachable within the SP's or Operator's network, are considered\
        \ to be IP Control Protocol  Packets, and Egress IP Packets for the specified\
        \ protocol that have a source address that is reachable  within the SP's or\
        \ Operator's network are considered to be IP Control Protocol Packets. ANY\
        \ - If the addressing information is Any, then all IP Packets for the specified\
        \ protocol that cross the UNI are considered to be  IP Control Protocol Packets."
      enum:
      - SP_OPERATOR_ADDRESSES
      - ANY
      type: string
    BfdActiveEnd:
      description: |
        At least one end of the BFD session must have an active role, meaning that
        it sends out asynchronous control messages regardless of whether it has
        received any. This enumeration represents the values that can be set for
        the BFD Active End. Reference MEF 61.1 Section 13.8 UNI Access Link BFD
        Service Attribute [R171] and [R172].
        - SUBSCRIBER: Subscriber takes active BFD role.
        - SP: Service Provider takes active BFD role.
        - BOTH: Subscriber and Service Provider take active BFD role.
      enum:
      - SUBSCRIBER
      - SP
      - BOTH
      type: string
    BfdAuthenticationType:
      description: "RFC 7419 specifies a set of common intervals which are used to\
        \ ensure\ninteroperability.\n- NONE: No BFD authentication.\n- SIMPLE_PASSWORD:\
        \ Simple Password Authentication is the most \nstraightforward (and weakest)\
        \ form of authentication. In this method\nof authentication one or more Passwords\
        \ (with corresponding Key IDs) \nare configured in each system and one of\
        \ these Password/ID pairs is \ncarried in each BFD Control packet. The receiving\
        \ system accepts the \npacket if the Password and Key ID matches one of the\
        \ Password/ID \npairs configured in that system. Reference IETF RFC5880 Section\
        \ 6.7.2.\n- KEYED_MD5: The Keyed MD5 and Meticulous Key MD5 Authentication\
        \ \nmechanisms are very similar to those used in other protocols. \nIn these\
        \ methods of authentication, one or more security keys \n(with corresponding\
        \ key IDs) are configured in each system. \nReference RFC5880 Section 6.7.3\
        \ Keyed MD5 and Meticulous Keyed MD5 \nAuthentication.\n- METICULOUS_KEYED_MD5:\
        \ The Keyed MD5 and Meticulous Key MD5 \nAuthentication mechanisms are very\
        \ similar to those used in other \nprotocols. In these methods of authentication,\
        \ one or more security\nkeys (with corresponding key IDs) are configured in\
        \ each system.\nReference RFC5880 Section 6.7.3 Keyed MD5 and Meticulous Keyed\
        \ MD5\nAuthentication.\n- KEYED_SHA1: The Keyed SHA1 and Meticulous Key SHA1\
        \ Authentication\nmechanisms are very similar to those used in other protocols.\
        \ In \nthese methods of authentication, one or more secret keys (with \ncorresponding\
        \ key IDs) are configured in each system. Reference\nRFC5880 Section 6.7.4\
        \ Keyed SHA1 and Meticulous Keyed SHA1 \nAuthentication.\n- METICULOUS_KEYED_SHA1:\
        \ The Keyed SHA1 and Meticulous Key \nSHA1 Authentication mechanisms are very\
        \ similar to those used in\nother protocols. In these methods of authentication,\
        \ one or more \nsecret keys (with corresponding key IDs) are configured in\
        \ each system.\nReference RFC5880 Section 6.7.4 Keyed SHA1 and Meticulous\
        \ Keyed SHA1 \nAuthentication.\n"
      enum:
      - NONE
      - SIMPLE_PASSWORD
      - KEYED_MD5
      - METICULOUS_KEYED_MD5
      - KEYED_SHA1
      - METICULOUS_KEYED_SHA1
      type: string
    BfdTransmissionInterval:
      description: "UNI Access Link BFD authentication type. When Authentication is\
        \ NOT NONE, RFC5880 Section 6.7 Authentication mechanisms are used."
      enum:
      - 3_3_MILLISECONDS
      - 10_MILLISECONDS
      - 20_MILLISECONDS
      - 50_MILLISECONDS
      - 100_MILLISECONDS
      - 1_SECOND
      type: string
    Bgp:
      description: "When an entry in the UNI Routing Protocol is for BGP, BGP as specified\
        \ in RFC 4271 is used across the UNI to exchange information. Reference -\
        \ MEF 61.1 Section 12.7.3."
      properties:
        subscriberAsNumber:
          $ref: '#/components/schemas/FourOctetInteger'
          description: BGP Subscriber Autonomous System number.
        peerAsNumber:
          $ref: '#/components/schemas/FourOctetInteger'
          description: BGP Peer Autonomous System Number.
        connectionAddressFamily:
          $ref: '#/components/schemas/AddressFamilyIpv4Ipv6'
          description: Connection Address Family (IPv4 or IPv6).
        peeringAddresses:
          $ref: '#/components/schemas/PeeringAddress'
          description: Peering Addresses.
        authentication:
          description: BGP Authentication. It is either null or if present is it a
            value of MD5 Password. It is assumed that an encrypted channel is used
            when this data is passed across the API so that the password is protected.
          nullable: true
          type: string
        bgpCommunityList:
          description: "Used to control which routers are accepted, preferred, distributed,\
            \ or advertised."
          items:
            $ref: '#/components/schemas/BgpCommunity'
          type: array
        bgpExtendedCommunityList:
          description: "Mechanism for labeling information carried in BGP-4. Provide\
            \ enhancement over existing BGP Community Attribute an extended range,\
            \ the addition of type field."
          items:
            $ref: '#/components/schemas/BgpExtendedCommunity'
          type: array
        holdTime:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: Hold time in seconds. Indicates the agreed Hold Time used for
            BGP sessions. The possible values are 0 or an integer in the range 3-65535.
        damping:
          $ref: '#/components/schemas/Damping'
          description: "Route flap damping. When the Damping parameter is null, the\
            \ attribute is not set. When not null a single set of parameters described\
            \ in Section 4.3 of RFC 2430 MUST be agreed."
        asOverride:
          $ref: '#/components/schemas/EnabledDisabled'
          description: "Autonomous System Override. The SP (or Operator) can overwrite\
            \ instances of the Subscriber's AS Number in the AS Path with their own\
            \ AS Number, when advertising routes to the Subscriber. This needs to\
            \ be explicitly agreed between the SP and the Subscriber, and/or between\
            \ an SP/SO and an Operator."
        administrativeDistance:
          description: BGP Administrative Distance.
          minimum: 1
          type: integer
      type: object
    BgpCommunity:
      description: |
        A community is a group of destinations which share some common property. Each autonomous system administrator may define which communities a destination belongs to.
      properties:
        autonomousSystemNumber:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: The first two octets encoding the Autonomous System value.
        autonomousSystemDefined:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: The remaining octets.
        semantics:
          description: Text describing how the Seller will handle routes tagged with
            this Community
          type: string
      type: object
    BgpExtendedCommunity:
      description: "This attribute provides a mechanism for labeling information carried\
        \ in BGP-4. These labels can be used to control the distribution of this information,\
        \ or for other applications."
      oneOf:
      - required:
        - regularType
        - regularValue
      - required:
        - extendedType
        - extendedValue
      properties:
        regularType:
          description: "Regular Type Field, 1 octet length"
          maximum: 255
          minimum: 0
          type: integer
        regularValue:
          description: Octets 2 - 8 of the value part of the address. Used in case
            only Regular Type is provided.
          minimum: 0
          type: integer
        extendedType:
          $ref: '#/components/schemas/TwoOctetInteger'
          description: "Extended Type Field, 2 octets length"
        extendedValue:
          description: Octets 3 - 8 of the value part of the address. Used in case
            only Extended Type is provided.
          minimum: 0
          type: integer
        semantics:
          description: Text describing how the Seller will handle routes tagged with
            this Community
          type: string
      type: object
    BurstBehavior:
      description: |
        Enumeration used to select the Bandwidth Profile Flow Burst Behavior
        attribute. Reference MEF 61.1 Section 17.3 Table 29 Bandwidth Profile
        Parameters for a Bandwidth Profile Flow.
        - OPTIMIZE_DELAY: Enumeration representing the Burst Behavior of optimization of delay.
        - OPTIMIZE_THROUGHPUT: Enumeration representing the Burst Behavior of optimization of throughput.
      enum:
      - OPTIMIZE_DELAY
      - OPTIMIZE_THROUGHPUT
      type: string
    BusSofType:
      description: An enumeration with BUS and SOF values.
      enum:
      - bus
      - sof
      type: string
    ClassOfServiceMapEntry:
      description: "Values for the Cloud Ingress Class of Service Map. Reference MEF\
        \ 61.1 Table 11 - Values for the Cloud Ingress Class of Service Map, 11.0\
        \ IPVC EP Ingress Class of Service Map Service Attribute."
      properties:
        cosName:
          description: Class of Service name
          type: string
        destinationIpAddress:
          $ref: '#/components/schemas/Ipv4Prefix'
          description: Destination IP Address
        destinationL4Port:
          description: Destination Layer 4 Port
          type: integer
        ethernetPcp:
          description: Ethernet PCP value
          maximum: 7
          minimum: 0
          type: integer
        ipds:
          description: DSCP value
          maximum: 63
          minimum: 0
          type: integer
        l4protocol:
          description: Layer 4 Protocol
          type: integer
        sourceIpAddress:
          $ref: '#/components/schemas/Ipv4Prefix'
          description: Source IP Address
        sourceL4Port:
          description: Source Layer 4 Port
          type: integer
      type: object
    CloudDataLimit:
      description: "Specifies an absolute limit on the amount of data the Subscriber\
        \ can transmit to, or receive from, the cloud service in a given time period.\
        \ It is either Unlimited or a 4-tuple (scdl, tcdl, ucdl, dcdl).  Reference\
        \ MEF 61.1 Section 10.13.3 Cloud Data Limit."
      properties:
        download:
          description: "An integer indicating a limit, in octets, on the amount of\
            \ IP traffic received from the cloud service that can be delivered to\
            \ the Subscriber during each time interval described by startTime and\
            \ duration."
          type: integer
        duration:
          $ref: '#/components/schemas/TimeDuration'
          description: "Specifies a duration. Together with the start time, it describes\
            \ a service of contiguous time intervals, starting at the specified start\
            \ time and each lasting for the specified duration."
        startTime:
          description: Specifies a start time.
          format: date-time
          type: string
        upload:
          description: "An integer indicating a limit, in octets, on the amount of\
            \ IP traffic that can be transmitted towards the cloud service during\
            \ each time interval described by startTime and duration."
          type: integer
      required:
      - download
      - duration
      - startTime
      - upload
      type: object
    CloudDns:
      description: "Data type representing a Domain Name System. Reference MEF 69.1\
        \ Section\n9.1\n[R13]  For an Internet Access Service, if the Cloud DNS parameter\
        \ of the\nIPVC Cloud Service Attribute is STATIC, the associated list of DNS\
        \ Servers\nMUST have at least one entry. \n[D4] For an Internet Access Service,\
        \ if the Cloud DNS parameter of the\nIPVC Cloud Service Attribute is STATIC,\
        \ the associated list of DNS Servers\nSHOULD contain at least two DNS servers.\n"
      properties:
        dnsServerIpv4List:
          description: DNS server list an IPv4 addresses
          items:
            type: string
          type: array
        dnsServerIpv6List:
          description: DNS server list an IPv6 addresses
          items:
            type: string
          type: array
        dnsType:
          $ref: '#/components/schemas/DnsType'
          description: Domain Name System type.
      required:
      - dnsType
      type: object
    CloudType:
      description: "Indicates the type of cloud service being accessed. Reference\
        \ MEF 61.1 Table 10 \nSubscriber IPVC Cloud Service Attribute.\n- INTERNET_ACCESS:\
        \ Indicates the cloud access IPVC is used to access the public Internet.\n\
        - PRIVATE: Indicates the cloud access IPVC provides a direct connection over\
        \ the Service Provider's network to a cloud service.\n"
      enum:
      - INTERNET_ACCESS
      - PRIVATE
      type: string
    ConnectionAddressFamily:
      description: Specifies whether the session is established over IPv4 or IPv6
        or whether two separate session are established using IPv4 and IPv6.
      enum:
      - IPV4
      - IPv6
      - BOTH
      type: string
    ConnectionType:
      description: |
        An enumeration representing the connection type.
        - POINT_TO_POINT indicates that the link is logically point to Point.
        - MULTIPOINT indicates the link is logically multipoint.
      enum:
      - POINT_TO_POINT
      - MULTIPOINT
      type: string
    ControlProtocols:
      description: "Data type representing Control Protocols. Each entry consists\
        \ of a 3-tuple containing the protocol name, addressing information (either\
        \ SP/Operator Addresses or Any) and one or more references. Reference MEF\
        \ 61.1 Section 12.6 UNI List of Control Protocols Service Attribute"
      properties:
        addressing:
          $ref: '#/components/schemas/Addressing'
        protocolName:
          type: string
        reference:
          items:
            type: string
          minItems: 1
          type: array
      type: object
    Damping:
      description: "Damping parameters as defined in RFC 2439 BGP Route Flap Damping,\
        \ Section 4.2"
      properties:
        cutoffThreshold:
          description: This value is expressed as a number of route withdrawals.  It
            is the value above which a route advertisement will be suppressed.
          type: integer
        decayHalfLifeWhileReachable:
          description: This value is the time duration in seconds during which the
            accumulated stability figure of merit will be reduced by half if the route
            if considered reachable (whether suppressed or not).
          type: integer
        decayHalfLifeWhileUnReachable:
          description: "This value is the time duration in seconds during which the\
            \ accumulated stability figure of merit will be reduced by half if the\
            \ route if considered unreachable.  If not specified or set to zero, no\
            \ decay will occur while a route remains unreachable."
          type: integer
        decayMemoryLimit:
          description: "This is the maximum time (in seconds) that any memory of previous\
            \ instability will be retained given that the route's state remains unchanged,\
            \ whether reachable or unreachable.  This parameter is generally used\
            \ to determine array sizes."
          type: integer
        maxHoldDownTime:
          description: This value is the maximum time a route can be suppressed no
            matter how unstable it has been prior to this period of stability. In
            seconds.
          type: integer
        numberOfReuseLists:
          description: This is the number of reuse lists.  It may be determined from
            reuse-list-max or set explicitly.
          type: integer
        reuseListMemoryReuseListMax:
          description: This is the time (in seconds) value corresponding to the last
            reuse list. This may be the maximum value of T-hold for all parameter
            sets of may be configured.
          type: integer
        reuseListTimeGranularity:
          description: This is the time (in seconds) interval between evaluations
            of the reuse lists.  Each reuse lists corresponds to an additional time
            increment.
          type: integer
        reuseThreshold:
          description: This value is expressed as a number of route withdrawals.  It
            is the value below which a suppressed route will now be used again.
          type: integer
        timeGranularity:
          description: This is the time granularity in seconds used to perform all
            decay computations.
          type: integer
      type: object
    Demux:
      description: Is a value that is specific to each type of UNI Access Link Trunk
        and indicates which Layer 2 sub-channel should be select for this UNI Acces
        Link.
      properties:
        utpt:
          description: Untagged and priority tagged frames.
          type: boolean
        vlanId:
          description: VLAN ID.
          items:
            $ref: '#/components/schemas/VlanId'
          minItems: 0
          type: array
      type: object
    DhcpRelay:
      description: "Dynamic Host Configuration Protocol (DHCP) Relay functionality\
        \ is useful when the Subscriber uses DHCP (per RFC 2131[15] and RFC 8415[24])\
        \ in the Subscriber Network but does not want to place a DHCP server (or possibly\
        \ a pair of redundant DHCP servers) in each part of the network."
      properties:
        dhcpServerList:
          description: Non-empty list of IP addresses for DHCP Servers belonging to
            the Subscriber. Reference MEF 61.1 Section 13.6 UNI Access Link DHCP Relay
            Server Attribute.
          items:
            $ref: '#/components/schemas/DhcpServer'
          minItems: 1
          type: array
        ipvcEndPointIdentifier:
          description: IPVC identifier as described in MEF 61.1 Section 11.1.
          maxLength: 53
          type: string
      required:
      - dhcpServerList
      - ipvcEndPointIdentifier
      type: object
    DhcpServer:
      description: Data type representing a DHCP Server
      properties:
        ipv4Address:
          description: DHCP Server IPv4 address.
          type: string
        ipv6Address:
          description: DHCP Server IPv6 address.
          type: string
      type: object
    DnsType:
      description: Enumeration representing the different types of DNS.
      enum:
      - DHCP
      - PPP
      - STATIC
      - SLAAC
      type: string
    Duration:
      description: "A Duration in a given unit of time e.g. 3 hours, or 5 days."
      properties:
        amount:
          description: "Duration (number of seconds, minutes, hours, etc.)"
          type: integer
        units:
          $ref: '#/components/schemas/TimeUnit'
      required:
      - amount
      - units
      type: object
    EnabledDisabled:
      description: Enumeration to indicate Enabled/Disabled state of an attribute
      enum:
      - ENABLED
      - DISABLED
      type: string
    EndPointIdentifierAndCosName:
      description: Data type representing IPVC End Point Identifier and CoS name use
        for Bandwidth Profiles.
      properties:
        cosName:
          type: string
        ipvcEndPointIdentifier:
          type: string
      type: object
    EnniIpv4ConnectionAddressing:
      description: "The ENNI Link IPv4 Connection Addressing specifies how IPv4 addresses\
        \ are allocated  to the devices connected to the ENNI Link. It is either NONE\
        \ or STATIC, plus in the  case of STATIC, some additional parameters. Reference\
        \ MEF 61.1 Section 16.3 ENNI  Link IPv4 Connection Addressing Attribute."
      properties:
        enniLinkIpv4AddressType:
          $ref: '#/components/schemas/EnniLinkIpv4AddressType'
        ipv4PrimarySubnet:
          $ref: '#/components/schemas/EnniIpv4Subnet'
        ipv4SecondarySubnetList:
          items:
            $ref: '#/components/schemas/EnniIpv4Subnet'
          minItems: 0
          type: array
      type: object
    EnniIpv4Subnet:
      description: Data type representing IPv4 Subnet for ENNI Links. Reference MEF
        61.1 Section 16.3 ENNI Link IPv4 Connection Addressing Attribute.
      properties:
        ipv4Prefix:
          $ref: '#/components/schemas/Ipv4Prefix'
        firstLloIpv4Address:
          description: First LLO (Lowest Level Operator IPv4 Address.
          type: string
        secondLloIpv4Address:
          description: Second LLO (Lowest Level Operator IPv4 Address.
          type: string
      type: object
    EnniIpv6ConnectionAddressing:
      description: "The ENNI Link IPv4 Connection Addressing specifies how IPv4 addresses\
        \ are allocated to the devices connected to the ENNI Link. It is either NONE\
        \ or STATIC, plus in the case of STATIC, some additional parameters. Reference\
        \ MEF 61.1 Section 16.3 ENNI Link IPv4 Connection Addressing Attribute."
      properties:
        enniLinkIpv6AddressType:
          $ref: '#/components/schemas/EnniLinkIpv6AddressType'
        ipv6Subnet:
          $ref: '#/components/schemas/EnniIpv6Subnet'
      type: object
    EnniIpv6Subnet:
      description: "Data type representing IPv6 Subnet for ENNI Links. Reference MEF\
        \ 61.1[1] Section 16.4 ENNI Link IPv6 Connection Addressing Attribute."
      properties:
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
        firstLloIpv6Address:
          description: First LLO (Lowest Level Operator IPv6 Address.
          type: string
        secondLloIpv6Address:
          description: Second LLO (Lowest Level Operator IPv6 Address.
          type: string
      type: object
    EnniLinkIpv4AddressType:
      description: Enumeration to indicate ENNI Liink IPv4 Address Type.
      enum:
      - STATIC
      type: string
    EnniLinkIpv6AddressType:
      description: Enumeration to indicate ENNI Liink IPv6 Address Type.
      enum:
      - STATIC
      - LL_ONLY
      type: string
    Error:
      description: |
        Standard Class used to describe API response error Not intended to be used directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        message:
          description: Text that provides mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        reason:
          description: Text that explains the reason for the error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        referenceError:
          description: URL pointing to documentation describing the error
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: |-
        One of the following error codes:
        - missingQueryParameter: The URI is missing a required query-string parameter
        - missingQueryValue: The URI is missing a required query-string parameter value
        - invalidQuery: The query section of the URI is invalid.
        - invalidBody: The request has an invalid body
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. This code indicates that the server understood the request
        but refuses to authorize it. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: |-
        This code indicates that the server understood
        the request but refuses to authorize it because
        of one of the following error codes:
        - accessDenied: Access denied
        - forbiddenRequester: Forbidden requester
        - tooManyUsers: Too many users
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - notFound: A current representation for the target resource not found
            enum:
            - notFound
            type: string
        required:
        - code
        type: object
      description: Resource for the requested path not found. (https://tools.ietf.org/html/rfc7231#section-6.5.4)
    Error422:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error422Code'
          propertyPath:
            description: |
              A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.
              Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).
            type: string
        required:
        - code
        type: object
      description: Unprocessable entity due to a business validation problem. (https://tools.ietf.org/html/rfc4918#section-11.2)
    Error422Code:
      description: |
        One of the following error codes:
        - missingProperty: The property that was expected is not present in the payload
        - invalidValue: The property has an incorrect value
        - invalidFormat: The property value does not comply with the expected value format
        - referenceNotFound: The object referenced by the property cannot be identified in the target system
        - unexpectedProperty: Additional, not expected property has been provided
        - tooManyRecords: the number of records to be provided in the response exceeds the  threshold.
        - otherIssue: Other problem was identified (detailed information provided in a reason)
      enum:
      - missingProperty
      - invalidValue
      - invalidFormat
      - referenceNotFound
      - unexpectedProperty
      - tooManyRecords
      - otherIssue
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - internalError: Internal server error - the server encountered an unexpected condition that prevented it from fulfilling the request.
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    EventSubscription:
      description: |
        This resource is used to respond to notification subscriptions.
      properties:
        callback:
          description: The value provided by in `EventSubscriptionInput` during notification
            registration
          type: string
        id:
          description: An identifier of this Event Subscription assigned when a resource
            is created.
          type: string
        query:
          description: The value provided by the `EventSubscriptionInput` during notification
            registration
          type: string
      required:
      - callback
      - id
      type: object
    EventSubscriptionInput:
      description: This class is used to register for Notifications.
      properties:
        callback:
          description: "This callback value must be set to *host* property from Service\
            \ Order Notification API (serviceOrderNotification.api.yaml). This property\
            \ is appended with the base path and notification resource path specified\
            \ in that API to construct an URL to which notification is sent. E.g.\
            \ for \"callback\": \"https://bus.com/listenerEndpoint\", the service\
            \ order state change event notification will be sent to: `https://bus.com/listenerEndpoint/mefApi/legato/serviceOrderingManagement/v5/listener/serviceOrderStateChangeEvent`"
          type: string
        query:
          description: "This attribute is used to define to which type of events to\
            \ register to. Example: \"query\":\"eventType = serviceOrderStateChangeEvent\"\
            . To subscribe for more than one event type, put the values separated\
            \ by comma: `eventType=serviceOrderStateChangeEvent,serviceOrderItemStateChangeEvent`.\
            \ The possible values are enumerated by 'serviceOrderEventType' in serviceOrderNotification.api.yaml.\
            \ An empty query is treated as specifying no filters - ending in subscription\
            \ for all event types."
          type: string
      required:
      - callback
      type: object
    FieldedAddress:
      allOf:
      - $ref: '#/components/schemas/RelatedPlaceRefOrValue'
      - properties:
          city:
            description: The city that the address is in
            type: string
          country:
            description: Country that the address is in
            type: string
          geographicSubAddress:
            $ref: '#/components/schemas/GeographicSubAddress'
          locality:
            description: The locality that the address is in
            type: string
          postcode:
            description: "Descriptor for a postal delivery area, used to speed and\
              \ simplify the delivery of mail (also known as zip code)"
            type: string
          postcodeExtension:
            description: An extension of a postal code. E.g. the part following the
              dash in a US urban property address
            type: string
          stateOrProvince:
            description: The State or Province that the address is in
            type: string
          streetName:
            description: Name of the street or other street type
            type: string
          streetNr:
            description: Number identifying a specific property on a public street.
              It may be combined with streetNrLast for ranged addresses. MEF 79 defines
              it as required however as in certain countries it is not used we make
              it optional in API.
            type: string
          streetNrLast:
            description: Last number in a range of street numbers allocated to a property
            type: string
          streetNrLastSuffix:
            description: Last street number suffix for a ranged address
            type: string
          streetNrSuffix:
            description: The first street number suffix
            type: string
          streetSuffix:
            description: A modifier denoting a relative direction
            type: string
          streetType:
            description: "The type of street (e.g., alley, avenue, boulevard, brae,\
              \ crescent, drive, highway, lane, terrace, parade, place, tarn, way,\
              \ wharf)"
            type: string
        required:
        - city
        - country
        - streetName
        type: object
      description: "A type of Address that has a discrete field and value for each\
        \ type of boundary or identifier down to the lowest level of detail. For example\
        \ \"street number\" is one field, \"street name\" is another field, etc. Reference:\
        \ MEF 79 (Sn 8.9.2)"
    FieldedAddressValue:
      description: "A type of Address that has a discrete field and value for each\
        \ type of boundary or identifier down to the lowest level of detail. For example\
        \ \"street number\" is one field, \"street name\" is another field, etc. Reference:\
        \ MEF 79 (Sn 8.9.2)"
      properties:
        city:
          description: The city that the address is in
          type: string
        country:
          description: Country that the address is in
          type: string
        geographicSubAddress:
          $ref: '#/components/schemas/GeographicSubAddress'
        locality:
          description: The locality that the address is in
          type: string
        postcode:
          description: "Descriptor for a postal delivery area, used to speed and simplify\
            \ the delivery of mail (also known as zip code)"
          type: string
        postcodeExtension:
          description: An extension of a postal code. E.g. the part following the
            dash in a US urban property address
          type: string
        stateOrProvince:
          description: The State or Province that the address is in
          type: string
        streetName:
          description: Name of the street or other street type
          type: string
        streetNr:
          description: Number identifying a specific property on a public street.
            It may be combined with streetNrLast for ranged addresses. MEF 79 defines
            it as required however as in certain countries it is not used we make
            it optional in API.
          type: string
        streetNrLast:
          description: Last number in a range of street numbers allocated to a property
          type: string
        streetNrLastSuffix:
          description: Last street number suffix for a ranged address
          type: string
        streetNrSuffix:
          description: The first street number suffix
          type: string
        streetSuffix:
          description: A modifier denoting a relative direction
          type: string
        streetType:
          description: "The type of street (e.g., alley, avenue, boulevard, brae,\
            \ crescent, drive, highway, lane, terrace, parade, place, tarn, way, wharf)"
          type: string
      required:
      - city
      - country
      - streetName
      type: object
    FormattedAddress:
      allOf:
      - $ref: '#/components/schemas/RelatedPlaceRefOrValue'
      - properties:
          addrLine1:
            description: The first address line in a formatted address
            type: string
          addrLine2:
            description: The second address line in a formatted address
            type: string
          city:
            description: The city that the address is in
            type: string
          country:
            description: Country that the address is in
            type: string
          locality:
            description: "An area of defined or undefined boundaries within a local\
              \ authority or other legislatively defined area, usually rural or semi-rural\
              \ in nature"
            type: string
          postcode:
            description: "Descriptor for a postal delivery area, used to speed and\
              \ simplify the delivery of mail (also known as ZIP code)"
            type: string
          postcodeExtension:
            description: An extension of a postal code. E.g. the part following the
              dash in an US urban property address
            type: string
          stateOrProvince:
            description: The State or Province that the address is in
            type: string
        required:
        - addrLine1
        - city
        - country
        type: object
      description: "A type of Address that has discrete fields for each type of boundary\
        \ or identifier with the exception of street and more specific location details,\
        \ which are combined into a maximum of two strings based on local postal addressing\
        \ conventions. Reference: MEF 79 (Sn 8.9.3)"
    ForwardingInformation:
      description: "Forwarding information, consisting of either a nexthop IP address\
        \ in the Subscriber Network (if the access medium is multipoint capable, e.g.,\
        \ Ethernet), or a specific UNI Access Link (if the access medium is strictly\
        \ point-to-point, e.g., HDLC,  PPP over DSL)."
      properties:
        nextHopIpAddress:
          description: Next hop IP address.
          type: string
        uniAccessLink:
          description: UNI Access Link unique identifier.
          maxLength: 53
          type: string
      type: object
    FourOctetInteger:
      description: A four-octet value range integer 0-2147483647
      maximum: 2147483647
      minimum: 0
      type: integer
    GeographicAddressLabel:
      allOf:
      - $ref: '#/components/schemas/RelatedPlaceRefOrValue'
      - properties:
          externalReferenceId:
            description: A reference to an address by id
            type: string
          externalReferenceType:
            description: Uniquely identifies the authority that specifies the addresses
              reference and/or its type (if the authority specifies more than one
              type of address). The value(s) to be used are to be agreed during the
              onboarding. For North American providers this would normally be CLLI
              (Common Language Location Identifier) code.
            type: string
        required:
        - externalReferenceId
        - externalReferenceType
        type: object
      description: "A unique identifier controlled by a generally accepted independent\
        \ administrative authority that specifies a fixed geographical location. Reference:\
        \ MEF 79 (Sn 8.9.4)"
    GeographicAddressRef:
      allOf:
      - $ref: '#/components/schemas/RelatedPlaceRefOrValue'
      - properties:
          href:
            description: |
              Hyperlink to the referenced GeographicAddress. Hyperlink MAY be provided by the SOF in responses. Hyperlink MUST be ignored by the SOF in case it is provided by the BA in a request
            type: string
          id:
            description: Identifier of the referenced Geographic Address. This identifier
              is assigned during a successful address validation request (Geographic
              Address Validation API)
            type: string
        required:
        - id
        type: object
      description: |
        A reference to a Geographic Address resource available through Address Validation API.
    GeographicPoint:
      allOf:
      - $ref: '#/components/schemas/RelatedPlaceRefOrValue'
      - properties:
          spatialRef:
            description: The spatial reference system used to determine the coordinates
              (e.g. "WGS84"). The system used and the value of this field are to be
              agreed during the onboarding process.
            type: string
          x:
            description: The latitude expressed in the format specified by the `spacialRef`
            type: string
          "y":
            description: The longitude expressed in the format specified by the `spacialRef`
            type: string
          z:
            description: The elevation expressed in the format specified by the `spacialRef`
            type: string
        required:
        - spatialRef
        - x
        - "y"
        type: object
      description: |
        A GeographicPoint defines a geographic point through coordinates. Reference: MEF 79 (Sn 8.9.5)
    GeographicSiteRef:
      allOf:
      - $ref: '#/components/schemas/RelatedPlaceRefOrValue'
      - properties:
          href:
            description: |
              Hyperlink to the referenced GeographicSite. Hyperlink MAY be provided by the SOF in responses. Hyperlink MUST be ignored by the SOF in case it is provided by the BA in a request
            type: string
          id:
            description: Identifier of the referenced Geographic Site.
            type: string
        required:
        - id
        type: object
      description: |
        A reference to a Geographic Site resource available through Service Site API
    GeographicSubAddress:
      description: "Additional fields used to specify an address, as detailed as possible."
      properties:
        buildingName:
          description: |
            Allows for identification of places that require building name  as part of addressing information
          type: string
        levelNumber:
          description: "Used where a level type may be repeated e.g. BASEMENT 1, BASEMENT\
            \ 2"
          type: string
        levelType:
          description: Describes level types within a building
          type: string
        privateStreetName:
          description: '"Private streets internal to a property (e.g. a university)
            may have internal names that are not recorded by the land title office'
          type: string
        privateStreetNumber:
          description: Private streets numbers internal to a private street
          type: string
        subUnit:
          description: "Representation of a MEFSubUnit It is used for describing subunit\
            \ within a subAddress e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT,\
            \ WHARF."
          items:
            $ref: '#/components/schemas/GeographicSubAddressUnit'
          type: array
      type: object
    GeographicSubAddressUnit:
      description: Allows for sub unit identification
      properties:
        subUnitNumber:
          description: "The discriminator used for the subunit, often just a simple\
            \ number but may also be a range."
          type: string
        subUnitType:
          description: "The type of subunit e.g.BERTH, FLAT, PIER, SUITE, SHOP, TOWER,\
            \ UNIT, WHARF."
          type: string
      required:
      - subUnitNumber
      - subUnitType
      type: object
    HeaderFieldTypes:
      description: "HeaderFieldTypes is an enumeration for fields defined in MEF 61.1[1]\
        \ Section 10.13.2 Cloud Ingress Class of Service Map."
      enum:
      - SOURCE_IP_ADDRESS
      - DESTINATION_IP_ADDRESS
      - L4_PROTOCOL
      - SOURCE_L4_PORT
      - DESTINATION_L4_PORT
      - ETHERNET_PCP
      - IP_DS
      type: string
    InformationRate:
      description: A value and a unit of measure that specifies an Information Rate.
      properties:
        irValue:
          description: The value in the information rate. For example if the information
            rate is 70 kbps this element is 70.
          minimum: 0
          type: number
        irUnits:
          $ref: '#/components/schemas/IrUnits'
          description: "The unit of measure for the Information Rate. For example\
            \ if the Information Rate is 70KBPS this element is KBPS. Note that the\
            \ values are decimal values. 1 KBPS is 1000 bits per second and 1MBPS\
            \ is 1,000,000 bits per second."
      type: object
    IngressClassOfServiceMap:
      description: "Is a triple (F,M,D) where F is a list of one or more fields in\
        \ the packet  header that are used to de-termine the CoS Name, M is a mapping\
        \ from combinations  of values of those fields to CoS Names, and D is a default\
        \ CoS Name used when the  map cannot be applied.  Reference MEF 61.1 Section\
        \ 10.13.2 Cloud Ingress Class  of Service Map and Section 11.10 IPVC EP Egress\
        \ Class of Service Map Service Attribute."
      properties:
        defaultCosName:
          description: Default Class of Service Name. Reference MEF 61.1 Section 10.13.2
            Cloud Ingress Class of Service Map and Section 11.9 IPVC EP Ingress Class
            of  Service Map Service Attribute.
          type: string
        headerFieldTypes:
          items:
            $ref: '#/components/schemas/HeaderFieldTypes'
          minItems: 1
          type: array
        ingressClassOfServiceMapping:
          items:
            $ref: '#/components/schemas/ClassOfServiceMapEntry'
          minItems: 0
          type: array
      type: object
    IpBwpEnvelope:
      description: "A BWP Envelope is a list of Bandwidth Profile Flows, plus additional\
        \ parameters for the BWP as a whole. A BWP Envelope is a set of one or more\
        \ BWP Flows that are associated such that the amount of traffic for one flow\
        \ can affect the amount that is permitted for another flow. Reference MEF\
        \ 61.1 Section 17.3 Bandwidth Profile Envelopes."
      properties:
        maxIrE:
          $ref: '#/components/schemas/InformationRate'
        tE:
          description: The Envelope IR Time in milliseconds. This is the time period
            over which average Information Rates are calculated and thus it limits
            the size of a burst. Reference MEF 61.1 Section 17.3 Bandwidth Profile
            Envelopes.
          type: integer
